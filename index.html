    function groupComponentsByOwner(items) {
      const list = Array.isArray(items) ? items : [];
      const byName = {};
      for (let i = 0; i < list.length; i += 1) {
        if (list[i] && list[i].name) byName[list[i].name] = list[i];
      }
      const foodOrder = (LITERATURE.foods || []).map((item) => item.name);
      const pollenOrder = (LITERATURE.pollen || []).map((item) => item.name);
      const ownerOrder = foodOrder.slice();
      for (let p = 0; p < pollenOrder.length; p += 1) {
        if (ownerOrder.indexOf(pollenOrder[p]) < 0) ownerOrder.push(pollenOrder[p]);
      }
      const buckets = {};
      const mapped = {};
      const ownerNames = Object.keys(COMPONENT_OWNER);
      for (let c = 0; c < ownerNames.length; c += 1) {
        const compName = ownerNames[c];
        const item = byName[compName];
        if (!item) continue;
        mapped[compName] = true;
        const owners = COMPONENT_OWNER[compName];
        for (let o = 0; o < owners.length; o += 1) {
          const owner = owners[o];
          if (!buckets[owner]) buckets[owner] = [];
          let exists = false;
          for (let e = 0; e < buckets[owner].length; e += 1) {
            if (buckets[owner][e].name === compName) { exists = true; break; }
          }
          if (!exists) buckets[owner].push(item);
        }
      }
      const groups = [];
      for (let i = 0; i < ownerOrder.length; i += 1) {
        const owner = ownerOrder[i];
        if (buckets[owner] && buckets[owner].length) groups.push([owner, buckets[owner]]);
      }
      const leftoverOwners = Object.keys(buckets);
      for (let L = 0; L < leftoverOwners.length; L += 1) {
        const owner = leftoverOwners[L];
        if (ownerOrder.indexOf(owner) >= 0) continue;
        if (buckets[owner] && buckets[owner].length) groups.push([owner, buckets[owner]]);
      }
      const other = [];
      for (let i = 0; i < list.length; i += 1) {
        const item = list[i];
        if (item && item.name && !mapped[item.name]) other.push(item);
      }
      if (other.length) groups.push(["기타", other]);
      return groups;
    }

    function groupFoodItems(items) {
      const fruits = [];
      const vegetables = [];
      const nuts = [];
      const other = [];
      const list = Array.isArray(items) ? items : [];
      for (let i = 0; i < list.length; i += 1) {
        const item = list[i];
        const name = item && item.name;
        if (!name || FOOD_FISH[name] || FOOD_MEAT[name]) continue;
        if (FOOD_FRUITS[name]) fruits.push(item);
        else if (FOOD_VEGETABLES[name]) vegetables.push(item);
        else if (FOOD_NUTS[name]) nuts.push(item);
        else other.push(item);
      }
      return [
        ["과일", fruits],
        ["채소", vegetables],
        ["견과류", nuts],
        ["그외", other]
      ];
    }

    function notesCohortBrowseItems(cohortMap) {
      const foodList = LITERATURE.foods || [];
      const names = Object.keys(cohortMap || {}).sort((a, b) => a.localeCompare(b, "ko"));
      const rows = [];
      for (let i = 0; i < names.length; i += 1) {
        const name = names[i];
        const id = literatureIdForName(foodList, name);
        rows.push({ name: name, id: id || ("notes-food:" + name), hasNote: !!id });
      }
      return rows;
    }

    function renderFoodGroupRows(rows, withNote) {

    function renderFoodGroups(items) {

    function renderNotesCohortBrowse(segment) {
      const fishMode = segment === "fish";
      const label = fishMode ? "생선 (notes)" : "육류 (α-Gal notes)";
      const aria = fishMode
        ? "Browse fish from cross-reactivity notes"
        : "Browse mammalian meats from α-Gal notes";
      const rows = notesCohortBrowseItems(fishMode ? FOOD_FISH : FOOD_MEAT);
      const open = state.foodGroupOpen === label || state.foodGroupOpen == null;
      /* Always show the notes cohort list for fish/meat — no plant browse. */
      let html = '<div class="food-browse food-browse-notes" aria-label="' + aria + '">';
      html += '<div class="food-group">' +
        '<button type="button" class="food-group-toggle" data-food-group="' + esc(label) +

        '<span class="food-group-label">' + esc(label) +
        '</span></span><span class="food-group-count">' + rows.length + "</span></button></div>";

        html += fishMode ? renderFishFleshSubgroups(rows) : renderFoodGroupRows(rows, false);
      }
      return html + "</div>";
    }

    function renderFoodsBrowseForSegment(segment) {
      const seg = normalizeFoodGraphSegment(segment);
      if (seg === "fish" || seg === "meat") return renderNotesCohortBrowse(seg);
      return renderFoodGroups(LITERATURE.foods);
    }

    function renderFoodsBlock() {
      const segment = normalizeFoodGraphSegment(state.foodGraphSegment || "foods");
      state.foodGraphSegment = segment;
      if (segment === "fish" || segment === "meat") {
        const expected = segment === "fish" ? "생선 (notes)" : "육류 (α-Gal notes)";
        if (state.foodGroupOpen === "과일" || state.foodGroupOpen === "채소" ||
            state.foodGroupOpen === "견과류" || state.foodGroupOpen === "그외") {
          state.foodGroupOpen = expected;
        }
      }
      return renderFoodGraphSegmentControl() + renderFoodsSchematicGraph() +
        renderFoodsBrowseForSegment(segment);

    function groupPollenItems(items) {
      const list = Array.isArray(items) ? items : [];
      const buckets = {};
      for (let i = 0; i < list.length; i += 1) {
        const item = list[i];
        const name = item && item.name;
        if (!name) continue;
        const key = POLLEN_CATEGORY_BY_NAME[name] || "other";
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(item);
      }
      const sections = [];
      for (let o = 0; o < POLLEN_CATEGORY_ORDER.length; o += 1) {
        const row = POLLEN_CATEGORY_ORDER[o];
        const rows = buckets[row.key];
        if (!rows || !rows.length) continue;
        sections.push({ key: row.key, label: row.label, items: rows });
        delete buckets[row.key];
      }
      /* Only emit leftover buckets that already exist in source data — no invented labels. */
      const leftovers = Object.keys(buckets);
      for (let l = 0; l < leftovers.length; l += 1) {
        const key = leftovers[l];
        const rows = buckets[key];
        if (!rows || !rows.length) continue;
        if (key === "other") continue;
        sections.push({ key: key, label: key, items: rows });
      }
      return sections;
    }

    function renderPollenListCard(title, items) {
      const head = title ? '<h3 class="group-title">' + esc(title) + "</h3>" : "";
      const sections = groupPollenItems(items);
      let body = "";
      for (let s = 0; s < sections.length; s += 1) {
        const section = sections[s];
        body += '<div class="allergen-cat-block">' +
          '<h4 class="allergen-cat-label">' + esc(section.label) + "</h4>";
        for (let j = 0; j < section.items.length; j += 1) {
          const item = section.items[j];
          body += '<div class="row"><span class="row-name">' + esc(item.name) + "</span>" +
            noteBtn(item.id) + "</div>";
        }
        body += "</div>";
      }
      if (!body) {
        body = (Array.isArray(items) ? items : []).map((item) =>
          '<div class="row"><span class="row-name">' + esc(item.name) + "</span>" + noteBtn(item.id) + "</div>"
        ).join("");
      }
      return '<section class="card group">' + head + body + "</section>";
    }

    function renderPollenBlock(titled) {
      const title = titled ? "Pollen and latex" : null;
      return renderPollenFoodGraph() + renderPollenListCard(title, LITERATURE.pollen);

    function sortComponentOwnerGroups(groups) {
      const rows = Array.isArray(groups) ? groups.slice() : [];
      rows.sort((a, b) => {
        const left = a && a[0] != null ? String(a[0]) : "";
        const right = b && b[0] != null ? String(b[0]) : "";
        if (left === "기타" && right !== "기타") return 1;
        if (right === "기타" && left !== "기타") return -1;
        return left.localeCompare(right, "ko");
      });
      for (let i = 0; i < rows.length; i += 1) {
        const comps = Array.isArray(rows[i][1]) ? rows[i][1].slice() : [];
        comps.sort((x, y) => String(x && x.name || "").localeCompare(String(y && y.name || ""), "ko"));
        rows[i] = [rows[i][0], comps];
      }
      return rows;
    }

    function renderComponentOwnerGroups(items) {
      const groups = sortComponentOwnerGroups(groupComponentsByOwner(items));
      let html = '<div class="food-browse food-browse-3col component-owner-browse" aria-label="Browse components by food">';
      for (let i = 0; i < groups.length; i += 1) {
        const label = groups[i][0];

          thumb + '<span class="food-group-label">' + esc(label) +

        if (open) {
          html += '<div class="food-group-list" role="list">';

              '" role="listitem" data-graph-focus-component="' + esc(item.name) +

    function renderComponentsBlock(titled) {
      const label = '<p class="allergen-group-label">항원/식품 이름별</p>';
      return renderComponentGraph() + label + renderComponentOwnerGroups(LITERATURE.components || []);

    /* === allergen-ui maa-35 start (search + focus graph) === */
    function allergenCatalog() {
      const out = [];
      function push(list, kind, segment) {
        const rows = Array.isArray(list) ? list : [];
        for (let i = 0; i < rows.length; i += 1) {
          const item = rows[i];
          if (!item || typeof item.name !== "string" || !item.name) continue;
          out.push({
            id: typeof item.id === "string" ? item.id : (kind + ":" + item.name),
            name: item.name,
            kind: kind,
            segment: segment,
            entry: item
          });
        }
      }
      push(LITERATURE.foods, "food", "foods");
      push(LITERATURE.pollen, "pollen", "pollen");
      push(LITERATURE.components, "component", "components");
      return out;
    }

    function allergenMatches(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return [];
      const catalog = allergenCatalog();
      const preferred = [];
      const other = [];
      for (let i = 0; i < catalog.length; i += 1) {
        const item = catalog[i];
        if (item.name.toLowerCase().indexOf(q) === -1) continue;
        if (item.segment === state.allergenSegment) preferred.push(item);
        else other.push(item);
      }
      return preferred.concat(other).slice(0, 8);
    }

    function exactAllergen(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return null;
      const catalog = allergenCatalog();
      for (let i = 0; i < catalog.length; i += 1) {
        if (catalog[i].name.toLowerCase() === q) return catalog[i];
      }
      return null;
    }

    function allergenSuggestionButtons(query) {
      return allergenMatches(query).map((item) =>
        '<button type="button" class="suggestion" data-pick-allergen="' + esc(item.id) + '">' +
        esc(item.name) + "</button>"
      ).join("");
    }

    function paintAllergenSuggestions() {
      const box = document.getElementById("allergen-suggestions");
      if (!box) return;
      box.innerHTML = allergenSuggestionButtons(state.allergenQuery);
    }

    function selectedAllergen() {
      if (!state.allergenId) return null;
      const catalog = allergenCatalog();
      for (let i = 0; i < catalog.length; i += 1) {
        if (catalog[i].id === state.allergenId) return catalog[i];
      }
      return null;
    }

    function selectAllergen(id) {
      const catalog = allergenCatalog();
      let hit = null;
      for (let i = 0; i < catalog.length; i += 1) {
        if (catalog[i].id === id) hit = catalog[i];
      }
      if (!hit) return;
      state.allergenId = hit.id;
      state.allergenQuery = "";
      state.allergenSegment = hit.segment;
      if (hit.segment === "foods") state.foodGraphSegment = "foods";
      render();
    }

    function clearAllergenFocus() {
      state.allergenId = null;
      state.allergenQuery = "";
    }

      return '<div class="drug-search allergen-search">' +

        '" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search an allergen">' +
        '<div class="suggestions" id="allergen-suggestions">' +
        allergenSuggestionButtons(state.allergenQuery) + "</div></div>";
    }

    function allergenHeader(item, inCard) {
      const kindLabel = item.kind === "component"
        ? "Component"
        : (item.kind === "pollen" ? "Pollen / latex" : "Food");
      const media = allergenNoteMedia(item);
      const hero = media
        ? '<figure class="note-hero allergen-result-hero">' +
          '<img src="' + esc(media.file) + '" alt="' + esc(media.alt || item.name) + '" loading="lazy">' +
          '<figcaption class="note-hero-credit">' + esc(media.credit) + "</figcaption>" +
          "</figure>"
        : "";
      const inner = '<div class="headline"><h2 class="screen-title">' + esc(item.name) + "</h2>" +

        hero +
        '<p class="subtitle">' + esc(kindLabel) + "</p>";
      return inCard ? '<section class="card header-card">' + inner + "</section>" : inner;
    }

    function statedComponentPartners(name) {
      const partners = [];
      const seen = {};
      for (let i = 0; i < COMPONENT_SOLID_LINKS.length; i += 1) {
        const pair = COMPONENT_SOLID_LINKS[i];
        let other = null;
        if (pair[0] === name) other = pair[1];
        else if (pair[1] === name) other = pair[0];
        if (!other || seen[other]) continue;
        seen[other] = 1;
        partners.push(other);
      }
      return partners;
    }

    function statedPollenFoodPartners(pollenName) {
      const foods = POLLEN_FOOD_ASSOCIATIONS[pollenName];
      return Array.isArray(foods) ? foods.slice() : [];
    }

    function statedFoodPollenPartners(foodName) {
      const partners = [];
      const keys = Object.keys(POLLEN_FOOD_ASSOCIATIONS);
      for (let i = 0; i < keys.length; i += 1) {
        const pollen = keys[i];
        const foods = POLLEN_FOOD_ASSOCIATIONS[pollen] || [];
        if (foods.indexOf(foodName) >= 0) partners.push(pollen);
      }
      return partners;
    }

    /* Food focus: only edges that name this food in source maps.
       Do NOT expand FOOD_FAMILY_COHORTS (that dumps co-members). */
    function statedFoodOwnedComponents(foodName) {
      const out = [];
      const names = Object.keys(COMPONENT_OWNER);
      for (let i = 0; i < names.length; i += 1) {
        const owners = COMPONENT_OWNER[names[i]] || [];
        if (owners.indexOf(foodName) >= 0) out.push(names[i]);
      }
      return out;
    }

    function statedFoodSharedComponentPartners(foodName) {
      const partners = [];
      const seen = {};
      const names = Object.keys(COMPONENT_OWNER);
      for (let i = 0; i < names.length; i += 1) {
        const owners = COMPONENT_OWNER[names[i]] || [];
        if (owners.indexOf(foodName) < 0) continue;
        for (let o = 0; o < owners.length; o += 1) {
          const other = owners[o];
          if (!other || other === foodName) continue;
          if (other === "라텍스" || POLLEN_OWNER_SET[other]) continue;
          if (seen[other]) continue;
          seen[other] = 1;
          partners.push(other);
        }
      }
      return partners;
    }

    function allergenFocusPartnerRows(item) {
      const rows = [];
      const seen = {};
      function add(name, relation, classKind, list, pending) {
        if (!name || seen[name]) return;
        seen[name] = 1;
        const noteId = literatureIdForName(list, name);
        rows.push({
          name: name,
          reason: relation,
          classKind: classKind,
          pendingRow: !!pending,
          noteId: noteId || ("stated:" + name),
          pickId: noteId
        });
      }
      if (item.kind === "component") {
        const partners = statedComponentPartners(item.name);
        for (let i = 0; i < partners.length; i += 1) {
          add(partners[i], "Stated solid link", componentClassKind(partners[i]), LITERATURE.components, true);
        }
      } else if (item.kind === "pollen") {
        const foods = statedPollenFoodPartners(item.name);
        for (let i = 0; i < foods.length; i += 1) {
          add(foods[i], "Stated pollen–food association", foodNodeClassKind(foods[i]), LITERATURE.foods, false);
        }
      } else {
        const pollens = statedFoodPollenPartners(item.name);
        for (let j = 0; j < pollens.length; j += 1) {
          add(pollens[j], "Stated pollen–food association", "pollen", LITERATURE.pollen, false);
        }
        const comps = statedFoodOwnedComponents(item.name);
        for (let c = 0; c < comps.length; c += 1) {
          add(comps[c], "Component (stated owner)", componentClassKind(comps[c]), LITERATURE.components, true);
        }
        const foods = statedFoodSharedComponentPartners(item.name);
        for (let i = 0; i < foods.length; i += 1) {
          add(foods[i], "Shared component (stated)", foodNodeClassKind(foods[i]), LITERATURE.foods, false);
        }
      }
      return rows;
    }

    function buildAllergenFocusGraphModel(item) {
      const partners = allergenFocusPartnerRows(item);
      const cap = GRAPH_NEIGHBOR_CAP;
      const picked = partners.slice(0, cap);
      const nodes = [{
        id: "center",
        label: item.name,
        kind: "center",
        pending: false,
        pickId: item.id
      }];
      const links = [];
      for (let i = 0; i < picked.length; i += 1) {
        const row = picked[i];
        const nodeId = "focus:" + row.name;
        nodes.push({
          id: nodeId,
          label: row.name,
          kind: "safer",
          classKind: row.classKind,
          pending: !!row.pendingRow,
          pickId: row.pickId
        });
        links.push({ source: "center", target: nodeId, kind: "assoc" });
      }
      return {
        nodes: nodes,
        links: links,
        empty: partners.length === 0,
        truncated: partners.length > picked.length,
        shown: picked.length,
        total: partners.length
      };
    }

    function renderAllergenFocusGraph(item) {
      const model = buildAllergenFocusGraphModel(item);
      const empty = model.empty
        ? '<p class="graph-empty">Not stated in source</p>'
        : "";
      const trunc = model.truncated
        ? '<p class="graph-note">Showing ' + model.shown + " of " + model.total + " stated neighbors</p>"
        : "";
      const expand = model.empty
        ? ""
        : '<button type="button" class="graph-expand-btn" data-graph-expand aria-label="Expand graph">크게 보기</button>';
      return '<section class="drug-graph" id="allergen-focus-graph" aria-label="Allergen cross-reactivity graph">' +
        '<div class="drug-graph-head">' +
        '<p class="drug-graph-hint">Neighbor → 조회 · empty tap expands</p>' +
        expand +
        "</div>" +
        '<canvas class="drug-graph-canvas" width="360" height="220" role="img" aria-label="Network of stated allergen relations"></canvas>' +
        empty +
        '<div class="graph-legend" aria-hidden="true">' +
        '<span class="legend-item legend-center"><i></i>Looked-up</span>' +
        '<span class="legend-item legend-fruit"><i></i>Food</span>' +
        '<span class="legend-item legend-nut"><i></i>견과류</span>' +
        '<span class="legend-item legend-pollen"><i></i>Pollen/latex</span>' +
        '<span class="legend-item legend-other"><i></i>Component</span>' +
        '<span class="legend-item legend-assoc"><i></i>Stated relation</span>' +
        '<span class="legend-item legend-pending"><i></i>Source pending</span>' +
        "</div>" + trunc + "</section>";
    }

    function mountAllergenFocusGraph(item) {
      if (!item) return;
      mountAllergenForceGraph("allergen-focus-graph", "allergen-focus", buildAllergenFocusGraphModel(item), {
        charge: 900,
        centerPull: 0.03,
        spring: 0.045,
        restFactor: 0.3,
        height: 230
      });
    }

    function renderAllergenFocusPairs(item) {
      const rows = allergenFocusPartnerRows(item);
      if (!rows.length) {
        return '<section class="card group"><h3 class="group-title">Stated relations</h3>' +
          '<p class="unstated">Not stated in source</p></section>';
      }
      const body = rows.map((row) => {
        const reason = row.reason
          ? '<span class="reason">' + esc(row.reason) + "</span>"
          : "";
        const pending = row.pendingRow
          ? '<span class="pending-mark">Source pending</span>'
          : "";
        return '<div class="row pair-row"><div class="row-text"><span class="row-name">' +
          esc(row.name) + "</span>" + reason + pending + "</div>" +
          noteBtn(row.noteId) + "</div>";
      }).join("");
      return '<section class="card group"><h3 class="group-title">Stated relations</h3>' + body + "</section>";
    }

    function renderAllergenFocus(item) {
      const header = allergenHeader(item, state.direction === "split");
      return header + renderAllergenFocusGraph(item) +
        '<div class="groups">' + renderAllergenFocusPairs(item) + "</div>";

    function renderAllergen() {

        '<button type="button" role="radio" data-allergen-segment="pollen" aria-checked="' + (state.allergenSegment === "pollen") + '">Pollen and latex</button>' +
        '<button type="button" role="radio" data-allergen-segment="components" aria-checked="' + (state.allergenSegment === "components") + '">Component names</button>';
      const segmentBar = state.direction === "segmented"
        ? '<div class="segment" role="radiogroup" aria-label="Pollen-food lists">' + segs + "</div>"
        : "";
