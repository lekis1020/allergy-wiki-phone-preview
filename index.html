    }

    function openDrugGraphExpand() {
      if (!drugGraphRuntime || !drugGraphRuntime.nodes) return;
      dismissGraphNodeMenu();
      closeDrugGraphExpand();
      const screen = document.querySelector(".screen");
      if (!screen) return;

      const overlay = document.createElement("div");
      overlay.className = "drug-graph-expand";
      overlay.id = "drug-graph-expand";
      overlay.setAttribute("role", "dialog");
      const mode = drugGraphRuntime.mode || "drug";
      let expandTitle = "Cross-reactivity";
      let expandAria = "Expanded network of stated safer and high pairs";
      let expandLabel = "Expanded cross-reactivity graph";
      if (mode === "component") {
        expandTitle = "Component links";
        expandAria = "Expanded network of stated solid component pairs";
        expandLabel = "Expanded component link graph";
      } else if (mode === "pollen-food") {
        expandTitle = "Pollen–food associations";
        expandAria = "Expanded network of stated pollen and food associations";
        expandLabel = "Expanded pollen-food association graph";
      } else if (mode === "foods-schematic") {
        expandTitle = "Food–food cross-reactivity";
        expandAria = "Expanded network of stated food-food shared-family links";
        expandLabel = "Expanded food-food cross-reactivity graph";
      } else if (mode === "foods-nuts") {
        expandTitle = "견과류 food–food links";
        expandAria = "Expanded network of stated food-food links involving nuts";
        expandLabel = "Expanded nut-touching food-food graph";
      }
      const expandLegend = expandLegendForMode(mode);
      overlay.setAttribute("aria-label", expandLabel);
      overlay.innerHTML =
        '<div class="drug-graph-expand-bar">' +
        '<p class="drug-graph-expand-title">' + expandTitle + "</p>" +
        '<button type="button" class="drug-graph-expand-close" data-graph-expand-close aria-label="Close expanded graph">닫기</button>' +
        "</div>" +
        '<canvas class="drug-graph-expand-canvas" width="360" height="520" role="img" aria-label="' + expandAria + '"></canvas>' +
        '<div class="graph-legend" aria-hidden="true">' + expandLegend + "</div>";
      screen.appendChild(overlay);

      const closeBtn = overlay.querySelector("[data-graph-expand-close]");
      if (closeBtn) {
        closeBtn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          closeDrugGraphExpand();
        });
      }

      const canvas = overlay.querySelector("canvas");
      if (!canvas) return;
      const bar = overlay.querySelector(".drug-graph-expand-bar");
      const legend = overlay.querySelector(".graph-legend");
      const padX = 16;
      const padY = 12;
      const width = Math.max(280, Math.floor(overlay.clientWidth - padX * 2));
      const height = Math.max(320, Math.floor(
        overlay.clientHeight -
        (bar ? bar.offsetHeight : 0) -
        (legend ? legend.offsetHeight : 0) -
        padY * 3
      ));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const runtime = drugGraphRuntime;
      const ow = Math.max(1, runtime.width);
      const oh = Math.max(1, runtime.height);
      const scale = Math.min(width / ow, height / oh);
      const offsetX = (width - ow * scale) / 2;
      const offsetY = (height - oh * scale) / 2;
      const scaledNodes = runtime.nodes.map((node) => ({
        id: node.id,
        label: node.label,
        kind: node.kind,
        classKind: node.classKind,
        classKey: node.classKey,
        classLabel: node.classLabel,
        classZoom: !!node.classZoom,
        pending: node.pending,
        pickId: node.pickId,
        dimmed: !!node.dimmed,
        selected: !!node.selected,
        x: node.x * scale + offsetX,
        y: node.y * scale + offsetY
      }));
      const byId = {};
      for (let i = 0; i < scaledNodes.length; i += 1) byId[scaledNodes[i].id] = scaledNodes[i];
      const scaledLinks = runtime.links.map((link) => ({
        kind: link.kind,
        source: byId[link.source.id],
        target: byId[link.target.id]
      })).filter((link) => link.source && link.target);
      const scaledClassLabels = Array.isArray(runtime.classLabels)
        ? runtime.classLabels.map((region) => {
          const scaled = {
            classKey: region.classKey,
            label: region.label,
            x: region.x * scale + offsetX,
            y: region.y * scale + offsetY,
            radius: (region.radius || 34) * scale
          };
          if (region.box && region.box.w && region.box.h) {
            scaled.box = {
              x: region.box.x * scale + offsetX,
              y: region.box.y * scale + offsetY,
              w: region.box.w * scale,
              h: region.box.h * scale,
              labelH: Math.max(16, (region.box.labelH || 18) * scale)
            };
          }
          return scaled;
        })
        : [];

      paintDrugGraphFrame(ctx, width, height, scaledNodes, scaledLinks, runtime.colors, true, {
        classLabels: scaledClassLabels,
        focusClassKey: runtime.focusClassKey || null
      });
      bindGraphCanvasPointer(
        canvas,
        overlay,
        function () { return scaledNodes; },
        function () { return { width: width, height: height }; },
        true,
        function () { return runtime; }
      );
    }

    function takeMixedRows(highRows, saferRows, cap) {
      const high = Array.isArray(highRows) ? highRows : [];
      const safer = Array.isArray(saferRows) ? saferRows : [];
      const total = high.length + safer.length;
      if (total <= cap) {
        return { high: high.slice(), safer: safer.slice(), truncated: false, total: total };
      }
      let highTake = Math.min(high.length, Math.ceil(cap / 2));
      let saferTake = Math.min(safer.length, cap - highTake);
      if (highTake + saferTake < cap) {
        highTake = Math.min(high.length, cap - saferTake);
      }
      if (highTake + saferTake < cap) {
        saferTake = Math.min(safer.length, cap - highTake);
      }
      return {
        high: high.slice(0, highTake),
        safer: safer.slice(0, saferTake),
        truncated: true,
        total: total
      };
    }

    function lookupIdForName(name) {
      const hit = exactDrug(name);
      return hit ? hit.id : null;
    }

    /* Class membership from drug_class.csv (Beta-lactam-crossreactivity). Unlisted → Source pending. */
    function drugClassInfoForName(name) {
      const table = typeof DRUG_CLASS_BY_NAME !== "undefined" ? DRUG_CLASS_BY_NAME : {};
      const hit = table[name];
      if (hit && hit.classKey) {
        return {
          classKey: hit.classKey,
          displayClass: hit.displayClass || hit.classKey,
          generation: hit.generation || null
        };
      }
      return {
        classKey: "pending",
        displayClass: "Source pending",
        generation: null
      };
    }

    function drugClassOrderKeys() {
      const order = typeof DRUG_CLASS_ORDER !== "undefined" ? DRUG_CLASS_ORDER : [];
      const keys = order.map((row) => row.classKey);
      if (keys.indexOf("pending") < 0) keys.push("pending");
      return keys;
    }

    function buildDrugClassBoxes(width, height, classKeys, memberCounts, zoomKey) {
      const keys = Array.isArray(classKeys) ? classKeys.filter(Boolean) : [];
      const boxes = {};
      if (!keys.length) return boxes;
      const counts = memberCounts && typeof memberCounts === "object" ? memberCounts : {};
      const labelH = 20;
      const margin = 4;
      const gap = 4;
      /* Clear focus drug + its label so no class title sits under Ampicillin. */
      const holeR = 56;

      if (zoomKey) {
        /* Leave a canvas rim so dimmed neighbors park outside the focus box. */
        const padX = 36;
        const padY = 32;
        const box = {
          x: padX,
          y: padY + 4,
          w: Math.max(120, width - padX * 2),
          h: Math.max(120, height - padY * 2 - 8),
          labelH: 24
        };
        boxes[zoomKey] = {
          box: box,
          bodyCx: box.x + box.w / 2,
          bodyCy: box.y + box.labelH + (box.h - box.labelH) / 2,
          spreadX: Math.max(24, (box.w - 28) / 2),
          spreadY: Math.max(18, (box.h - box.labelH - 28) / 2)
        };
        return boxes;
      }

      const cx = width / 2;
      const cy = height / 2;
      const n = keys.length;

      function slotCapacity(cols, rows) {
        const skipCenter = cols % 2 === 1 && rows % 2 === 1;
        return cols * rows - (skipCenter ? 1 : 0);
      }

      /* Prefer a ring of cells around an empty center so the focus drug stays free. */
      let cols = n <= 4 ? 2 : (n <= 8 ? 3 : 4);
      let rows = Math.ceil(n / cols);
      while (slotCapacity(cols, rows) < n) {
        if (cols < 4) cols += 1;
        else rows += 1;
      }
      if (slotCapacity(cols, rows) < n) {
        rows = Math.ceil((n + 1) / cols);
      }

      const skipCenter = cols % 2 === 1 && rows % 2 === 1;
      const centerCol = Math.floor(cols / 2);
      const centerRow = Math.floor(rows / 2);
      const slots = [];
      for (let r = 0; r < rows; r += 1) {
        for (let c = 0; c < cols; c += 1) {
          if (skipCenter && c === centerCol && r === centerRow) continue;
          slots.push({ col: c, row: r });
        }
      }

      const cellW = (width - margin * 2 - gap * (cols - 1)) / cols;
      const cellH = (height - margin * 2 - gap * (rows - 1)) / rows;
      const placed = [];

      function overlaps(a, list) {
        for (let i = 0; i < list.length; i += 1) {
          const b = list[i];
          if (
            a.x < b.x + b.w + gap &&
            a.x + a.w + gap > b.x &&
            a.y < b.y + b.h + gap &&
            a.y + a.h + gap > b.y
          ) return true;
        }
        return false;
      }

      function hitsHole(box) {
        const nearestX = Math.max(box.x, Math.min(cx, box.x + box.w));
        const nearestY = Math.max(box.y, Math.min(cy, box.y + box.h));
        const dx = nearestX - cx;
        const dy = nearestY - cy;
        const mx = box.x + box.w / 2;
        const my = box.y + box.h / 2;
        /* Also keep the label band (top of box) clear of the focus disk. */
        const labelBand = {
          x: box.x,
          y: box.y,
          w: box.w,
          h: Math.min(box.h, labelH + 2)
        };
        const lx = Math.max(labelBand.x, Math.min(cx, labelBand.x + labelBand.w));
        const ly = Math.max(labelBand.y, Math.min(cy, labelBand.y + labelBand.h));
        return (dx * dx + dy * dy) < holeR * holeR ||
          (Math.pow(mx - cx, 2) + Math.pow(my - cy, 2)) < Math.pow(holeR + 8, 2) ||
          ((lx - cx) * (lx - cx) + (ly - cy) * (ly - cy)) < holeR * holeR;
      }

      for (let i = 0; i < n; i += 1) {
        const key = keys[i];
        const count = Math.max(1, counts[key] || 1);
        const memberCols = Math.min(3, count);
        const memberRows = Math.ceil(count / memberCols);
        /* Size for readable in-box grid (node + label under). */
        let bw = Math.min(cellW, Math.max(78, 28 + memberCols * 34));
        let bh = Math.min(cellH, Math.max(58, labelH + 12 + memberRows * 28));
        const slot = slots[i] || { col: i % cols, row: Math.floor(i / cols) };
        const col = slot.col;
        const row = slot.row;
        let x = margin + col * (cellW + gap) + (cellW - bw) / 2;
        let y = margin + row * (cellH + gap) + (cellH - bh) / 2;

        /* Push boxes off the center hole for the looked-up drug. */
        let guard = 0;
        while ((hitsHole({ x: x, y: y, w: bw, h: bh }) || overlaps({ x: x, y: y, w: bw, h: bh }, placed)) && guard < 36) {
          const midX = x + bw / 2;
          const midY = y + bh / 2;
          let dx = midX - cx;
          let dy = midY - cy;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          dx /= dist;
          dy /= dist;
          x += dx * 10;
          y += dy * 10;
          x = Math.max(margin, Math.min(width - bw - margin, x));
          y = Math.max(margin, Math.min(height - bh - margin, y));
          guard += 1;
        }

        const box = { x: x, y: y, w: bw, h: bh, labelH: labelH };
        placed.push(box);
        boxes[key] = {
          box: box,
          bodyCx: x + bw / 2,
          bodyCy: y + labelH + (bh - labelH) / 2,
          spreadX: Math.max(12, (bw - 18) / 2),
          spreadY: Math.max(8, (bh - labelH - 16) / 2)
        };
      }
      return boxes;
    }

    function buildGraphModel(entry) {
      const saferAll = Array.isArray(entry.safer) ? entry.safer : [];
      const highAll = Array.isArray(entry.high) ? entry.high : [];
      const picked = takeMixedRows(highAll, saferAll, GRAPH_NEIGHBOR_CAP);
      const centerId = typeof entry.id === "string" ? entry.id : state.drugId;
      const centerClass = drugClassInfoForName(entry.name);
      const nodes = [{
        id: "center",
        label: entry.name,
        kind: "center",
        pending: !!entry.pending,
        pickId: centerId,
        classKey: centerClass.classKey,
        classLabel: centerClass.displayClass
      }];
      const links = [];
      const presentClasses = {};
      function addPartner(row, kind) {
        const item = row && typeof row === "object" ? row : {};
        const name = typeof item.name === "string" ? item.name : "";
        if (!name) return;
        const nodeId = kind + ":" + name;
        const klass = drugClassInfoForName(name);
        presentClasses[klass.classKey] = klass.displayClass;
        nodes.push({
          id: nodeId,
          label: name,
          kind: kind,
          pending: !!item.pendingRow,
          pickId: lookupIdForName(name),
          classKey: klass.classKey,
          classLabel: klass.displayClass
        });
        links.push({ source: "center", target: nodeId, kind: kind });
      }
      for (let i = 0; i < picked.high.length; i += 1) addPartner(picked.high[i], "high");
      for (let j = 0; j < picked.safer.length; j += 1) addPartner(picked.safer[j], "safer");
      const orderedKeys = drugClassOrderKeys().filter((key) => presentClasses[key]);
      return {
        nodes: nodes,
        links: links,
        empty: picked.total === 0,
        truncated: picked.truncated,
        shown: picked.high.length + picked.safer.length,
        total: picked.total,
        highCount: picked.high.length,
        saferCount: picked.safer.length,
        classKeys: orderedKeys,
        classLabels: orderedKeys.map((key) => ({ classKey: key, label: presentClasses[key] }))
      };
    }

    function renderDrugGraphLayoutControl() {
      const layout = state.drugGraphLayout === "class" ? "class" : "default";
      return '<div class="segment drug-graph-layout" role="radiogroup" aria-label="그래프 보기">' +
        '<button type="button" role="radio" data-drug-graph-layout="default" aria-checked="' +
        (layout === "default") + '">기본</button>' +
        '<button type="button" role="radio" data-drug-graph-layout="class" aria-checked="' +
        (layout === "class") + '">분류별 보기</button></div>';
    }

    function drugClassFocusLabel() {
      const key = state.drugClassFocus;
      if (!key) return null;
      const order = typeof DRUG_CLASS_ORDER !== "undefined" ? DRUG_CLASS_ORDER : [];
      for (let i = 0; i < order.length; i += 1) {
        if (order[i].classKey === key) return order[i].displayClass || key;
      }
      if (key === "pending") return "Source pending";
      return key;
    }

    function clearDrugClassFocus() {
      if (!state.drugClassFocus) return false;
      state.drugClassFocus = null;
      drugGraphMountedForId = null;
      return true;
    }

    function setDrugClassFocus(classKey) {
      const next = classKey || null;
      if (state.drugClassFocus === next) {
        clearDrugClassFocus();
        return "cleared";
      }
      state.drugClassFocus = next;
      drugGraphMountedForId = null;
      return next ? "set" : "cleared";
    }

    function renderDrugGraph(entry) {
      const model = buildGraphModel(entry);
      const classMode = state.drugGraphLayout === "class";
      const focusLabel = classMode ? drugClassFocusLabel() : null;
      if (!classMode && state.drugClassFocus) state.drugClassFocus = null;
      const empty = model.empty
        ? '<p class="graph-empty">No stated pairs in source</p>'
        : "";
      const trunc = model.truncated
        ? '<p class="graph-note">Showing ' + model.shown + " of " + model.total + " stated neighbors</p>"
        : "";
      const expand = model.empty
        ? ""
        : '<button type="button" class="graph-expand-btn" data-graph-expand aria-label="Expand graph">크게 보기</button>';
      let statusTitle;
      let statusHint;
      if (classMode && focusLabel) {
        statusTitle = focusLabel + " 확대";
        statusHint = "빈 곳 또는 전체 분류로 복귀";
      } else if (classMode) {
        statusTitle = "분류별 보기";
        statusHint = "분류 이름 탭 → 확대 · High/Safer 색 유지";
      } else {
        statusTitle = "기본 보기";
        statusHint = "Neighbor → 조회 · empty tap expands";
      }
      const back = classMode && focusLabel
        ? '<button type="button" class="graph-class-back" data-drug-class-zoom-back aria-label="전체 분류로 돌아가기">전체 분류</button>'
        : "";
      return '<section class="drug-graph" id="drug-graph" aria-label="Cross-reactivity graph">' +
        renderDrugGraphLayoutControl() +
        '<div class="drug-graph-head' + (classMode && focusLabel ? " is-zoom" : "") + '">' +
        '<div class="drug-graph-status">' +
        '<span class="drug-graph-status-title">' + esc(statusTitle) + "</span>" +
        '<span class="drug-graph-status-hint">' + esc(statusHint) + "</span>" +
        "</div>" +
        '<div class="drug-graph-head-actions">' + back + expand + "</div>" +
        "</div>" +
        '<canvas class="drug-graph-canvas" width="360" height="220" role="img" aria-label="Network of stated safer and high pairs"></canvas>' +
        empty +
        '<div class="graph-legend" aria-hidden="true">' +
        '<span class="legend-item legend-high"><i></i>High</span>' +
        '<span class="legend-item legend-safer"><i></i>Safer</span>' +
        '<span class="legend-item legend-pending"><i></i>Source pending</span>' +
        "</div>" + trunc + "</section>";
    }

    function shortLabel(name, max) {
      const text = String(name || "");
      if (text.length <= max) return text;
      return text.slice(0, Math.max(1, max - 1)) + "…";
    }

    function mountDrugGraph(entry) {
      const root = document.getElementById("drug-graph");
      if (!root || !entry) return;
      const layout = state.drugGraphLayout === "class" ? "class" : "default";
      if (layout !== "class") state.drugClassFocus = null;
      const focusKey = layout === "class" ? (state.drugClassFocus || null) : null;
      const baseId = typeof entry.id === "string" ? entry.id : state.drugId;
      const entryId = baseId + ":" + layout + ":" + (focusKey || "all");
      const canvas = root.querySelector("canvas");
      if (!canvas) return;
      if (
        drugGraphMountedForId === entryId &&
        drugGraphRuntime &&
        canvas.dataset.graphBound === "1"
      ) {
        return;
      }

      stopDrugGraph();
      dismissGraphNodeMenu();
      closeDrugGraphExpand();

      const model = buildGraphModel(entry);
      const classMode = layout === "class";
      const zoomMode = !!(classMode && focusKey);
      const width = Math.max(240, Math.floor(root.clientWidth || 360));
      const height = classMode ? (zoomMode ? 300 : 340) : 230;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const memberCounts = {};
      for (let m = 0; m < model.nodes.length; m += 1) {
        const row = model.nodes[m];
        if (!row || row.kind === "center" || !row.classKey) continue;
        memberCounts[row.classKey] = (memberCounts[row.classKey] || 0) + 1;
      }
      const classBoxes = classMode
        ? buildDrugClassBoxes(
          width,
          height,
          zoomMode ? [focusKey] : (model.classKeys || []),
          memberCounts,
          zoomMode ? focusKey : null
        )
        : null;
      const classLabelOverlay = [];
      if (classBoxes && model.classLabels) {
        for (let i = 0; i < model.classLabels.length; i += 1) {
          const row = model.classLabels[i];
          const pack = classBoxes[row.classKey];
          if (!pack || !pack.box) continue;
          if (zoomMode && row.classKey !== focusKey) continue;
          classLabelOverlay.push({
            classKey: row.classKey,
            label: row.label,
            x: pack.bodyCx,
            y: pack.bodyCy,
            box: {
              x: pack.box.x,
              y: pack.box.y,
              w: pack.box.w,
              h: pack.box.h,
              labelH: pack.box.labelH
            }
          });
        }
      }

      const focusMembers = [];
      const membersByClass = {};
      const nodeById = {};
      const nodes = model.nodes.map((n, i) => {
        const angle = (Math.PI * 2 * (i - 1)) / Math.max(1, model.nodes.length - 1);
        const radius = n.kind === "center" ? 0 : Math.min(width, height) * 0.32;
        let x = width / 2 + Math.cos(angle) * radius + (Math.random() - 0.5) * 4;
        let y = height / 2 + Math.sin(angle) * radius + (Math.random() - 0.5) * 4;
        const inFocus = !!(zoomMode && n.classKey === focusKey && n.kind !== "center");
        if (classMode && n.kind !== "center" && classBoxes && n.classKey && classBoxes[n.classKey]) {
          const pack = classBoxes[n.classKey];
          x = pack.bodyCx + (Math.random() - 0.5) * pack.spreadX * 0.4;
          y = pack.bodyCy + (Math.random() - 0.5) * pack.spreadY * 0.4;
        }
        if (inFocus) focusMembers.push(n.id);
        if (classMode && n.kind !== "center" && n.classKey) {
          if (!membersByClass[n.classKey]) membersByClass[n.classKey] = [];
          membersByClass[n.classKey].push(n.id);
        }
        const node = {
          id: n.id,
          label: n.label,
          kind: n.kind,
          pending: n.pending,
          pickId: n.pickId,
          classKey: n.classKey || null,
          classLabel: n.classLabel || null,
          classZoom: inFocus,
          dimmed: !!(zoomMode && n.kind !== "center" && n.classKey !== focusKey),
          x: x,
          y: y,
          vx: 0,
          vy: 0
        };
        nodeById[n.id] = node;
        return node;
      });

      function assignHomesInBox(memberIds, pack, opts) {
        const box = pack.box;
        const labelH = Math.max(16, box.labelH || 18);
        const pad = (opts && opts.pad) || 10;
        const bodyTop = box.y + labelH + pad;
        const bodyBottom = box.y + box.h - pad - 8;
        const bodyLeft = box.x + pad;
        const bodyRight = box.x + box.w - pad;
        const bodyW = Math.max(24, bodyRight - bodyLeft);
        const bodyH = Math.max(24, bodyBottom - bodyTop);
        const cx0 = bodyLeft + bodyW / 2;
        const cy0 = bodyTop + bodyH / 2;
        const count = memberIds.length;
        if (!count) return { cx0: cx0, cy0: cy0 };
        let cols = Math.min(3, Math.max(1, Math.ceil(Math.sqrt(count))));
        let rows = Math.ceil(count / cols);
        const cellW = bodyW / cols;
        const cellH = bodyH / rows;
        for (let f = 0; f < count; f += 1) {
          const node = nodeById[memberIds[f]];
          if (!node) continue;
          const col = f % cols;
          const row = Math.floor(f / cols);
          let hx = bodyLeft + cellW * (col + 0.5);
          let hy = bodyTop + cellH * (row + 0.5);
          hx = Math.max(bodyLeft + 4, Math.min(bodyRight - 4, hx));
          hy = Math.max(bodyTop + 4, Math.min(bodyBottom - 4, hy));
          node.homeX = hx;
          node.homeY = hy;
          node.x = hx;
          node.y = hy;
          node.vx = 0;
          node.vy = 0;
        }
        return { cx0: cx0, cy0: cy0 };
      }

      /* Zoom: even ring/grid of focus drugs inside the box; dimmed parked outside. */
      function assignZoomFocusHomes(memberIds, pack) {
        const box = pack.box;
        const labelH = Math.max(16, box.labelH || 18);
        /* Extra bottom pad for labels under nodes. */
        const bodyTop = box.y + labelH + 16;
        const bodyBottom = box.y + box.h - 24;
        const bodyLeft = box.x + 18;
        const bodyRight = box.x + box.w - 18;
        const bodyW = Math.max(40, bodyRight - bodyLeft);
        const bodyH = Math.max(40, bodyBottom - bodyTop);
        const cx0 = bodyLeft + bodyW / 2;
        const cy0 = bodyTop + bodyH / 2;
        const count = memberIds.length;
        if (!count) return { cx0: cx0, cy0: cy0 };

        const minChord = 76;
        const maxR = Math.min(bodyW * 0.46, bodyH * 0.44);
        const needR = minChord / (2 * Math.sin(Math.PI / Math.max(2, count)));
        const ringR = Math.min(maxR, Math.max(58, needR));
        /* Prefer even circular ring for typical class sizes — clearer than a tight grid. */
        const useRing = count >= 2 && count <= 9 && maxR >= 54 && bodyW >= 140 && bodyH >= 120;

        if (useRing) {
          for (let f = 0; f < count; f += 1) {
            const node = nodeById[memberIds[f]];
            if (!node) continue;
            const ang = -Math.PI / 2 + (Math.PI * 2 * f) / count;
            let hx = cx0 + Math.cos(ang) * ringR;
            let hy = cy0 + Math.sin(ang) * ringR;
            hx = Math.max(bodyLeft, Math.min(bodyRight, hx));
            hy = Math.max(bodyTop, Math.min(bodyBottom, hy));
            node.homeX = hx;
            node.homeY = hy;
            node.x = hx;
            node.y = hy;
            node.vx = 0;
            node.vy = 0;
          }
        } else {
          /* Grid around center, skip center cell so focus drug stays clear. */
          let cols = Math.ceil(Math.sqrt(count + 1));
          if (cols < 2) cols = 2;
          if (cols > 4) cols = 4;
          let rows = Math.ceil((count + 1) / cols);
          const slots = [];
          const midCol = (cols - 1) / 2;
          const midRow = (rows - 1) / 2;
          for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
              if (Math.abs(c - midCol) < 0.6 && Math.abs(r - midRow) < 0.6) continue;
              slots.push({ c: c, r: r });
            }
          }
          while (slots.length < count) {
            cols += 1;
            rows = Math.ceil((count + 1) / cols);
            slots.length = 0;
            for (let r = 0; r < rows; r += 1) {
              for (let c = 0; c < cols; c += 1) {
                if (c === Math.floor(cols / 2) && r === Math.floor(rows / 2)) continue;
                slots.push({ c: c, r: r });
              }
            }
            if (cols > 6) break;
          }
          const cellW = bodyW / cols;
          const cellH = bodyH / rows;
          for (let f = 0; f < count; f += 1) {
            const node = nodeById[memberIds[f]];
            if (!node) continue;
            const slot = slots[f] || { c: f % cols, r: Math.floor(f / cols) };
            let hx = bodyLeft + cellW * (slot.c + 0.5);
            let hy = bodyTop + cellH * (slot.r + 0.5);
            hx = Math.max(bodyLeft, Math.min(bodyRight, hx));
            hy = Math.max(bodyTop, Math.min(bodyBottom, hy));
            node.homeX = hx;
            node.homeY = hy;
            node.x = hx;
            node.y = hy;
            node.vx = 0;
            node.vy = 0;
          }
        }
        return { cx0: cx0, cy0: cy0, bodyLeft: bodyLeft, bodyRight: bodyRight, bodyTop: bodyTop, bodyBottom: bodyBottom };
      }

      function parkDimmedOutsideBox(pack) {
        const box = pack.box;
        const dimmed = nodes.filter((n) => n.dimmed);
        if (!dimmed.length) return;
        const rim = 8;
        const slots = [];
        /* Build slots only in the canvas rim outside the focus box. */
        const topBand = Math.max(12, box.y - rim);
        const botBand = Math.min(height - 12, box.y + box.h + rim);
        const leftBand = Math.max(12, box.x - rim);
        const rightBand = Math.min(width - 12, box.x + box.w + rim);
        const along = Math.max(4, Math.ceil(dimmed.length / 4));
        for (let i = 0; i < along; i += 1) {
          const t = (i + 0.5) / along;
          slots.push({ x: 12 + t * (width - 24), y: Math.max(10, topBand / 2) });
          slots.push({ x: 12 + t * (width - 24), y: Math.min(height - 10, (botBand + height) / 2) });
          slots.push({ x: Math.max(10, leftBand / 2), y: 14 + t * (height - 28) });
          slots.push({ x: Math.min(width - 10, (rightBand + width) / 2), y: 14 + t * (height - 28) });
        }
        const usable = slots.filter((s) => {
          return !(
            s.x >= box.x - 4 && s.x <= box.x + box.w + 4 &&
            s.y >= box.y - 4 && s.y <= box.y + box.h + 4
          );
        });
        const pool = usable.length ? usable : [
          { x: 10, y: 10 },
          { x: width - 10, y: 10 },
          { x: 10, y: height - 10 },
          { x: width - 10, y: height - 10 }
        ];
        for (let d = 0; d < dimmed.length; d += 1) {
          const slot = pool[d % pool.length];
          const node = dimmed[d];
          node.homeX = slot.x;
          node.homeY = slot.y;
          node.x = slot.x;
          node.y = slot.y;
          node.vx = 0;
          node.vy = 0;
        }
      }

      if (classMode && classBoxes) {
        if (zoomMode && classBoxes[focusKey]) {
          const pack = classBoxes[focusKey];
          const home = assignZoomFocusHomes(focusMembers, pack);
          const centerNode = nodes.find((n) => n.kind === "center");
          if (centerNode) {
            centerNode.homeX = home.cx0;
            centerNode.homeY = home.cy0;
            centerNode.x = home.cx0;
            centerNode.y = home.cy0;
            centerNode.vx = 0;
            centerNode.vy = 0;
          }
          parkDimmedOutsideBox(pack);
        } else {
          const keys = Object.keys(membersByClass);
          for (let k = 0; k < keys.length; k += 1) {
            const pack = classBoxes[keys[k]];
            if (!pack) continue;
            assignHomesInBox(membersByClass[keys[k]], pack, { pad: 8 });
          }
        }
      }
      const links = model.links.map((l) => ({
        source: nodeById[l.source],
        target: nodeById[l.target],
        kind: l.kind
      })).filter((l) => l.source && l.target);

      const colors = {
        high: "#ef4444",
        safer: "#22c55e",
        center: "#2f6fed",
        ink: "#24221e",
        muted: "#5e5952",
        line: "#e2ddd4"
      };

      drugGraphMountedForId = entryId;
      drugGraphRuntime = {
        mode: "drug",
        entryId: entryId,
        rootId: "drug-graph",
        layout: layout,
        focusClassKey: focusKey,
        width: width,
        height: height,
        nodes: nodes,
        links: links,
        colors: colors,
        classLabels: classLabelOverlay,
        anim: null
      };
      graphRuntimeByRootId["drug-graph"] = drugGraphRuntime;
      window.drugGraphRuntime = drugGraphRuntime;
      canvas.dataset.graphBound = "1";

      let tick = 0;
      const maxTicks = classMode ? 18 : 180;
      let settled = 0;
      let frozen = false;

      function freezeLayout() {
        frozen = true;
        for (let n = 0; n < nodes.length; n += 1) {
          const node = nodes[n];
          if (typeof node.homeX === "number" && typeof node.homeY === "number") {
            node.x = node.homeX;
            node.y = node.homeY;
          }
          node.vx = 0;
          node.vy = 0;
        }
        if (drugGraphAnim) {
          cancelAnimationFrame(drugGraphAnim);
          drugGraphAnim = null;
        }
        if (drugGraphRuntime) {
          drugGraphRuntime.anim = null;
          drugGraphRuntime.frozen = true;
        }
        paint();
      }

      function step() {
        if (frozen) return 0;

        /* Class / zoom: home-only soft settle — no charge/spring; dimmed already parked. */
        if (classMode) {
          let energy = 0;
          const homePull = 0.48;
          const damp = 0.55;
          for (let n = 0; n < nodes.length; n += 1) {
            const node = nodes[n];
            if (typeof node.homeX === "number" && typeof node.homeY === "number") {
              node.vx += (node.homeX - node.x) * homePull;
              node.vy += (node.homeY - node.y) * homePull;
            } else if (node.kind === "center") {
              node.vx += (width / 2 - node.x) * 0.3;
              node.vy += (height / 2 - node.y) * 0.3;
            }
            node.vx *= damp;
            node.vy *= damp;
            node.x += node.vx;
            node.y += node.vy;
            energy += node.vx * node.vx + node.vy * node.vy;
          }
          return energy;
        }

        /* Default view: soft ease-out force layout. */
        const charge = 900;
        const centerPull = 0.028;
        const spring = 0.032;
        const rest = Math.min(width, height) * 0.34;
        const damp = 0.88;

        for (let i = 0; i < nodes.length; i += 1) {
          const a = nodes[i];
          for (let j = i + 1; j < nodes.length; j += 1) {
            const b = nodes[j];
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let dist2 = dx * dx + dy * dy;
            if (dist2 < 16) dist2 = 16;
            const force = charge / dist2;
            const dist = Math.sqrt(dist2);
            dx = (dx / dist) * force;
            dy = (dy / dist) * force;
            a.vx += dx;
            a.vy += dy;
            b.vx -= dx;
            b.vy -= dy;
          }
        }

        for (let k = 0; k < links.length; k += 1) {
          const link = links[k];
          const a = link.source;
          const b = link.target;
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const pull = (dist - rest) * spring;
          dx = (dx / dist) * pull;
          dy = (dy / dist) * pull;
          a.vx += dx;
          a.vy += dy;
          b.vx -= dx;
          b.vy -= dy;
        }

        let energy = 0;
        for (let n = 0; n < nodes.length; n += 1) {
          const node = nodes[n];
          if (node.kind === "center") {
            node.vx += (width / 2 - node.x) * 0.08;
            node.vy += (height / 2 - node.y) * 0.08;
          } else {
            node.vx += (width / 2 - node.x) * centerPull;
            node.vy += (height / 2 - node.y) * centerPull;
          }
          node.vx *= damp;
          node.vy *= damp;
          const vmax = 3.5;
          if (node.vx > vmax) node.vx = vmax;
          if (node.vx < -vmax) node.vx = -vmax;
          if (node.vy > vmax) node.vy = vmax;
          if (node.vy < -vmax) node.vy = -vmax;
          node.x += node.vx;
          node.y += node.vy;
          const pad = 18;
          node.x = Math.max(pad, Math.min(width - pad, node.x));
          node.y = Math.max(pad, Math.min(height - pad, node.y));
          energy += node.vx * node.vx + node.vy * node.vy;
        }
        return energy;
      }

      function paint() {
        paintDrugGraphFrame(ctx, width, height, nodes, links, colors, false, {
          classLabels: classLabelOverlay,
          focusClassKey: focusKey
        });
      }

      function frame() {
        if (frozen) return;
        let energy = 0;
        const substeps = classMode ? 1 : 3;
        for (let s = 0; s < substeps; s += 1) energy = step();
        paint();
        tick += 1;
        const energyGate = classMode ? 0.04 : 0.02;
        const settledNeed = classMode ? 4 : 18;
        if (energy < energyGate) settled += 1;
        else settled = 0;
        if (tick >= maxTicks || settled >= settledNeed) {
          freezeLayout();
          return;
        }
        drugGraphAnim = requestAnimationFrame(frame);
        if (drugGraphRuntime) drugGraphRuntime.anim = drugGraphAnim;
      }

      function handleClassRegionTap(x, y, preferLabelBand) {
        if (!classMode) return false;
        const region = hitTestClassLabel(classLabelOverlay, x, y);
        if (!region || !region.classKey) return false;
        if (preferLabelBand) {
          const box = region.box;
          if (box && box.w && box.h) {
            const labelH = Math.max(16, box.labelH || 18);
            const inLabelBand =
              x >= box.x - 2 && x <= box.x + box.w + 2 &&
              y >= box.y - 2 && y <= box.y + labelH + 4;
            if (!inLabelBand) return false;
          } else {
            const r = Math.max(28, region.radius || 34);
            const labelDy = Math.abs((region.y - r + 4) - y);
            const inLabelBand = labelDy < 18 && Math.abs(region.x - x) < Math.max(56, r * 1.35);
            const nearCenter = Math.sqrt(Math.pow(region.x - x, 2) + Math.pow(region.y - y, 2)) <= r * 0.55;
            if (!inLabelBand && !nearCenter) return false;
          }
        }
        dismissGraphNodeMenu();
        const result = setDrugClassFocus(region.classKey);
        render(result === "cleared"
          ? '[data-drug-graph-layout="class"]'
          : '[data-drug-class-zoom-back]');
        return true;
      }

      bindGraphCanvasPointer(
        canvas,
        root,
        function () { return nodes; },
        function () { return { width: width, height: height }; },
        false,
        function () { return drugGraphRuntime; },
        {
          onBeforeNode: function (_event, x, y) {
            /* Class name / inner region wins over dense neighbor nodes. */
            return handleClassRegionTap(x, y, true);
          },
          onClassOrEmpty: function (_event, x, y) {
            if (handleClassRegionTap(x, y, false)) return true;
            if (document.getElementById("graph-node-menu")) {
              dismissGraphNodeMenu();
              return true;
            }
            if (zoomMode) {
              clearDrugClassFocus();
              render('[data-drug-graph-layout="class"]');
              return true;
            }
            return false;
          }
        }
      );

      drugGraphAnim = requestAnimationFrame(frame);
      drugGraphRuntime.anim = drugGraphAnim;
    }

    function renderDrug() {
      const search = renderDrugSearch();
      const entry = selectedDrug();
      if (!entry) {
        return backBtn("Drugs") + search +
          '<p class="search-prompt">Search a drug to see stated pairs.</p>' +
          renderDrugBrowse();
      }
      const safer = Array.isArray(entry.safer) ? entry.safer : [];
      const high = Array.isArray(entry.high) ? entry.high : [];
      const header = drugHeader(entry, state.direction === "split");
      const graph = renderDrugGraph(entry);
      let groups;
      if (state.direction === "segmented") {
        const open = state.drugSegment === "high" ? "high" : "safer";
        groups = '<div class="segment" role="radiogroup" aria-label="Stated pairs">' +
          '<button type="button" role="radio" class="is-safer" data-drug-segment="safer" aria-checked="' + (open === "safer") + '">Safer alternatives</button>' +
          '<button type="button" role="radio" data-drug-segment="high" aria-checked="' + (open === "high") + '">High cross-reactivity</button>' +
          '</div><div class="groups">' + drugPairGroupsHtml(entry, open) + "</div>";
      } else if (state.direction === "split") {
        groups = '<div class="groups split">' + pairCard("safer", safer, true) + pairCard("high", high, true) + "</div>";
      } else {
        groups = '<div class="groups">' + pairCard("safer", safer, true) + pairCard("high", high, true) + "</div>";
      }
      return backBtn("Drugs") + search + header + graph + groups;
    }


    /* === allergen-ui items 6-7 start (render helpers) === */
    /* === allergen-ui maa-30 start (helpers) === */
    function literatureIdForName(list, name) {
      const rows = Array.isArray(list) ? list : [];
      for (let i = 0; i < rows.length; i += 1) {
        if (rows[i] && rows[i].name === name) return rows[i].id;
      }
      return null;
    }

    function componentIdForName(name) {
      return literatureIdForName(LITERATURE.components, name);
    }

    function componentClassKind(name) {
      const owners = COMPONENT_OWNER[name] || [];
      let hasLatex = false;
      let hasPollen = false;
      let hasFruit = false;
      for (let i = 0; i < owners.length; i += 1) {
        const owner = owners[i];
        if (owner === "라텍스") hasLatex = true;
        else if (POLLEN_OWNER_SET[owner]) hasPollen = true;
        else if (FOOD_FRUITS[owner]) hasFruit = true;
      }
      if (hasLatex) return "latex";
      if (hasPollen) return "pollen";
      if (hasFruit) return "fruit";
      return "other";
    }

    function allergenGraphColors(extra) {
      const base = {
        high: "#ef4444",
        safer: "#6b8f71",
        center: "#2f6fed",
        ink: "#24221e",
        muted: "#5e5952",
        line: "#c4bbb0",
        assoc: "#8a9a84",
        fruit: "#e8a54b",
        nut: "#c2410c",
        fish: "#0ea5e9",
        meat: "#b45309",
        pollen: "#5b8def",
        latex: "#a78bfa",
        other: "#6b8f71",
        "food-fruit": "#e8a54b",
        "food-veg": "#6b8f71",
        "food-other": "#8b7355"
      };
      if (!extra) return base;
      const out = {};
      const keys = Object.keys(base);
      for (let i = 0; i < keys.length; i += 1) out[keys[i]] = base[keys[i]];
      const extraKeys = Object.keys(extra);
      for (let j = 0; j < extraKeys.length; j += 1) out[extraKeys[j]] = extra[extraKeys[j]];
      return out;
    }

    function graphFocusKey(focus) {
      if (!focus || !focus.type || !focus.name) return "all";
      return focus.type + ":" + focus.name;
    }

    function overviewNodeFactory(model) {
      const sample = model.nodes && model.nodes[0];
      const foodMode = !!(sample && String(sample.id).indexOf("food-node:") === 0) ||
        !!(model.segment === "foods" || model.segment === "nuts" ||
          model.segment === "fish" || model.segment === "meat");
      if (foodMode) {
        return function makeFoodNode(name) {
          return {
            id: "food-node:" + name,
            label: name,
            kind: "safer",
            classKind: foodNodeClassKind(name),
            pending: false,
            pickId: literatureIdForName(LITERATURE.foods, name),
            isolated: true
          };
        };
      }
      return function makeCompNode(name) {
        return {
          id: "comp:" + name,
          label: name,
          kind: "safer",
          classKind: componentClassKind(name),
          pending: true,
          pickId: componentIdForName(name),
          isolated: true
        };
      };
    }

    function ensureOverviewNode(model, name, makeNode, present) {
      if (!name || present[name]) return present[name];
      const node = makeNode(name);
      model.nodes.push(node);
      present[name] = node;
      return node;
    }

    function ensureStatedSolidLink(model, aName, bName, present) {
      if (!aName || !bName || aName === bName) return;
      const a = present[aName];
      const b = present[bName];
      if (!a || !b) return;
      let stated = false;
      for (let i = 0; i < COMPONENT_SOLID_LINKS.length; i += 1) {
        const pair = COMPONENT_SOLID_LINKS[i];
        if ((pair[0] === aName && pair[1] === bName) || (pair[0] === bName && pair[1] === aName)) {
          stated = true;
          break;
        }
      }
      if (!stated) return;
      for (let L = 0; L < model.links.length; L += 1) {
        const link = model.links[L];
        if ((link.source === a.id && link.target === b.id) ||
          (link.source === b.id && link.target === a.id)) return;
      }
      model.links.push({ source: a.id, target: b.id, kind: "safer" });
    }

    function decorateOverviewGraphModel(model, focus) {
      if (!model || !Array.isArray(model.nodes)) return model;
      if (!Array.isArray(model.links)) model.links = [];
      model.focusKey = graphFocusKey(focus);
      if (!focus || !focus.type || !focus.name) return model;
      const present = {};
      for (let i = 0; i < model.nodes.length; i += 1) {
        present[model.nodes[i].label] = model.nodes[i];
      }
      const makeNode = overviewNodeFactory(model);
      const keep = {};
      let centerName = null;
      if (focus.type === "component") {
        centerName = focus.name;
        keep[focus.name] = "center";
        const partners = statedComponentPartners(focus.name);
        for (let p = 0; p < partners.length; p += 1) keep[partners[p]] = keep[partners[p]] || "neighbor";
      } else if (focus.type === "owner") {
        const comps = statedFoodOwnedComponents(focus.name);
        for (let c = 0; c < comps.length; c += 1) {
          keep[comps[c]] = "selected";
          const partners = statedComponentPartners(comps[c]);
          for (let p = 0; p < partners.length; p += 1) {
            if (!keep[partners[p]]) keep[partners[p]] = "neighbor";
          }
        }
        centerName = comps.length ? comps[0] : null;
        for (let c = 0; c < comps.length; c += 1) {
          if (present[comps[c]]) { centerName = comps[c]; break; }
        }
        if (centerName) keep[centerName] = "center";
      } else if (focus.type === "food") {
        centerName = focus.name;
        keep[focus.name] = "center";
        const idToLabel = {};
        for (let i = 0; i < model.nodes.length; i += 1) idToLabel[model.nodes[i].id] = model.nodes[i].label;
        for (let L = 0; L < model.links.length; L += 1) {
          const link = model.links[L];
          const a = idToLabel[link.source];
          const b = idToLabel[link.target];
          if (a === focus.name && b) keep[b] = keep[b] || "neighbor";
          if (b === focus.name && a) keep[a] = keep[a] || "neighbor";
        }
      } else {
        return model;
      }

      /* Always show the selected antigen(s), even with no stated edges / not in overview. */
      const ensureNames = Object.keys(keep);
      for (let e = 0; e < ensureNames.length; e += 1) {
        const name = ensureNames[e];
        const role = keep[name];
        if (role === "center" || role === "selected") {
          ensureOverviewNode(model, name, makeNode, present);
        }
      }
      /* Stated neighbors: include them when the solid pair is stated (no invented edges). */
      if (focus.type === "component" || focus.type === "owner") {
        for (let e = 0; e < ensureNames.length; e += 1) {
          const name = ensureNames[e];
          if (keep[name] !== "neighbor") continue;
          ensureOverviewNode(model, name, makeNode, present);
        }
        for (let e = 0; e < ensureNames.length; e += 1) {
          const name = ensureNames[e];
          if (keep[name] !== "center" && keep[name] !== "selected") continue;
          const partners = statedComponentPartners(name);
          for (let p = 0; p < partners.length; p += 1) {
            ensureOverviewNode(model, partners[p], makeNode, present);
            ensureStatedSolidLink(model, name, partners[p], present);
          }
        }
      } else if (focus.type === "food") {
        ensureOverviewNode(model, focus.name, makeNode, present);
      }

      for (let i = 0; i < model.nodes.length; i += 1) {
        const node = model.nodes[i];
        const role = keep[node.label];
        if (!role) {
          node.dimmed = true;
          node.selected = false;
        } else if (role === "center") {
          node.kind = "center";
          node.dimmed = false;
          node.selected = true;
        } else {
          node.dimmed = false;
          node.selected = true;
        }
      }
      if (model.empty && model.nodes.length) model.empty = false;
      return model;
    }

    function buildComponentGraphModel(focus) {
      const filter = state.componentFamilyFilter || "all";
      const familyKey = filter === "LTP" ? "nsLTP" : filter;
      const filtered = [];
      for (let i = 0; i < COMPONENT_SOLID_LINKS.length; i += 1) {
        const pair = COMPONENT_SOLID_LINKS[i];
        if (familyKey === "all") {
          filtered.push(pair);
          continue;
        }
        const fa = componentFamilyOf(pair[0]);
        const fb = componentFamilyOf(pair[1]);
        if (fa === familyKey && fb === familyKey) filtered.push(pair);
      }
      const total = filtered.length;
      const picked = filtered.slice(0, COMPONENT_GRAPH_EDGE_CAP);
      const nodeIds = {};
      const nodes = [];
      function ensureNode(name) {
        if (nodeIds[name]) return nodeIds[name];
        const id = "comp:" + name;
        nodeIds[name] = id;
        nodes.push({
          id: id,
          label: name,
          kind: "safer",
          classKind: componentClassKind(name),
          pending: true,
          pickId: componentIdForName(name),
          family: componentFamilyOf(name)
        });
        return id;
      }
      const links = [];
      for (let i = 0; i < picked.length; i += 1) {
        const pair = picked[i];
        const a = ensureNode(pair[0]);
        const b = ensureNode(pair[1]);
        links.push({ source: a, target: b, kind: "safer" });
      }
      return decorateOverviewGraphModel({
        nodes: nodes,
        links: links,
        empty: total === 0,
        truncated: total > picked.length,
        shown: picked.length,
        total: total,
        familyFilter: filter
      }, focus || state.graphFocus);
    }

    function renderComponentGraph() {
      const model = buildComponentGraphModel();
      const focused = !!(state.graphFocus && state.graphFocus.name);
      const filter = state.componentFamilyFilter || "all";
      const empty = model.empty
        ? '<p class="graph-empty">No stated solid links' +
          (filter === "all" ? " in pollen-food notes" : " for " + filter) + "</p>"
        : "";
      const trunc = model.truncated
        ? '<p class="graph-note">Showing ' + model.shown + " of " + model.total + " stated solid links</p>"
        : (model.total && filter !== "all"
          ? '<p class="graph-note">Showing ' + model.total + " " + filter + " solid links</p>"
          : "");
      const expand = model.empty
        ? ""
        : '<button type="button" class="graph-expand-btn" data-graph-expand aria-label="Expand graph">크게 보기</button>';
      const hint = focused
        ? "Selected at center · stated neighbors in a star · others dimmed"
        : "Stated solid pairs · node → Note";
      const legendFocus = focused
        ? '<span class="legend-item legend-center"><i></i>Looked-up / related</span>'
        : "";
      const filters = [
        { id: "all", label: "All" },
        { id: "PR-10", label: "PR-10" },
        { id: "LTP", label: "LTP" }
      ];
      let filterHtml = '<div class="graph-family-filter" role="radiogroup" aria-label="Component family filter">';
      for (let i = 0; i < filters.length; i += 1) {
        const f = filters[i];
        filterHtml += '<button type="button" role="radio" class="graph-family-chip" data-component-family="' +
          esc(f.id) + '" aria-checked="' + (filter === f.id ? "true" : "false") + '">' +
          esc(f.label) + "</button>";
      }
      filterHtml += "</div>";
      return '<section class="drug-graph" id="component-graph" aria-label="Component link graph">' +
        '<div class="drug-graph-head">' +
        '<p class="drug-graph-hint">' + hint + "</p>" +
        expand +
        "</div>" +
        filterHtml +
        '<canvas class="drug-graph-canvas" width="360" height="220" role="img" aria-label="Network of stated solid component pairs"></canvas>' +
        empty +
        '<div class="graph-legend" aria-hidden="true">' +
        legendFocus +
        '<span class="legend-item legend-fruit"><i></i>Fruit</span>' +
        '<span class="legend-item legend-pollen"><i></i>Pollen</span>' +
        '<span class="legend-item legend-latex"><i></i>Latex</span>' +
        '<span class="legend-item legend-other"><i></i>Other</span>' +
        '<span class="legend-item legend-pending"><i></i>Source pending</span>' +
        "</div>" + trunc + "</section>";
    }

    function orderHotNeighborsForStar(hot, center, linkList) {
      const rows = Array.isArray(hot) ? hot.slice() : [];
      if (!rows.length) return rows;
      const adj = {};
      for (let i = 0; i < rows.length; i += 1) adj[rows[i].id] = {};
      for (let L = 0; L < linkList.length; L += 1) {
        const link = linkList[L];
        if (!link.source || !link.target) continue;
        const a = link.source.id;
        const b = link.target.id;
        if (!adj[a] || !adj[b]) continue;
        adj[a][b] = 1;
        adj[b][a] = 1;
      }
      rows.sort((a, b) => {
        const aHub = center && (linkList.some((l) =>
          (l.source === center && l.target === a) || (l.target === center && l.source === a)));
        const bHub = center && (linkList.some((l) =>
          (l.source === center && l.target === b) || (l.target === center && l.source === b)));
        if (aHub !== bHub) return aHub ? -1 : 1;
        return String(a.label || "").localeCompare(String(b.label || ""), "ko");
      });
      /* Greedy circular order: keep mutually linked neighbors adjacent to cut chord crossings. */
      const ordered = [];
      const used = {};
      ordered.push(rows[0]);
      used[rows[0].id] = 1;
      while (ordered.length < rows.length) {
        const last = ordered[ordered.length - 1];
        let best = null;
        let bestScore = -1;
        for (let i = 0; i < rows.length; i += 1) {
          const cand = rows[i];
          if (used[cand.id]) continue;
          let score = adj[last.id] && adj[last.id][cand.id] ? 3 : 0;
          if (center) {
            const toCenter = linkList.some((l) =>
              (l.source === center && l.target === cand) || (l.target === center && l.source === cand));
            if (toCenter) score += 1;
          }
          score += 0.01 * (rows.length - i);
          if (score > bestScore) {
            bestScore = score;
            best = cand;
          }
        }
        if (!best) break;
        ordered.push(best);
        used[best.id] = 1;
      }
      for (let i = 0; i < rows.length; i += 1) {
        if (!used[rows[i].id]) ordered.push(rows[i]);
      }
      return ordered;
    }

    function mountAllergenForceGraph(rootId, mode, model, options) {
      const root = document.getElementById(rootId);
      if (!root) return;
      const canvas = root.querySelector("canvas");
      if (!canvas) return;
      const focusKey = (model && model.focusKey) || (options && options.focusKey) || "all";
      const entryId = mode + ":" + rootId + ":" + focusKey;
      const existing = graphRuntimeByRootId[rootId];
      if (
        existing &&
        existing.entryId === entryId &&
        canvas.dataset.graphBound === "1"
      ) {
        return;
      }

      if (existing && existing.anim) {
        cancelAnimationFrame(existing.anim);
        existing.anim = null;
      }
      dismissGraphNodeMenu();
      closeDrugGraphExpand();

      const width = Math.max(240, Math.floor(root.clientWidth || 360));
      const height = (options && options.height) || 230;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      let clusterAnchors = (options && options.clusterAnchors) || null;
      if (typeof clusterAnchors === "function") clusterAnchors = clusterAnchors(width, height);
      const nodeById = {};
      const hasCenter = model.nodes.some((n) => n && n.kind === "center");
      const focusLayout = hasCenter && focusKey !== "all";
      const orbitCount = Math.max(1, model.nodes.length - (hasCenter ? 1 : 0));
      let orbitIndex = 0;
      const nodes = model.nodes.map((n) => {
        const isCenter = n.kind === "center";
        const angle = (Math.PI * 2 * orbitIndex) / orbitCount;
        if (!isCenter) orbitIndex += 1;
        const radius = isCenter
          ? 0
          : Math.min(width, height) * ((options && options.radiusFactor) || 0.34);
        let x = width / 2 + Math.cos(angle) * radius + (isCenter ? 0 : (Math.random() - 0.5) * 8);
        let y = height / 2 + Math.sin(angle) * radius + (isCenter ? 0 : (Math.random() - 0.5) * 8);
        if (!isCenter && clusterAnchors && n.cluster && clusterAnchors[n.cluster]) {
          const anchor = clusterAnchors[n.cluster];
          x = anchor.x + (Math.random() - 0.5) * anchor.spread;
          y = anchor.y + (Math.random() - 0.5) * anchor.spread;
        }
        const node = {
          id: n.id,
          label: n.label,
          kind: n.kind,
          classKind: n.classKind,
          cluster: n.cluster,
          pending: n.pending,
          pickId: n.pickId,
          dimmed: !!n.dimmed,
          selected: !!n.selected,
          pinned: false,
          x: x,
          y: y,
          vx: 0,
          vy: 0
        };
        nodeById[n.id] = node;
        return node;
      });
      const links = model.links.map((l) => ({
        source: nodeById[l.source],
        target: nodeById[l.target],
        kind: l.kind
      })).filter((l) => l.source && l.target);

      if (focusLayout) {
        const centerNode = nodes.find((n) => n.kind === "center") || null;
        const hot = nodes.filter((n) => !n.dimmed && n.kind !== "center");
        const cold = nodes.filter((n) => n.dimmed);
        const ordered = orderHotNeighborsForStar(hot, centerNode, links);
        const innerR = Math.min(width, height) * 0.3;
        const outerR = Math.min(width, height) * 0.48;
        if (centerNode) {
          centerNode.x = width / 2;
          centerNode.y = height / 2;
          centerNode.vx = 0;
          centerNode.vy = 0;
          centerNode.pinned = true;
        }
        for (let i = 0; i < ordered.length; i += 1) {
          const angle = -Math.PI / 2 + (Math.PI * 2 * i) / Math.max(1, ordered.length);
          ordered[i].x = width / 2 + Math.cos(angle) * innerR;
          ordered[i].y = height / 2 + Math.sin(angle) * innerR;
          ordered[i].vx = 0;
          ordered[i].vy = 0;
          ordered[i].orbitAngle = angle;
          ordered[i].orbitRadius = innerR;
        }
        for (let i = 0; i < cold.length; i += 1) {
          const angle = (Math.PI * 2 * i) / Math.max(1, cold.length) + 0.15;
          cold[i].x = width / 2 + Math.cos(angle) * outerR;
          cold[i].y = height / 2 + Math.sin(angle) * outerR;
          cold[i].vx = 0;
          cold[i].vy = 0;
        }
      }

      const colors = allergenGraphColors(options && options.colors);
      const runtime = {
        mode: mode,
        entryId: entryId,
        rootId: rootId,
        width: width,
        height: height,
        nodes: nodes,
        links: links,
        colors: colors,
        focusLayout: focusLayout,
        anim: null
      };
      graphRuntimeByRootId[rootId] = runtime;
      drugGraphRuntime = runtime;
      drugGraphMountedForId = entryId;
      canvas.dataset.graphBound = "1";

      let tick = 0;
      const maxTicks = (options && options.maxTicks) || (focusLayout ? 140 : 220);
      let settled = 0;
      const charge = (options && options.charge) || 900;
      const centerPull = (options && options.centerPull) || 0.028;
      const spring = (options && options.spring) || 0.04;
      const rest = Math.min(width, height) * ((options && options.restFactor) || (focusLayout ? 0.3 : 0.3));
      const damp = 0.86;
      const clusterPull = (options && options.clusterPull) || 0;

      function step() {
        for (let i = 0; i < nodes.length; i += 1) {
          const a = nodes[i];
          if (a.pinned) continue;
          for (let j = i + 1; j < nodes.length; j += 1) {
            const b = nodes[j];
            if (b.pinned) {
              /* still repel from pinned center */
            }
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let dist2 = dx * dx + dy * dy;
            if (dist2 < 16) dist2 = 16;
            let force = charge / dist2;
            if (focusLayout) {
              if (a.dimmed && b.dimmed) force *= 0.35;
              else if (a.dimmed || b.dimmed) force *= 0.55;
              else force *= 1.15;
            }
            const dist = Math.sqrt(dist2);
            dx = (dx / dist) * force;
            dy = (dy / dist) * force;
            a.vx += dx;
            a.vy += dy;
            if (!b.pinned) {
              b.vx -= dx;
              b.vy -= dy;
            }
          }
        }

        for (let k = 0; k < links.length; k += 1) {
          const link = links[k];
          const a = link.source;
          const b = link.target;
          const dimLink = !!(a.dimmed || b.dimmed);
          if (focusLayout && dimLink) continue; /* keep stated focus edges from tangling with dim backdrop */
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const targetRest = focusLayout && (a.pinned || b.pinned)
            ? Math.min(width, height) * 0.3
            : rest;
          const pull = (dist - targetRest) * (focusLayout ? spring * 1.2 : spring);
          dx = (dx / dist) * pull;
          dy = (dy / dist) * pull;
          if (!a.pinned) {
            a.vx += dx;
            a.vy += dy;
          }
          if (!b.pinned) {
            b.vx -= dx;
            b.vy -= dy;
          }
        }

        let energy = 0;
        for (let n = 0; n < nodes.length; n += 1) {
          const node = nodes[n];
          if (node.pinned || (focusLayout && node.kind === "center")) {
            node.x = width / 2;
            node.y = height / 2;
            node.vx = 0;
            node.vy = 0;
            continue;
          }
          if (focusLayout && !node.dimmed && typeof node.orbitAngle === "number") {
            const tx = width / 2 + Math.cos(node.orbitAngle) * (node.orbitRadius || rest);
            const ty = height / 2 + Math.sin(node.orbitAngle) * (node.orbitRadius || rest);
            node.vx += (tx - node.x) * 0.08;
            node.vy += (ty - node.y) * 0.08;
          } else if (clusterAnchors && node.cluster && clusterAnchors[node.cluster] && clusterPull) {
            const anchor = clusterAnchors[node.cluster];
            node.vx += (anchor.x - node.x) * clusterPull;
            node.vy += (anchor.y - node.y) * clusterPull;
          } else if (focusLayout && node.dimmed) {
            const outer = Math.min(width, height) * 0.48;
            const ang = Math.atan2(node.y - height / 2, node.x - width / 2);
            const tx = width / 2 + Math.cos(ang) * outer;
            const ty = height / 2 + Math.sin(ang) * outer;
            node.vx += (tx - node.x) * 0.04;
            node.vy += (ty - node.y) * 0.04;
          } else {
            node.vx += (width / 2 - node.x) * centerPull;
            node.vy += (height / 2 - node.y) * centerPull;
          }
          node.vx *= damp;
          node.vy *= damp;
          node.x += node.vx;
          node.y += node.vy;
          const pad = 18;
          node.x = Math.max(pad, Math.min(width - pad, node.x));
          node.y = Math.max(pad, Math.min(height - pad, node.y));
          energy += node.vx * node.vx + node.vy * node.vy;
        }
        return energy;
      }

      function paint() {
        paintDrugGraphFrame(ctx, width, height, nodes, links, colors, false);
      }

      function frame() {
        let energy = 0;
        for (let s = 0; s < 3; s += 1) energy = step();
        paint();
        tick += 1;
        if (energy < 0.02) settled += 1;
        else settled = 0;
        if (tick < maxTicks && settled < 18) {
          runtime.anim = requestAnimationFrame(frame);
        } else {
          runtime.anim = null;
          paint();
        }
      }

      bindGraphCanvasPointer(
        canvas,
        root,
        function () { return nodes; },
        function () { return { width: width, height: height }; },
        false,
        function () { return runtime; }
      );

      runtime.anim = requestAnimationFrame(frame);
    }

    function mountComponentGraph() {
      const model = buildComponentGraphModel(state.graphFocus);
      const family = state.componentFamilyFilter || "all";
      mountAllergenForceGraph("component-graph", "component", model, {
        charge: 900,
        centerPull: 0.028,
        spring: 0.04,
        restFactor: 0.3,
        focusKey: (model.focusKey || "all") + "|family:" + family
      });
    }

    function foodNodeClassKind(name) {
      if (FOOD_NUTS[name]) return "nut";
      if (FOOD_FISH[name]) return "fish";
      if (FOOD_MEAT[name]) return "meat";
      return "fruit";
    }

    function normalizeFoodGraphSegment(segment) {
      /* 견과류 folded into 식품 (fruit + veg + nuts). */
      if (segment === "nuts") return "foods";
      if (segment === "fish" || segment === "meat" || segment === "foods") return segment;
      return "foods";
    }

    function foodFocusForSegment(segment, focus) {
      if (!focus || focus.type !== "food" || !focus.name) return null;
      const seg = normalizeFoodGraphSegment(segment);
      if (seg === "fish") return FOOD_FISH[focus.name] ? focus : null;
      if (seg === "meat") return FOOD_MEAT[focus.name] ? focus : null;
      /* 식품: plant foods (fruit/veg/nuts/other), not fish/meat notes cohorts. */
      if (FOOD_FISH[focus.name] || FOOD_MEAT[focus.name]) return null;
      return focus;
    }

    function cohortPairs(names) {
      const pairs = [];
      const list = Array.isArray(names) ? names : [];
      for (let i = 0; i < list.length; i += 1) {
        for (let j = i + 1; j < list.length; j += 1) {
          pairs.push([list[i], list[j]]);
        }
      }
      return pairs;
    }

    function statedFishFishPairs() {
      /* Literature-stated β-parvalbumin / serologic pairs only (fish-meat.md). */
      return STATED_FISH_FISH_PAIRS.slice();
    }

    function statedMeatMeatPairs() {
      /* Shared α-Gal epitope among named mammalian meats (fish-meat.md). */
      return cohortPairs(MEAT_ALPHA_GAL_COHORT);
    }

    function foodAdjFromPairs(pairs) {
      const adj = {};
      function touch(name) {
        if (!adj[name]) adj[name] = {};
      }
      for (let i = 0; i < pairs.length; i += 1) {
        const a = pairs[i][0];
        const b = pairs[i][1];
        if (!a || !b || a === b) continue;
        touch(a);
        touch(b);
        adj[a][b] = 1;
        adj[b][a] = 1;
      }
      return adj;
    }

    function sameExternalFoodPattern(a, b, adj) {
      const na = Object.keys(adj[a] || {});
      const nb = Object.keys(adj[b] || {});
      const sa = {};
      const sb = {};
      for (let i = 0; i < na.length; i += 1) {
        if (na[i] !== b) sa[na[i]] = 1;
      }
      for (let j = 0; j < nb.length; j += 1) {
        if (nb[j] !== a) sb[nb[j]] = 1;
      }
      const keysA = Object.keys(sa).sort();
      const keysB = Object.keys(sb).sort();
      if (keysA.length !== keysB.length) return false;
      for (let k = 0; k < keysA.length; k += 1) {
        if (keysA[k] !== keysB[k]) return false;
      }
      return true;
    }

    /* Fruits with identical stated external neighbors → one combined canvas label. */
    function buildEquivalentFruitClusters(pairs) {
      const adj = foodAdjFromPairs(pairs);
      const fruits = Object.keys(FOOD_FRUITS).filter((name) => adj[name]);
      fruits.sort((a, b) => a.localeCompare(b, "ko"));
      const parent = {};
      for (let i = 0; i < fruits.length; i += 1) parent[fruits[i]] = fruits[i];
      function find(x) {
        if (parent[x] !== x) parent[x] = find(parent[x]);
        return parent[x];
      }
      function union(a, b) {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent[rb] = ra;
      }
      for (let i = 0; i < fruits.length; i += 1) {
        for (let j = i + 1; j < fruits.length; j += 1) {
          if (sameExternalFoodPattern(fruits[i], fruits[j], adj)) {
            union(fruits[i], fruits[j]);
          }
        }
      }
      const groups = {};
      for (let i = 0; i < fruits.length; i += 1) {
        const root = find(fruits[i]);
        if (!groups[root]) groups[root] = [];
        groups[root].push(fruits[i]);
      }
      const memberToCluster = {};
      const clusters = [];
      const roots = Object.keys(groups);
      for (let r = 0; r < roots.length; r += 1) {
        const members = groups[roots[r]].slice().sort((a, b) => a.localeCompare(b, "ko"));
        if (members.length < 2) continue;
        const id = "food-cluster:" + members.join("+");
        const label = members.join("/");
        clusters.push({ id: id, label: label, members: members });
        for (let m = 0; m < members.length; m += 1) memberToCluster[members[m]] = id;
      }
      return { clusters: clusters, memberToCluster: memberToCluster };
    }

    function buildStatedFoodFoodPairs() {
      const seen = {};
      const pairs = [];
      function addPair(a, b) {
        if (!a || !b || a === b) return;
        const key = a < b ? a + "|" + b : b + "|" + a;
        if (seen[key]) return;
        seen[key] = 1;
        pairs.push([a, b]);
      }
      const ownerNames = Object.keys(COMPONENT_OWNER);
      for (let c = 0; c < ownerNames.length; c += 1) {
        const owners = COMPONENT_OWNER[ownerNames[c]] || [];
        const foodOwners = [];
        for (let o = 0; o < owners.length; o += 1) {
          const owner = owners[o];
          if (owner === "라텍스" || POLLEN_OWNER_SET[owner]) continue;
          foodOwners.push(owner);
        }
        for (let i = 0; i < foodOwners.length; i += 1) {
          for (let j = i + 1; j < foodOwners.length; j += 1) {
            addPair(foodOwners[i], foodOwners[j]);
          }
        }
      }
      for (let f = 0; f < FOOD_FAMILY_COHORTS.length; f += 1) {
        const foods = FOOD_FAMILY_COHORTS[f].foods;
        for (let i = 0; i < foods.length; i += 1) {
          for (let j = i + 1; j < foods.length; j += 1) {
            addPair(foods[i], foods[j]);
          }
        }
      }
      return pairs;
    }

    function buildPollenFoodGraphModel() {
      const pollenList = LITERATURE.pollen || [];
      const foodList = LITERATURE.foods || [];
      const allPairs = [];
      for (let i = 0; i < pollenList.length; i += 1) {
        const pollenName = pollenList[i] && pollenList[i].name;
        if (!pollenName) continue;
        const foods = POLLEN_FOOD_ASSOCIATIONS[pollenName] || [];
        for (let j = 0; j < foods.length; j += 1) {
          allPairs.push([pollenName, foods[j]]);
        }
      }
      const total = allPairs.length;
      const picked = allPairs.slice(0, POLLEN_FOOD_EDGE_CAP);
      const nodeIds = {};
      const nodes = [];
      function ensureNode(name, classKind, list) {
        if (nodeIds[name]) return nodeIds[name];
        const id = (classKind === "pollen" ? "pf-pollen:" : "pf-food:") + name;
        nodeIds[name] = id;
        nodes.push({
          id: id,
          label: name,
          kind: "safer",
          classKind: classKind,
          pending: false,
          pickId: literatureIdForName(list, name)
        });
        return id;
      }
      const links = [];
      for (let k = 0; k < picked.length; k += 1) {
        const pair = picked[k];
        const a = ensureNode(pair[0], "pollen", pollenList);
        const b = ensureNode(pair[1], foodNodeClassKind(pair[1]), foodList);
        links.push({ source: a, target: b, kind: "assoc" });
      }
      for (let p = 0; p < pollenList.length; p += 1) {
        const pname = pollenList[p] && pollenList[p].name;
        if (!pname) continue;
        if (!nodeIds[pname]) ensureNode(pname, "pollen", pollenList);
      }
      return {
        nodes: nodes,
        links: links,
        empty: total === 0,
        truncated: total > picked.length,
        shown: picked.length,
        total: total
      };
    }

    function renderPollenFoodGraph() {
      const model = buildPollenFoodGraphModel();
      const empty = model.empty
        ? '<p class="graph-empty">No stated pollen–food associations</p>'
        : "";
      const trunc = model.truncated
        ? '<p class="graph-note">Showing ' + model.shown + " of " + model.total + " stated associations</p>"
        : "";
      const expand = model.empty
        ? ""
        : '<button type="button" class="graph-expand-btn" data-graph-expand aria-label="Expand graph">크게 보기</button>';
      return '<section class="drug-graph" id="pollen-food-graph" aria-label="Pollen and food association graph">' +
        '<div class="drug-graph-head">' +
        '<p class="drug-graph-hint">Stated pollen/latex ↔ food · node → Note</p>' +
        expand +
        "</div>" +
        '<canvas class="drug-graph-canvas" width="360" height="220" role="img" aria-label="Network of stated pollen and food associations"></canvas>' +
        empty +
        '<div class="graph-legend" aria-hidden="true">' +
        '<span class="legend-item legend-pollen"><i></i>Pollen/latex</span>' +
        '<span class="legend-item legend-fruit"><i></i>Food</span>' +
        '<span class="legend-item legend-nut"><i></i>견과류</span>' +
        '<span class="legend-item legend-assoc"><i></i>Stated association</span>' +

    }

      mountAllergenForceGraph("pollen-food-graph", "pollen-food", buildPollenFoodGraphModel(), {
        charge: 850,

    function pickCappedFoodFoodPairs(allPairs) {
      const nutPairs = [];
      const otherPairs = [];
      for (let i = 0; i < allPairs.length; i += 1) {
        const pair = allPairs[i];
        if (FOOD_NUTS[pair[0]] || FOOD_NUTS[pair[1]]) nutPairs.push(pair);
        else otherPairs.push(pair);
      }
      const cap = FOOD_FOOD_EDGE_CAP;
      const nutTake = Math.min(nutPairs.length, Math.max(8, Math.floor(cap / 2)));
      const picked = nutPairs.slice(0, nutTake);
      for (let j = 0; j < otherPairs.length && picked.length < cap; j += 1) {
        picked.push(otherPairs[j]);
      }
      for (let k = nutTake; k < nutPairs.length && picked.length < cap; k += 1) {
        picked.push(nutPairs[k]);
      }
      return picked;
    }

    function filterNutTouchingPairs(allPairs) {
      const nutPairs = [];
      for (let i = 0; i < allPairs.length; i += 1) {
        const pair = allPairs[i];
        if (FOOD_NUTS[pair[0]] || FOOD_NUTS[pair[1]]) nutPairs.push(pair);
      }
      return nutPairs;
    }

    function buildFoodsSchematicModel(segment, focus) {
      const foodList = LITERATURE.foods || [];
      const seg = normalizeFoodGraphSegment(segment || "foods");
      let activeFocus = foodFocusForSegment(seg, focus || state.graphFocus);
      let pool = [];
      let picked = [];
      let total = 0;
      if (seg === "fish") {
        pool = statedFishFishPairs();
        total = pool.length;
        picked = pool.slice();
      } else if (seg === "meat") {
        pool = statedMeatMeatPairs();
        total = pool.length;
        picked = pool.slice();
      } else {
        /* 식품: fruit + veg + nuts shared-family edges in one view. */
        const allPairs = buildStatedFoodFoodPairs();
        pool = allPairs;
        total = pool.length;
        picked = pickCappedFoodFoodPairs(allPairs);
      }
      const clusterInfo = seg === "foods"
        ? buildEquivalentFruitClusters(pool)
        : { clusters: [], memberToCluster: {} };
      const nodeIds = {};
      const nodes = [];
      function ensureClusterNode(cluster) {
        if (nodeIds[cluster.id]) return nodeIds[cluster.id];
        nodeIds[cluster.id] = cluster.id;
        const pickName = cluster.members[0];
        nodes.push({
          id: cluster.id,
          label: cluster.label,
          kind: "safer",
          classKind: "fruit",
          pending: false,
          pickId: literatureIdForName(foodList, pickName),
          clusterMembers: cluster.members.slice()
        });
        return cluster.id;
      }
      function ensureNode(name) {
        const clusterId = clusterInfo.memberToCluster[name];
        if (clusterId) {
          const cluster = clusterInfo.clusters.find((c) => c.id === clusterId);
          if (cluster) return ensureClusterNode(cluster);
        }
        if (nodeIds[name]) return nodeIds[name];
        const id = "food-node:" + name;
        nodeIds[name] = id;
        nodes.push({
          id: id,
          label: name,
          kind: "safer",
          classKind: foodNodeClassKind(name),
          pending: false,
          pickId: literatureIdForName(foodList, name)
        });
        return id;
      }
      const links = [];
      const linkSeen = {};
      for (let k = 0; k < picked.length; k += 1) {
        const pair = picked[k];
        const a = ensureNode(pair[0]);
        const b = ensureNode(pair[1]);
        if (!a || !b || a === b) continue;
        const key = a < b ? a + "|" + b : b + "|" + a;
        if (linkSeen[key]) continue;
        linkSeen[key] = 1;
        links.push({ source: a, target: b, kind: "assoc" });
      }
      /* Named fish/meat foods from notes (none today) stay available as isolate seeds. */
      if (seg === "fish") {
        Object.keys(FOOD_FISH).forEach((name) => ensureNode(name));
      } else if (seg === "meat") {
        Object.keys(FOOD_MEAT).forEach((name) => ensureNode(name));
      }
      /* Focus a fruit that was clustered → focus the combined node label. */
      if (activeFocus && activeFocus.name && clusterInfo.memberToCluster[activeFocus.name]) {
        const cid = clusterInfo.memberToCluster[activeFocus.name];
        const cluster = clusterInfo.clusters.find((c) => c.id === cid);
        if (cluster) {
          activeFocus = { type: "food", name: cluster.label };
        }
      }
      return decorateOverviewGraphModel({
        nodes: nodes,
        links: links,
        empty: total === 0,
        truncated: total > picked.length,
        shown: picked.length,
        total: total,
        segment: seg
      }, activeFocus);
    }

      return '<section class="drug-graph" id="foods-schematic-graph" aria-label="' + aria + '">' +
