    function findNote(id) {
      if (typeof id === "string" && id.indexOf("stated:") === 0) {
        return { name: id.slice(7), cited: false, text: "" };

      if (id === "drug-a") return { name: "Drug A", cited: false, text: "" };
      const pools = ["beta", "other", "foods", "pollen", "components"];
      for (let i = 0; i < pools.length; i += 1) {

        if (hit) return hit;
      }
      return { name: "Note", cited: false, text: "" };
    }

    function resolveBrowserGeo() {
      if (state.koreaEnvGeo && state.koreaEnvGeo.resolved) {
        return Promise.resolve(state.koreaEnvGeo);
      }
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          const geo = {
            resolved: true,
            ok: false,
            reason: "unavailable",
            lat: null,
            lng: null
          };
          state.koreaEnvGeo = geo;
          resolve(geo);
          return;
        }
        navigator.geolocation.getCurrentPosition((pos) => {
          const geo = {
            resolved: true,
            ok: true,
            reason: null,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          state.koreaEnvGeo = geo;
          resolve(geo);
        }, (err) => {
          const geo = {
            resolved: true,
            ok: false,
            reason: err && err.code === 1 ? "denied" : "unavailable",
            lat: null,
            lng: null
          };
          state.koreaEnvGeo = geo;
          resolve(geo);
        }, {
          enableHighAccuracy: false,
          timeout: 8000,
          maximumAge: 5 * 60 * 1000
        });
      });
    }

    function loadKoreaEnvToday() {
      state.koreaEnvState = "loading";
      state.koreaEnvError = null;
      return resolveBrowserGeo().then((geo) => {
        let url = "/api/korea-env-today";
        if (geo && geo.ok && typeof geo.lat === "number" && typeof geo.lng === "number") {
          url += "?lat=" + encodeURIComponent(String(geo.lat)) +
            "&lng=" + encodeURIComponent(String(geo.lng));
        }
        return fetch(url, { cache: "no-store" });
      }).then((res) => {
        if (!res.ok) throw new Error("Korea env HTTP " + res.status);
        return res.json();
      }).then((payload) => {
        if (!payload || typeof payload !== "object") {
          throw new Error("Unexpected korea-env payload");
        }
        state.koreaEnv = payload;
        state.koreaEnvState = "ready";
      }).catch((err) => {
        state.koreaEnv = null;
        state.koreaEnvState = "error";
        state.koreaEnvError = err && err.message ? err.message : "Korea env unavailable";
      });
    }

    function formatPollenSummary(slot) {
      if (!slot || slot.status !== "ok") return null;
      const counts = slot.counts || null;
      if (!counts ||
          typeof counts.tree !== "number" ||
          typeof counts.grass !== "number" ||
          typeof counts.weed !== "number" ||
          typeof counts.mold !== "number") {
        return slot.summary ? String(slot.summary) : null;
      }
      const bits = [
        "🌳수목 " + counts.tree,
        "🌾목초 " + counts.grass,
        "🌿잡초 " + counts.weed,
        "🍄곰팡이 " + counts.mold
      ];
      let summary = bits.join(" · ");
      if (slot.risk_label) summary = String(slot.risk_label) + " · " + summary;
      return summary;
    }

    function koreaEnvSlotSummary(slot, label) {
      if (!slot || typeof slot !== "object" || slot.status !== "ok") return null;
      if (label === "꽃가루") return formatPollenSummary(slot);
      return slot.summary ? String(slot.summary) : null;
    }

    function koreaEnvSlotBit(slot, label) {
      const summary = koreaEnvSlotSummary(slot, label);
      if (!summary) {
        return '<span class="korea-env-bit is-na"><span class="korea-env-k">' +
          esc(label) + "</span> unavailable</span>";
      }
      return '<span class="korea-env-bit"><span class="korea-env-k">' +
        esc(label) + "</span> " + esc(summary) + "</span>";
    }

    /* Region-only meta for the merged home status line (no date / issued_at). */
    function koreaEnvRegionMeta(env) {
      const loc = env && env.location ? env.location : null;
      const geo = state.koreaEnvGeo;
      const parts = [];
      /* Seoul fallback keeps stated Seoul data; avoid repeating "서울 · … · 서울 기준". */
      if (loc && loc.mode === "fallback_seoul") {
        parts.push("서울");
        if (geo && geo.reason === "denied") parts.push("위치 권한 없음");
        else if (geo && geo.reason === "unavailable") parts.push("위치 불가");
      } else if (loc && loc.display) {
        parts.push(loc.display);
        if (loc.mode === "geolocation") parts.push("내 위치 기준");
      } else if (state.koreaEnvState === "ready") {

      return parts.join(" · ");
    }

    /* KMA sometimes emits "(목)요일"; normalize to "목요일". */
    function fixKoreanWeekdayParen(text) {
      return String(text || "").replace(/\(([월화수목금토일])\)요일/g, "$1요일");
    }

    function weatherConditionEmojis(text) {
      const t = String(text || "");
      const out = [];
      if (/뇌전|천둥|번개/.test(t)) out.push("⛈️");
      if (/눈|진눈|빙판/.test(t)) out.push("🌨️");
      if (/소나기|비|강수|장마/.test(t)) out.push("🌧️");
      if (/안개|연무|황사/.test(t)) out.push("🌫️");
      const cloudy = /구름|흐림/.test(t);
      const clear = /맑/.test(t);
      if (cloudy && clear) out.push("⛅");
      else if (clear) out.push("☀️");
      else if (cloudy) out.push("☁️");
      if (!out.length) out.push("🌡️");
      const seen = {};
      const uniq = [];
      for (let i = 0; i < out.length; i += 1) {
        if (seen[out[i]]) continue;
        seen[out[i]] = true;
        uniq.push(out[i]);
      }
      return uniq.slice(0, 2).join("");
    }

    function parseTempNums(value) {
      if (value == null) return [];
      const m = String(value).match(/-?\d+(?:\.\d+)?/g);
      if (!m) return [];
      const nums = [];
      for (let i = 0; i < m.length; i += 1) {
        const n = Number(m[i]);
        if (!Number.isNaN(n)) nums.push(n);
      }
      return nums;
    }

    function formatShortTempC(nums) {
      if (!nums || !nums.length) return "";
      let lo = nums[0];
      let hi = nums[0];
      for (let i = 1; i < nums.length; i += 1) {
        if (nums[i] < lo) lo = nums[i];
        if (nums[i] > hi) hi = nums[i];
      }
      const fmt = (n) => {
        const r = Math.round(n);
        if (Math.abs(n - r) < 0.05) return String(r);
        return (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
      };
      if (Math.abs(lo - hi) < 0.05) return fmt(lo) + "℃";
      return fmt(lo) + "~" + fmt(hi) + "℃";
    }

    function homeHeaderWeatherFullText() {
      if (state.koreaEnvState === "loading" || state.koreaEnvState === "idle") {
        return "날씨 · 불러오는 중…";
      }
      if (state.koreaEnvState === "error" || !state.koreaEnv) {
        return "날씨 unavailable";
      }
      const summary = koreaEnvSlotSummary(state.koreaEnv.weather, "날씨");
      return summary || "날씨 unavailable";
    }

    function homeHeaderWeatherCompact() {
      if (state.koreaEnvState === "loading" || state.koreaEnvState === "idle") {
        return { full: "날씨 · 불러오는 중…", face: "…", emojis: "", temp: "" };
      }
      if (state.koreaEnvState === "error" || !state.koreaEnv) {
        return { full: "날씨 unavailable", face: "—", emojis: "", temp: "" };
      }
      const weather = state.koreaEnv.weather;
      const full = homeHeaderWeatherFullText();
      if (!weather || weather.status !== "ok") {
        return { full: full, face: "—", emojis: "", temp: "" };
      }
      const phrase = weather.today_summary || weather.summary || "";
      const emojis = weatherConditionEmojis(phrase);
      let nums = parseTempNums(weather.temp_low_c).concat(parseTempNums(weather.temp_high_c));
      if (!nums.length) nums = parseTempNums(weather.summary);
      const temp = formatShortTempC(nums);
      const face = temp ? (emojis + " " + temp) : emojis;
      return { full: full, face: face, emojis: emojis, temp: temp };
    }

    function loadPaperTimeline() {
      if (typeof PAPER_TIMELINE === "undefined" || !PAPER_TIMELINE.loadPapers) {
        state.papersState = "error";
        state.papersError = "Paper timeline module missing";
        return Promise.resolve();
      }
      state.papersState = "loading";
      state.papersError = null;
      state.papersTodayError = null;
      const feed = PAPER_TIMELINE.loadPapers().then((payload) => {
        state.papersList = payload.papers;
        state.papersTotal = payload.total;
        state.papersFeedMeta = {
          updatedAt: payload.updatedAt || null,
          updatedAtDisplay: payload.updatedAtDisplay || null,
          updatedAtTimezone: payload.updatedAtTimezone || "Asia/Seoul",
          updatedAtSource: payload.updatedAtSource || null
        };
        state.papersState = "ready";
      }).catch((err) => {
        state.papersState = "error";
        state.papersError = err && err.message ? err.message : "Failed to load papers";
      });
      const today = (PAPER_TIMELINE.loadTodayStats
        ? PAPER_TIMELINE.loadTodayStats()
        : Promise.resolve(null)
      ).then((stats) => {
        state.papersTodayStats = stats;
      }).catch((err) => {
        state.papersTodayStats = null;
        state.papersTodayError = err && err.message ? err.message : "Today stats unavailable";
      });
      const env = loadKoreaEnvToday();
      return Promise.all([feed, today, env]).then(() => {
        if (state.screen === "home" && document.getElementById("content")) render();
      });
    }

    function lookupTable() {
      try {
        if (typeof LOOKUP !== "object" || LOOKUP === null) return {};
        return LOOKUP;
      } catch (err) {
        return {};
      }
    }

    function lookupList() {
      const table = lookupTable();
      const keys = Object.keys(table);
      const list = [];
      for (let i = 0; i < keys.length; i += 1) {
        const entry = table[keys[i]];
        if (!entry || typeof entry !== "object" || typeof entry.name !== "string" || !entry.name) continue;
        list.push({
          id: typeof entry.id === "string" ? entry.id : keys[i],
          name: entry.name,
          entry: entry
        });
      }
      return list;
    }

    function drugMatches(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return [];
      const list = lookupList();
      const out = [];
      for (let i = 0; i < list.length; i += 1) {
        if (list[i].name.toLowerCase().indexOf(q) === -1) continue;
        out.push(list[i]);
        if (out.length === 8) break;
      }
      return out;
    }

    function exactDrug(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return null;
      const list = lookupList();
      for (let i = 0; i < list.length; i += 1) {
        if (list[i].name.toLowerCase() === q) return list[i];
      }
      return null;
    }

    function suggestionButtons(query) {
      return drugMatches(query).map((item) =>
        '<button type="button" class="suggestion" data-pick-drug="' + esc(item.id) + '">' + esc(item.name) + "</button>"
      ).join("");
    }

    function paintSuggestions() {
      const box = document.getElementById("drug-suggestions");
      if (!box) return;
      box.innerHTML = suggestionButtons(state.drugQuery);
    }

    function selectedDrug() {
      if (!state.drugId) return null;
      const table = lookupTable();
      const direct = table[state.drugId];
      if (direct && typeof direct === "object" && typeof direct.name === "string") return direct;
      const list = lookupList();
      for (let i = 0; i < list.length; i += 1) {
        if (list[i].id === state.drugId) return list[i].entry;
      }
      return null;
    }

    function selectDrug(id) {
      const list = lookupList();
      let hit = null;
      for (let i = 0; i < list.length; i += 1) {
        if (list[i].id === id) hit = list[i];
      }
      if (!hit) return;
      state.drugId = hit.id;
      state.drugQuery = "";
      render();

    // remaining LITERATURE.other → 그외 약들 (includes Neomycin/sulfonamides — not labeled beta-lactam in sources).
    const DRUG_CONTRAST_IDS = {
      "other:Iohexol": true,

    /* Aromatic ASMs confirmed for 항경련제 browse (MAA-84). Citations in
     * other-drugs.md / LITERATURE.other notes. No invented agents beyond this set.
     */
    const DRUG_ANTICONVULSANT_IDS = {

    function drugBrowseGroups() {
      const table = lookupTable();
      const antibiotics = [];
      const contrast = [];
      const oncology = [];
      const anticonvulsants = [];
      const other = [];
      const beta = Array.isArray(LITERATURE.beta) ? LITERATURE.beta : [];
      for (let i = 0; i < beta.length; i += 1) {
        const note = beta[i];
        if (!note || !table[note.id]) continue;
        antibiotics.push({ id: note.id, name: note.name || table[note.id].name });
      }
      const rest = Array.isArray(LITERATURE.other) ? LITERATURE.other : [];
      for (let i = 0; i < rest.length; i += 1) {
        const note = rest[i];
        if (!note || !table[note.id]) continue;
        const row = { id: note.id, name: note.name || table[note.id].name };
        if (DRUG_CONTRAST_IDS[note.id]) contrast.push(row);
        else if (DRUG_ONCOLOGY_IDS[note.id]) oncology.push(row);
        else if (DRUG_ANTICONVULSANT_IDS[note.id]) anticonvulsants.push(row);
        else other.push(row);
      }
      return [
        { id: "antibiotics", label: "항생제", items: antibiotics },
        { id: "contrast", label: "조영제", items: contrast },
        { id: "oncology", label: "항암제", items: oncology },
        { id: "anticonvulsants", label: "항경련제", items: anticonvulsants },
        { id: "other", label: "그외 약들", items: other }
      ];
    }

    /* Browse subsections from stated class tables only. Unlisted → Source pending. */
    function drugBrowseClassSections(items, infoFn, orderKeysFn) {
      const list = Array.isArray(items) ? items : [];
      const buckets = {};
      const resolve = typeof infoFn === "function" ? infoFn : drugClassInfoForName;
      const orderKeys = typeof orderKeysFn === "function" ? orderKeysFn() : drugClassOrderKeys();
      for (let i = 0; i < list.length; i += 1) {
        const row = list[i];
        const name = row && typeof row.name === "string" ? row.name : "";
        const info = resolve(name);
        const key = info.classKey || "pending";
        if (!buckets[key]) {
          buckets[key] = {
            key: key,
            label: info.displayClass || (key === "pending" ? "Source pending" : key),
            items: []
          };
        }
        buckets[key].items.push(row);
      }
      const sections = [];
      for (let o = 0; o < orderKeys.length; o += 1) {
        const key = orderKeys[o];
        const bucket = buckets[key];
        if (!bucket || !bucket.items.length) continue;
        bucket.items.sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
        sections.push(bucket);
        delete buckets[key];
      }
      const leftovers = Object.keys(buckets);
      for (let l = 0; l < leftovers.length; l += 1) {
        const bucket = buckets[leftovers[l]];
        if (!bucket || !bucket.items.length) continue;
        bucket.items.sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
        sections.push(bucket);
      }
      return sections;
    }

    function contrastClassInfoForName(name) {
      const table = typeof CONTRAST_CLASS_BY_NAME !== "undefined" ? CONTRAST_CLASS_BY_NAME : {};
      const hit = table[name];
      if (hit && hit.classKey) {
        return { classKey: hit.classKey, displayClass: hit.displayClass || hit.classKey };
      }
      return { classKey: "pending", displayClass: "Source pending" };
    }
    function contrastClassOrderKeys() {
      const order = typeof CONTRAST_CLASS_ORDER !== "undefined" ? CONTRAST_CLASS_ORDER : [];
      const keys = order.map((row) => row.classKey);
      if (keys.indexOf("pending") < 0) keys.push("pending");
      return keys;
    }
    function oncologyClassInfoForName(name) {
      const table = typeof ONCOLOGY_CLASS_BY_NAME !== "undefined" ? ONCOLOGY_CLASS_BY_NAME : {};
      const hit = table[name];
      if (hit && hit.classKey) {
        return { classKey: hit.classKey, displayClass: hit.displayClass || hit.classKey };
      }
      return { classKey: "pending", displayClass: "Source pending" };
    }
    function oncologyClassOrderKeys() {
      const order = typeof ONCOLOGY_CLASS_ORDER !== "undefined" ? ONCOLOGY_CLASS_ORDER : [];
      const keys = order.map((row) => row.classKey);
      if (keys.indexOf("pending") < 0) keys.push("pending");
      return keys;
    }
    function anticonvulsantClassInfoForName(name) {
      const table = typeof ANTICONVULSANT_CLASS_BY_NAME !== "undefined" ? ANTICONVULSANT_CLASS_BY_NAME : {};
      const hit = table[name];
      if (hit && hit.classKey) {
        return { classKey: hit.classKey, displayClass: hit.displayClass || hit.classKey };
      }
      return { classKey: "pending", displayClass: "Source pending" };
    }
    function anticonvulsantClassOrderKeys() {
      const order = typeof ANTICONVULSANT_CLASS_ORDER !== "undefined" ? ANTICONVULSANT_CLASS_ORDER : [];
      const keys = order.map((row) => row.classKey);
      if (keys.indexOf("pending") < 0) keys.push("pending");
      return keys;
    }

    function renderDrugBrowseItems(items) {
      let html = "";
      for (let j = 0; j < items.length; j += 1) {
        html += '<button type="button" class="drug-browse-item" role="listitem" data-pick-drug="' +
          esc(items[j].id) + '">' + esc(items[j].name) + "</button>";
      }
      return html;
    }

    function renderDrugBrowseClassSection(section, extraClass) {
      const klass = extraClass ? ("drug-browse-class " + extraClass) : "drug-browse-class";
      return '<div class="' + klass + '">' +
        '<h4 class="drug-browse-class-label">' +
        '<span class="drug-browse-class-name">' + esc(section.label) + "</span>" +
        '<span class="drug-browse-class-count" aria-label="' +
        section.items.length + ' drugs">' + section.items.length + "</span></h4>" +
        '<div class="drug-browse-class-grid" role="list">' +
        renderDrugBrowseItems(section.items) +
        "</div></div>";
    }

    /* ICM A–D as mobile 2×2 carbamoyl quadrants; ionic list stays below (contrast-media.ts). */
    function renderContrastBrowseSections(items) {
      const sections = drugBrowseClassSections(items, contrastClassInfoForName, contrastClassOrderKeys);
      const byKey = {};
      for (let s = 0; s < sections.length; s += 1) byKey[sections[s].key] = sections[s];
      const qKeys = typeof CONTRAST_QUADRANT_KEYS !== "undefined"
        ? CONTRAST_QUADRANT_KEYS
        : ["icm_a", "icm_b", "icm_c", "icm_d"];
      let html = '<div class="drug-browse-contrast-quadrants" role="group" ' +
        'aria-label="ICM carbamoyl groups A–D">' ;
      for (let q = 0; q < qKeys.length; q += 1) {
        const key = qKeys[q];
        const section = byKey[key];
        if (!section) continue;
        html += renderDrugBrowseClassSection(section, "drug-browse-quadrant");
        delete byKey[key];
      }
      html += "</div>";
      const leftovers = Object.keys(byKey);
      for (let l = 0; l < leftovers.length; l += 1) {
        html += renderDrugBrowseClassSection(byKey[leftovers[l]]);
      }
      return html;
    }

    function renderDrugBrowse() {
      const groups = drugBrowseGroups();
      let html = '<div class="drug-browse" aria-label="Browse drugs by category">';
      for (let i = 0; i < groups.length; i += 1) {
        const group = groups[i];
        const open = state.drugBrowseOpen === group.id;
        html += '<div class="drug-browse-group">' +
          '<button type="button" class="drug-browse-toggle" data-drug-browse="' + esc(group.id) + '" aria-expanded="' +
          (open ? "true" : "false") + '"><span class="drug-browse-label">' + esc(group.label) +
          '</span><span class="drug-browse-count">' + group.items.length + "</span></button>";
        if (open) {
          html += '<div class="drug-browse-list" role="list">';
          if (group.id === "contrast") {
            html += renderContrastBrowseSections(group.items);
          } else {
            let sections = null;
            if (group.id === "antibiotics") {
              sections = drugBrowseClassSections(group.items, drugClassInfoForName, drugClassOrderKeys);
            } else if (group.id === "oncology") {
              sections = drugBrowseClassSections(group.items, oncologyClassInfoForName, oncologyClassOrderKeys);
            } else if (group.id === "anticonvulsants") {
              sections = drugBrowseClassSections(group.items, anticonvulsantClassInfoForName, anticonvulsantClassOrderKeys);
            }
            if (sections) {
              for (let s = 0; s < sections.length; s += 1) {
                html += renderDrugBrowseClassSection(sections[s]);
              }
            } else if (!group.items.length) {
              html += '<p class="search-prompt">Source pending. No named agents in attached other-drugs literature.</p>';
            } else {
              html += '<div class="drug-browse-class-grid" role="list">' +
                renderDrugBrowseItems(group.items) + "</div>";
            }
          }
          html += "</div>";
        }
        html += "</div>";
      }
      return html + "</div>";
    }

    function pairNoteId(row) {
      if (row && typeof row.noteId === "string") return row.noteId;
      const name = row && typeof row.name === "string" ? row.name : "";
      return "stated:" + name;
    }

    function pairRowHtml(row) {
      const item = row && typeof row === "object" ? row : {};
      const name = typeof item.name === "string" ? item.name : "";
      const reason = typeof item.reason === "string"
        ? '<span class="reason">' + esc(item.reason) + "</span>"
        : "";
      const pending = item.pendingRow ? '<span class="pending-mark">Source pending</span>' : "";
      return '<div class="row pair-row"><div class="row-text"><span class="row-name">' + esc(name) + "</span>" +
        reason + pending + "</div>" + noteBtn(pairNoteId(item)) + "</div>";
    }

    function pairRows(rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        return '<p class="unstated">Not stated in source</p>';
      }
      /* Group under CSV class labels (drug_class.csv). Unlisted → Source pending. */
      const buckets = {};
      const orderKeys = drugClassOrderKeys();
      for (let i = 0; i < rows.length; i += 1) {
        const row = rows[i];
        const name = row && typeof row.name === "string" ? row.name : "";
        const info = drugClassInfoForName(name);
        const key = info.classKey || "pending";
        if (!buckets[key]) {
          buckets[key] = {
            key: key,
            label: info.displayClass || (key === "pending" ? "Source pending" : key),
            rows: []
          };
        }
        buckets[key].rows.push(row);
      }
      const parts = [];
      for (let o = 0; o < orderKeys.length; o += 1) {
        const key = orderKeys[o];
        const bucket = buckets[key];
        if (!bucket || !bucket.rows.length) continue;
        parts.push(
          '<div class="pair-class-block">' +
          '<h4 class="pair-class-label">' + esc(bucket.label) + "</h4>" +
          bucket.rows.map(pairRowHtml).join("") +
          "</div>"
        );
        delete buckets[key];
      }
      const leftovers = Object.keys(buckets);
      for (let l = 0; l < leftovers.length; l += 1) {
        const bucket = buckets[leftovers[l]];
        if (!bucket || !bucket.rows.length) continue;
        parts.push(
          '<div class="pair-class-block">' +
          '<h4 class="pair-class-label">' + esc(bucket.label) + "</h4>" +
          bucket.rows.map(pairRowHtml).join("") +
          "</div>"
        );
      }
      return parts.join("");
    }

    function pairCard(kind, rows, titled) {
      const safer = kind === "safer";
      const title = safer ? "Safer alternatives" : "High cross-reactivity";
      const head = titled
        ? '<h3 class="group-title' + (safer ? " safer" : "") + '">' + title + "</h3>"
        : "";
      return '<section class="card group">' + head + pairRows(rows) + "</section>";
    }

    function drugHeader(entry, inCard) {
      const noteId = typeof entry.id === "string" ? entry.id : state.drugId;
      const pending = entry.pending ? '<p class="header-pending">Source pending</p>' : "";
      const inner = '<div class="headline"><h2 class="screen-title">' + esc(entry.name) + "</h2>" +
        noteBtn(noteId) + "</div>" + pending;
      return inCard ? '<section class="card header-card">' + inner + "</section>" : inner;
    }

    function stopDrugGraph() {
      if (drugGraphAnim) {
        cancelAnimationFrame(drugGraphAnim);
        drugGraphAnim = null;
      }
      const ids = Object.keys(graphRuntimeByRootId);
      for (let i = 0; i < ids.length; i += 1) {
        const rt = graphRuntimeByRootId[ids[i]];
        if (rt && rt.anim) {
          cancelAnimationFrame(rt.anim);
          rt.anim = null;
        }
      }
    }

    function dismissGraphNodeMenu() {
      const menu = document.getElementById("graph-node-menu");
      if (menu) menu.remove();
      document.querySelectorAll(".drug-graph.has-node-menu").forEach((el) => {
        el.classList.remove("has-node-menu");
        el.style.minHeight = "";
      });
    }

    function closeDrugGraphExpand() {
      dismissGraphNodeMenu();
      const overlay = document.getElementById("drug-graph-expand");
      if (overlay) overlay.remove();
    }

    function clearDrugGraphSession() {
      stopDrugGraph();
      dismissGraphNodeMenu();
      closeDrugGraphExpand();
      drugGraphMountedForId = null;
      drugGraphRuntime = null;
      graphRuntimeByRootId = {};
    }

    function isAllergenFocusMode(mode) {
      return mode === "allergen-focus";
    }

    function isAllergenOverviewMode(mode) {
      return mode === "component" || mode === "pollen-food" ||
        mode === "foods-schematic" || mode === "foods-nuts";
    }

    function isAllergenGraphMode(mode) {
      return isAllergenOverviewMode(mode) || isAllergenFocusMode(mode);
    }

    function activateGraphRuntime(rootId) {
      if (rootId && graphRuntimeByRootId[rootId]) {
        drugGraphRuntime = graphRuntimeByRootId[rootId];
      }
      return drugGraphRuntime;
    }

    function drugPairGroupsHtml(entry, openSegment) {
      const safer = Array.isArray(entry.safer) ? entry.safer : [];
      const high = Array.isArray(entry.high) ? entry.high : [];
      const open = openSegment === "high" ? "high" : "safer";
      return pairCard(open, open === "high" ? high : safer, false);
    }

    function patchDrugSegment(segmentId) {
      const open = segmentId === "high" ? "high" : "safer";
      state.drugSegment = open;
      const content = document.getElementById("content");
      const entry = selectedDrug();
      if (!content || !entry) return;
      content.querySelectorAll("[data-drug-segment]").forEach((button) => {
        button.setAttribute("aria-checked", String(button.dataset.drugSegment === open));
      });
      const groups = content.querySelector(".groups");
      if (groups) groups.innerHTML = drugPairGroupsHtml(entry, open);
      const focusBtn = content.querySelector('[data-drug-segment="' + open + '"]');
      if (focusBtn) focusBtn.focus();
    }

    function showGraphNodeMenu(node, clientX, clientY, host) {
      dismissGraphNodeMenu();
      if (!host || !node || node.kind === "center") return;
      const fullLabel = String(node.label || "");
      const menu = document.createElement("div");
      const needsWide = fullLabel.split("/").length > 2 || fullLabel.length > 12;
      menu.className = "graph-node-menu" + (needsWide ? " is-wide" : "");
      menu.id = "graph-node-menu";
      menu.setAttribute("role", "dialog");
      menu.setAttribute("aria-label", fullLabel);
      const canLookup = !!node.pickId;
      const mode = drugGraphRuntime && drugGraphRuntime.mode;
      const focusMode = !!(mode && isAllergenFocusMode(mode));
      const overviewAllergen = !!(mode && isAllergenOverviewMode(mode));
      const actionLabel = overviewAllergen ? "Note" : "조회";
      const disabledLabel = overviewAllergen ? "Note 없음" : (focusMode ? "조회 불가" : "조회 불가");
      /* Full cluster labels (귤/딸기/…) — never truncate in the menu. */
      menu.innerHTML = '<p class="graph-node-menu-name">' + esc(fullLabel) + "</p>" +
        (canLookup
          ? '<button type="button" class="graph-node-menu-lookup" data-graph-lookup="' + esc(node.pickId) + '">' + actionLabel + "</button>"
          : '<span class="graph-node-menu-disabled">' + disabledLabel + "</span>");
      host.classList.add("has-node-menu");
      host.appendChild(menu);

      const hostRect = host.getBoundingClientRect();
      const scaleX = host.offsetWidth ? hostRect.width / host.offsetWidth : 1;
      const scaleY = host.offsetHeight ? hostRect.height / host.offsetHeight : 1;
      if (menu.classList.contains("is-wide")) {
        menu.style.width = Math.max(160, host.offsetWidth - 16) + "px";
        menu.style.maxWidth = Math.max(160, host.offsetWidth - 16) + "px";
      }
      let left = (clientX - hostRect.left) / (scaleX || 1);
      let top = (clientY - hostRect.top) / (scaleY || 1) + 10;
      const menuWidth = menu.offsetWidth;
      const menuHeight = menu.offsetHeight;
      left = Math.max(8, Math.min(left, host.offsetWidth - menuWidth - 8));
      /* Prefer below the tap; if it would clip, flip above. Allow overflow past host bottom so long wraps stay readable. */
      const spaceBelow = host.offsetHeight - top - 8;
      if (menuHeight > spaceBelow) {
        const above = (clientY - hostRect.top) / (scaleY || 1) - menuHeight - 10;
        top = above >= 8 ? above : 8;
      }
      menu.style.left = left + "px";
      menu.style.top = top + "px";
      /* Grow host when the full label still needs more vertical room. */
      if (top + menuHeight > host.offsetHeight - 8) {
        host.style.minHeight = Math.ceil(top + menuHeight + 12) + "px";
      }

      menu.addEventListener("click", (event) => {
        const lookup = event.target.closest("[data-graph-lookup]");
        if (!lookup) return;
        event.preventDefault();
        event.stopPropagation();
        const pickId = lookup.dataset.graphLookup;
        dismissGraphNodeMenu();
        closeDrugGraphExpand();
        if (!pickId) return;
        /* allergen focus mirrors drug 조회; overview allergen graphs open Note */
        if (drugGraphRuntime && isAllergenFocusMode(drugGraphRuntime.mode)) {
          selectAllergen(pickId);
          return;
        }
        if (
          pickId.indexOf("pollen:") === 0 ||
          (drugGraphRuntime && isAllergenOverviewMode(drugGraphRuntime.mode))
        ) {
          state.noteId = pickId;
          state.noteReturn = "allergen";
          state.screen = "note";
          render();
          return;
        }
        selectDrug(pickId);
      });
    }

    function nodeFillColor(node, colors) {
      if (node.classKind && colors[node.classKind]) return colors[node.classKind];
      if (node.kind === "center") return colors.center;
      if (node.kind === "high") return colors.high;
      return colors.safer;
    }

    function linkStrokeColor(link, colors) {
      if (link.kind === "high") return colors.high;
      if (link.kind === "safer") return colors.safer;
      if (link.kind === "assoc") return colors.assoc || colors.muted;
      return colors.safer;
    }

    function paintDrugGraphFrame(ctx, width, height, nodes, links, colors, expanded, overlay) {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#f8f6f2";
      ctx.fillRect(0, 0, width, height);

      const classLabels = overlay && Array.isArray(overlay.classLabels) ? overlay.classLabels : [];
      const focusKey = overlay && overlay.focusClassKey ? overlay.focusClassKey : null;
      for (let c = 0; c < classLabels.length; c += 1) {
        const region = classLabels[c];
        if (!region || !region.label) continue;
        if (focusKey && region.classKey && region.classKey !== focusKey) continue;
        const focused = !!(focusKey && region.classKey === focusKey);
        const box = region.box;
        if (box && box.w && box.h) {
          const rx = 10;
          const labelH = Math.max(16, box.labelH || 18);
          ctx.beginPath();
          if (typeof ctx.roundRect === "function") {
            ctx.roundRect(box.x, box.y, box.w, box.h, rx);
          } else {
            const x0 = box.x;
            const y0 = box.y;
            const x1 = box.x + box.w;
            const y1 = box.y + box.h;
            ctx.moveTo(x0 + rx, y0);
            ctx.lineTo(x1 - rx, y0);
            ctx.quadraticCurveTo(x1, y0, x1, y0 + rx);
            ctx.lineTo(x1, y1 - rx);
            ctx.quadraticCurveTo(x1, y1, x1 - rx, y1);
            ctx.lineTo(x0 + rx, y1);
            ctx.quadraticCurveTo(x0, y1, x0, y1 - rx);
            ctx.lineTo(x0, y0 + rx);
            ctx.quadraticCurveTo(x0, y0, x0 + rx, y0);
            ctx.closePath();
          }
          ctx.fillStyle = focused ? "rgba(47, 111, 237, 0.10)" : "rgba(255, 255, 255, 0.72)";
          ctx.fill();
          ctx.strokeStyle = focused ? "rgba(29, 78, 216, 0.55)" : "rgba(36, 34, 30, 0.22)";
          ctx.lineWidth = focused ? 1.6 : 1.1;
          ctx.stroke();
          /* Dedicated label band — kept clear of drug nodes. */
          ctx.fillStyle = focused ? "rgba(29, 78, 216, 0.18)" : "rgba(255, 255, 255, 0.92)";
          ctx.fillRect(box.x + 1, box.y + 1, box.w - 2, labelH - 1);
          ctx.strokeStyle = focused ? "rgba(29, 78, 216, 0.28)" : "rgba(36, 34, 30, 0.10)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(box.x + 1, box.y + labelH);
          ctx.lineTo(box.x + box.w - 1, box.y + labelH);
          ctx.stroke();
          ctx.font = (focused ? "700 12px " : "700 11px ") +
            'Inter, "WenQuanYi Micro Hei", sans-serif';
          ctx.fillStyle = focused ? "#1e3a8a" : "#1c1917";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(
            shortLabel(region.label, expanded || focused ? 32 : 20),
            box.x + box.w / 2,
            box.y + labelH / 2 + 0.5
          );
        } else {
          /* Legacy circular fallback */
          const r = region.radius || 34;
          ctx.beginPath();
          ctx.arc(region.x, region.y, r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(47, 111, 237, 0.06)";
          ctx.fill();
          ctx.strokeStyle = "rgba(47, 111, 237, 0.18)";
          ctx.stroke();
          ctx.font = '700 10px Inter, "WenQuanYi Micro Hei", sans-serif';
          ctx.fillStyle = colors.ink || "#24221e";
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(shortLabel(region.label, 18), region.x, region.y - r + 2);
        }
      }

      for (let i = 0; i < links.length; i += 1) {
        const link = links[i];
        const dim = !!(link.source && link.source.dimmed) || !!(link.target && link.target.dimmed);
        const hot = !dim && (
          (link.source && (link.source.kind === "center" || link.source.selected)) ||
          (link.target && (link.target.kind === "center" || link.target.selected))
        );
        ctx.beginPath();
        ctx.moveTo(link.source.x, link.source.y);
        ctx.lineTo(link.target.x, link.target.y);
        ctx.strokeStyle = linkStrokeColor(link, colors);
        ctx.globalAlpha = dim ? 0.12 : (hot ? 0.9 : 0.72);
        ctx.lineWidth = expanded ? (hot ? 2.4 : 2) : (hot ? 2 : 1.5);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      for (let i = 0; i < nodes.length; i += 1) {
        const node = nodes[i];
        const isFocus = node.kind === "center" || !!node.selected;
        const classZoom = !!node.classZoom;
        const r = node.kind === "center"
          ? (expanded ? 14 : 11)
          : (classZoom
            ? (expanded ? 12 : 10)
            : (node.selected ? (expanded ? 10 : 8) : (expanded ? 8 : 6.5)));
        ctx.globalAlpha = node.dimmed ? 0.14 : 1;
        ctx.beginPath();
        ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
        ctx.fillStyle = node.kind === "center" ? colors.center : nodeFillColor(node, colors);
        ctx.fill();
        if (node.pending) {
          ctx.setLineDash([3, 2]);
          ctx.strokeStyle = colors.muted;
          ctx.lineWidth = 1.6;
          ctx.stroke();
          ctx.setLineDash([]);
        } else if (isFocus || classZoom) {
          ctx.strokeStyle = "#1d4ed8";
          ctx.lineWidth = node.kind === "center" ? 1.6 : (classZoom ? 1.5 : 1.3);
          ctx.stroke();
        }

        /* In class-zoom, skip dimmed labels so focus names stay readable. */
        if (!(node.dimmed && focusKey)) {
          let label;
          if (expanded || classZoom) {
            label = shortLabel(node.label, node.kind === "center" ? 36 : (classZoom ? 16 : 28));
          } else {
            const maxChars = node.kind === "center" ? 14 : (nodes.length > 18 ? 7 : 10);
            label = shortLabel(node.label, maxChars);
          }
          ctx.font = (isFocus || classZoom
            ? (expanded || classZoom ? "600 13px " : "600 11px ")
            : (expanded ? "500 12px " : "500 10px ")) +
            'Inter, "WenQuanYi Micro Hei", sans-serif';
          ctx.fillStyle = node.dimmed ? colors.muted : colors.ink;
          ctx.textAlign = "center";
          /* Center label above node in zoom so it won't collide with lower focus labels. */
          if (focusKey && node.kind === "center") {
            ctx.textBaseline = "bottom";
            ctx.fillText(label, node.x, node.y - r - 4);
          } else {
            ctx.textBaseline = "top";
            ctx.fillText(label, node.x, node.y + r + 3);
          }
        }
        ctx.globalAlpha = 1;
      }
    }

    function hitTestGraphNode(nodes, x, y, threshold) {
      let hit = null;
      let best = threshold;
      for (let i = 0; i < nodes.length; i += 1) {
        const node = nodes[i];
        if (node.kind === "center") continue;
        const dx = node.x - x;
        const dy = node.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < best) {
          best = dist;
          hit = node;
        }
      }
      return hit;
    }

    function hitTestClassLabel(labels, x, y) {
      const rows = Array.isArray(labels) ? labels : [];
      let hit = null;
      let best = Infinity;
      for (let i = 0; i < rows.length; i += 1) {
        const region = rows[i];
        if (!region || !region.classKey) continue;
        const box = region.box;
        if (box && box.w && box.h) {
          const pad = 2;
          if (
            x >= box.x - pad && x <= box.x + box.w + pad &&
            y >= box.y - pad && y <= box.y + box.h + pad
          ) {
            const cx = box.x + box.w / 2;
            const cy = box.y + box.h / 2;
            const dist = Math.sqrt((cx - x) * (cx - x) + (cy - y) * (cy - y));
            if (dist < best) {
              best = dist;
              hit = region;
            }
          }
          continue;
        }
        const r = Math.max(28, region.radius || 34);
        const dx = region.x - x;
        const dy = region.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const labelDy = Math.abs((region.y - r + 4) - y);
        const inLabelBand = labelDy < 16 && Math.abs(dx) < Math.max(48, r * 1.2);
        if ((dist <= r + 8 || inLabelBand) && dist < best) {
          best = dist;
          hit = region;
        }
      }
      return hit;
    }

    function bindGraphCanvasPointer(canvas, host, getNodes, getSize, expanded, getRuntime, options) {
      const opts = options && typeof options === "object" ? options : {};
      canvas.onclick = function (event) {
        if (typeof getRuntime === "function") {
          const rt = getRuntime();
          if (rt) drugGraphRuntime = rt;
        }
        const nodes = getNodes();
        const size = getSize();
        if (!nodes || !size) return;
        const rect = canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / Math.max(1, rect.width)) * size.width;
        const y = ((event.clientY - rect.top) / Math.max(1, rect.height)) * size.height;
        const threshold = expanded ? 22 : 14;
        if (typeof opts.onBeforeNode === "function") {
          const early = opts.onBeforeNode(event, x, y, size);
          if (early) return;
        }
        const hit = hitTestGraphNode(nodes, x, y, threshold);
        if (hit) {
          showGraphNodeMenu(hit, event.clientX, event.clientY, host);
          return;
        }
        if (typeof opts.onClassOrEmpty === "function") {
          const handled = opts.onClassOrEmpty(event, x, y, size);
          if (handled) return;
        }
        if (document.getElementById("graph-node-menu")) {
          dismissGraphNodeMenu();
          return;
        }
        if (!expanded) openDrugGraphExpand();
      };
    }

    function expandLegendForMode(mode) {

          '<span class="legend-item legend-nut"><i></i>견과류</span>' +
          '<span class="legend-item legend-assoc"><i></i>Stated association</span>';

        '<span class="legend-item legend-safer"><i></i>Safer</span>' +
