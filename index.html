    let scoringTools = null;
    let scoringState = "loading";
    let scoringPromise = null;

    function loadScoringTools() {
      if (scoringPromise) return scoringPromise;
      scoringPromise = fetch("scoring-tools.json").then((res) => {
        if (!res.ok) throw new Error("load");
        return res.json();
      }).then((data) => {
        if (!Array.isArray(data)) throw new Error("load");
        scoringTools = data;
        scoringState = "ready";
      }).catch(() => {
        scoringTools = null;
        scoringState = "error";
      }).then(() => {
        if (state.screen === "scores" && document.getElementById("content")) render();
      });
      return scoringPromise;
    }

    const SCORE_AREA_ORDER = [
      "Rhinitis and rhinosinusitis",
      "Asthma",
      "Urticaria and angioedema",
      "Atopic dermatitis",
      "Drug hypersensitivity"
    ];
    const SCORE_AREA_OTHER = [
      "Reaction grading",
      "Mast cell disease",
      "Eosinophilic esophagitis"
    ];
    const SCORE_AREA_LABELS = {
      "Rhinitis and rhinosinusitis": "비염(Rhinitis)",
      "Asthma": "천식(Asthma)",
      "Urticaria and angioedema": "두드러기·혈관부종(Urticaria)",
      "Atopic dermatitis": "아토피피부염(Atopic dermatitis)",
      "Drug hypersensitivity": "약물알레르기(Drug hypersensitivity)"
    };

    function scoreAreaLabel(area) {
      return SCORE_AREA_LABELS[area] || area;
    }

    function scoringAreas() {
      const seen = [];
      const records = scoringTools || [];
      for (let i = 0; i < records.length; i += 1) {
        const area = records[i] && records[i].area;
        if (typeof area === "string" && area && seen.indexOf(area) === -1) seen.push(area);
      }
      const ordered = [];
      for (let i = 0; i < SCORE_AREA_ORDER.length; i += 1) {
        if (seen.indexOf(SCORE_AREA_ORDER[i]) !== -1) ordered.push(SCORE_AREA_ORDER[i]);
      }
      for (let i = 0; i < SCORE_AREA_OTHER.length; i += 1) {
        if (seen.indexOf(SCORE_AREA_OTHER[i]) !== -1) ordered.push(SCORE_AREA_OTHER[i]);
      }
      for (let i = 0; i < seen.length; i += 1) {
        if (ordered.indexOf(seen[i]) === -1) ordered.push(seen[i]);
      }
      return ordered;
    }

    function toolsInArea(area) {
      const out = [];
      const records = scoringTools || [];
      for (let i = 0; i < records.length; i += 1) {
        if (records[i] && records[i].area === area) out.push(records[i]);
      }
      return out;
    }

    function findScoreTool(id) {
      const records = scoringTools || [];
      for (let i = 0; i < records.length; i += 1) {
        if (records[i] && records[i].id === id) return records[i];
      }
      return null;
    }

    function scoreToolHasSource(tool) {
      if (!tool || typeof tool !== "object") return false;
      if (typeof tool.citation === "string" && tool.citation.trim()) return true;
      if (Array.isArray(tool.citations)) {
        for (let i = 0; i < tool.citations.length; i += 1) {
          const row = tool.citations[i];
          if (row && typeof row.citation === "string" && row.citation.trim()) return true;
          if (row && typeof row.pmid === "string" && row.pmid.trim()) return true;
        }
      }
      if (typeof tool.pubmed === "string" && tool.pubmed.trim()) return true;
      if (Array.isArray(tool.pmids) && tool.pmids.length) return true;
      if (typeof tool.doi === "string" && tool.doi.trim()) return true;
      return false;
    }

    function scoreToolSourceBadgeLabel(tool) {
      if (typeof tool.year === "number" && tool.year > 0) return String(tool.year);
      if (typeof tool.year === "string" && /^\d{4}$/.test(tool.year.trim())) return tool.year.trim();
      if (Array.isArray(tool.pmids) && tool.pmids.length && tool.pmids[0]) {
        return "PMID " + String(tool.pmids[0]);
      }
      return "Cited";
    }

    function scoreCitationHtml(tool) {
      const bits = [];
      if (typeof tool.citation === "string" && tool.citation) {
        bits.push('<p class="score-citation">' + esc(tool.citation) + "</p>");
      }
      const links = [];
      if (typeof tool.pubmed === "string" && tool.pubmed) {
        links.push('<a href="' + esc(tool.pubmed) + '" target="_blank" rel="noopener noreferrer">PubMed</a>');
      }
      if (typeof tool.doi === "string" && tool.doi) {
        links.push('<a href="https://doi.org/' + esc(tool.doi) + '" target="_blank" rel="noopener noreferrer">DOI</a>');
      }
      if (links.length) bits.push('<p class="score-links">' + links.join(" · ") + "</p>");
      if (!bits.length) {
        return '<p class="pending">Source pending.</p>';
      }
      return bits.join("");
    }

    function scoreAnswersFor(toolId) {
      const table = state.scoreAnswers || {};
      const row = table[toolId];
      return row && typeof row === "object" ? row : {};
    }

    function setScoreAnswer(toolId, itemId, value) {
      if (!state.scoreAnswers || typeof state.scoreAnswers !== "object") state.scoreAnswers = {};
      const prev = scoreAnswersFor(toolId);
      const next = {};
      const keys = Object.keys(prev);
      for (let i = 0; i < keys.length; i += 1) next[keys[i]] = prev[keys[i]];
      if (value == null || value === "") delete next[itemId];
      else next[itemId] = value;
      state.scoreAnswers[toolId] = next;
    }

    function renderScoreCalculator(tool) {
      const calc = (typeof SCORE_CALCULATORS !== "undefined" && SCORE_CALCULATORS.get)
        ? SCORE_CALCULATORS.get(tool.id)
        : null;
      if (!calc) {
        const gaps = (typeof SCORE_CALCULATORS !== "undefined" && SCORE_CALCULATORS.pendingGaps)
          ? SCORE_CALCULATORS.pendingGaps(tool.id)
          : null;
        let gapHtml = "";
        if (Array.isArray(gaps) && gaps.length) {
          gapHtml = '<p class="score-calc-missing-label">Still needed in repo before a calculator can ship:</p><ul class="score-calc-missing">';
          for (let g = 0; g < gaps.length; g += 1) {
            gapHtml += "<li>" + esc(gaps[g]) + "</li>";
          }
          gapHtml += "</ul>";
        }
        return '<section class="card score-calculator">' +
          '<h3 class="score-detail-heading">Calculator</h3>' +
          '<p class="pending">Source pending. Item stems and point scales are not cited from the full instrument in this preview.</p>' +
          gapHtml +
          "</section>";
      }
      const answers = scoreAnswersFor(tool.id);
      let itemsHtml = "";
      for (let i = 0; i < calc.items.length; i += 1) {
        const item = calc.items[i];
        const val = answers[item.id];
        itemsHtml += '<div class="score-item" data-score-item="' + esc(item.id) + '">' +
          '<p class="score-item-label">' + esc(item.label) + "</p>";
        if (item.type === "yesno") {
          itemsHtml += '<div class="score-choice-row" role="group" aria-label="' + esc(item.label) + '">' +
            '<button type="button" class="score-choice' + (val === "yes" ? " is-selected" : "") +
            '" data-score-answer="' + esc(tool.id) + '" data-score-item-id="' + esc(item.id) +
            '" data-score-value="yes">Yes (' + item.yesPoints + ")</button>" +
            '<button type="button" class="score-choice' + (val === "no" ? " is-selected" : "") +
            '" data-score-answer="' + esc(tool.id) + '" data-score-item-id="' + esc(item.id) +
            '" data-score-value="no">No (' + item.noPoints + ")</button></div>";
        } else if (item.type === "choice") {
          itemsHtml += '<div class="score-choice-col" role="radiogroup" aria-label="' + esc(item.label) + '">';
          for (let o = 0; o < item.options.length; o += 1) {
            const opt = item.options[o];
            itemsHtml += '<button type="button" class="score-choice' + (val === opt.value ? " is-selected" : "") +
              '" data-score-answer="' + esc(tool.id) + '" data-score-item-id="' + esc(item.id) +
              '" data-score-value="' + esc(opt.value) + '">' + esc(opt.label) + "</button>";
          }
          itemsHtml += "</div>";
        } else if (item.type === "number") {
          itemsHtml += '<div class="score-number-row">' +
            '<input type="number" id="score-num-' + esc(item.id) + '" class="score-number-input" ' +
            'min="' + item.min + '" max="' + item.max + '" step="' + item.step + '" ' +
            'value="' + (val != null ? esc(String(val)) : "") + '" ' +
            'data-score-number="' + esc(tool.id) + '" data-score-item-id="' + esc(item.id) + '" ' +
            'aria-label="' + esc(item.label) + '">' +
            (item.unit ? '<span class="score-number-unit">' + esc(item.unit) + "</span>" : "") +
            "</div>";
        }
        itemsHtml += "</div>";
      }
      const result = SCORE_CALCULATORS.compute(tool.id, answers);
      let resultHtml = "";
      if (result.status === "incomplete") {
        resultHtml = '<p class="score-result-line">Answer all items to see the score (' +
          result.answered + " of " + result.total + " answered).</p>";
      } else if (result.status === "ready") {
        resultHtml = '<p class="score-result-total">Score: <strong>' + esc(String(result.score)) +
          "</strong></p>";
        if (result.band) resultHtml += '<p class="score-result-band">' + esc(result.band) + "</p>";
        if (result.note) resultHtml += '<p class="score-result-note">' + esc(result.note) + "</p>";
      }
      return '<section class="card score-calculator">' +
        '<h3 class="score-detail-heading">Calculator</h3>' +
        '<p class="score-calc-source">Stated items from ' + esc(calc.source) + "</p>" +
        itemsHtml +
        '<div class="score-result">' + resultHtml +
        '<button type="button" class="score-reset" data-score-reset="' + esc(tool.id) + '">Reset</button>' +
        "</div></section>";
    }

    function renderScoreToolDetail(tool) {
      const measures = typeof tool.whatItMeasures === "string" ? tool.whatItMeasures : "";
      return backBtn("Scores") +
        '<h2 class="screen-title">' + esc(tool.name || "") + "</h2>" +
        '<p class="score-area-label">' + esc(tool.area || "") + "</p>" +
        '<section class="card score-detail">' +
        '<h3 class="score-detail-heading">What it measures</h3>' +
        '<p class="score-measures">' + esc(measures) + "</p>" +
        '<h3 class="score-detail-heading">Citation</h3>' +
        scoreCitationHtml(tool) +
        "</section>" +
        renderScoreCalculator(tool);
    }

    function renderScoreAreaList(area) {
      const tools = toolsInArea(area);
      let rows = "";
      for (let i = 0; i < tools.length; i += 1) {
        const tool = tools[i];
        const blurb = typeof tool.whatItMeasures === "string" ? tool.whatItMeasures : "";
        const hasCalc = typeof SCORE_CALCULATORS !== "undefined" && SCORE_CALCULATORS.get &&
          SCORE_CALCULATORS.get(tool.id);
        /* Source badge = citation presence in scoring-tools.json — not calculator presence. */
        const hasSource = scoreToolHasSource(tool);
        let badges = '<span class="score-tool-badges">';
        if (hasCalc) badges += '<span class="score-calc-badge">Calculator</span>';
        if (hasSource) {
          badges += '<span class="score-calc-badge score-source-badge" title="Citation in scoring-tools.json">' +
            esc(scoreToolSourceBadgeLabel(tool)) + "</span>";
        } else {
          badges += '<span class="score-calc-badge pending">Source pending</span>';
        }
        badges += "</span>";
        rows += '<button type="button" class="card score-tool-card" data-score-tool="' + esc(tool.id) + '">' +
          '<span class="score-tool-head"><span class="row-name">' + esc(tool.name || "") + "</span>" +
          badges +
          "</span>" +
          '<span class="score-tool-blurb">' + esc(blurb) + "</span></button>";
      }
      return backBtn("Scores") +
        '<h2 class="screen-title">' + esc(scoreAreaLabel(area)) + "</h2>" +
        '<div class="groups score-tool-list">' + rows + "</div>";
    }

    function renderScoreAreaBrowse() {
      if (scoringState === "error") {
        return backBtn("Scores") + '<h2 class="screen-title">Scoring tools</h2>' +
          '<p class="map-status">Scoring tools did not load.</p>';
      }
      if (scoringState !== "ready") {
        return backBtn("Scores") + '<h2 class="screen-title">Scoring tools</h2>';
      }
      const areas = scoringAreas();
      let rows = "";
      let otherStarted = false;
      for (let i = 0; i < areas.length; i += 1) {
        const area = areas[i];
        if (!otherStarted && SCORE_AREA_OTHER.indexOf(area) !== -1) {
          rows += '<h3 class="group-title score-other-heading">그외</h3>';
          otherStarted = true;
        }
        const count = toolsInArea(area).length;
        rows += '<button type="button" class="card score-area-card" data-score-area="' + esc(area) + '">' +
          '<span class="row-name">' + esc(scoreAreaLabel(area)) + "</span>" +
          '<span class="score-area-count">' + count + " " + (count === 1 ? "tool" : "tools") + "</span></button>";
      }
      return backBtn("Scores") +
        '<h2 class="screen-title">Scoring tools</h2>' +
        '<p class="search-prompt">Browse by condition area.</p>' +
        '<div class="groups score-area-list">' + rows + "</div>";
    }

    function renderScores() {
      if (state.scoreToolId) {
        const tool = findScoreTool(state.scoreToolId);
        if (tool) return renderScoreToolDetail(tool);
        state.scoreToolId = null;
      }
      if (state.scoreArea) return renderScoreAreaList(state.scoreArea);
      return renderScoreAreaBrowse();
    }

    function fold(value) {
      return String(value == null ? "" : value).normalize("NFC").toLowerCase();
    }

    function loadHospitals() {
      if (hospitalPromise) return hospitalPromise;
      hospitalPromise = fetch("allergy-hospitals.json").then((res) => {
        if (!res.ok) throw new Error("load");
        return res.json();
      }).then((data) => {
        if (!Array.isArray(data)) throw new Error("load");
        hospitalRecords = data;
        hospitalState = "ready";
        hospitalBounds = null;
      }).catch(() => {
        hospitalRecords = null;
        hospitalState = "error";
        hospitalBounds = null;
      }).then(() => {
        paintedFilterKey = "";
        if (state.screen === "map" && document.getElementById("map-panel")) paintMap();
      });
      return hospitalPromise;
    }

    function ensureBounds() {
      if (hospitalBounds) return hospitalBounds;
      if (!hospitalRecords || !hospitalRecords.length) return null;
      let minLat = Infinity;
      let maxLat = -Infinity;
      let minLng = Infinity;
      let maxLng = -Infinity;
      let any = false;
      for (let i = 0; i < hospitalRecords.length; i += 1) {
        const lat = Number(hospitalRecords[i].lat);
        const lng = Number(hospitalRecords[i].lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        any = true;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
      }
      if (!any) return null;
      hospitalBounds = { minLat: minLat, maxLat: maxLat, minLng: minLng, maxLng: maxLng };
      return hospitalBounds;
    }

    function textHit(hospital, query) {
      if (fold(hospital.name).indexOf(query) !== -1) return true;
      if (fold(hospital.address).indexOf(query) !== -1) return true;
      if (fold(hospital.district).indexOf(query) !== -1) return true;
      const docs = hospital.doctors;
      if (!docs || typeof docs !== "object") return false;
      const keys = Object.keys(docs);
      for (let i = 0; i < keys.length; i += 1) {
        const list = docs[keys[i]];
        if (!Array.isArray(list)) continue;
        for (let j = 0; j < list.length; j += 1) {
          if (fold(list[j]).indexOf(query) !== -1) return true;
        }
      }
      return false;
    }

    function hasDepartment(hospital, dept) {
      if (Array.isArray(hospital.depts) && hospital.depts.indexOf(dept) !== -1) return true;
      const docs = hospital.doctors;
      return !!(docs && typeof docs === "object" && Array.isArray(docs[dept]));
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
      const toRad = (deg) => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function applyLocateProximity(entries) {
      // Proximity rule: keep hospitals within 40 km of the user; if fewer than 3
      // are within 40 km, fall back to the nearest 5 by haversine distance.
      if (!state.mapLocateActive) return entries;
      if (!Number.isFinite(state.mapUserLat) || !Number.isFinite(state.mapUserLng)) return entries;
      const ranked = [];
      for (let i = 0; i < entries.length; i += 1) {
        const lat = Number(entries[i].hospital.lat);
        const lng = Number(entries[i].hospital.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        ranked.push({
          entry: entries[i],
          dist: haversineKm(state.mapUserLat, state.mapUserLng, lat, lng)
        });
      }
      ranked.sort((a, b) => a.dist - b.dist);
      const near = [];
      for (let i = 0; i < ranked.length; i += 1) {
        if (ranked[i].dist <= LOCATE_RADIUS_KM) near.push(ranked[i].entry);
      }
      if (near.length >= LOCATE_MIN_NEAR) return near;
      const fallback = [];
      for (let i = 0; i < ranked.length && fallback.length < LOCATE_FALLBACK_COUNT; i += 1) {
        fallback.push(ranked[i].entry);
      }
      return fallback;
    }

    function filteredHospitals() {
      const records = hospitalRecords || [];
      const query = fold(state.mapQuery).trim();
      const out = [];
      for (let i = 0; i < records.length; i += 1) {
        const hospital = records[i];
        if (!hospital || typeof hospital !== "object") continue;
        // Locate mode replaces region filtering while active; region chips clear locate.
        if (!state.mapLocateActive && state.mapRegion !== "all" && hospital.region !== state.mapRegion) continue;
        if (state.mapDept !== "all" && !hasDepartment(hospital, state.mapDept)) continue;
        if (state.mapJext && hospital.jext !== true) continue;
        if (state.mapFirazyr && hospital.firazyr !== true) continue;
        if (query && !textHit(hospital, query)) continue;
        out.push({ hospital: hospital, index: i });
      }
      return applyLocateProximity(out);
    }

    function clinicianTotal(entries) {
      let total = 0;
      for (let i = 0; i < entries.length; i += 1) {
        const docs = entries[i].hospital.doctors;
        if (!docs || typeof docs !== "object") continue;
        const keys = Object.keys(docs);
        for (let k = 0; k < keys.length; k += 1) {
          if (Array.isArray(docs[keys[k]])) total += docs[keys[k]].length;
        }
      }
      return total;
    }

    function countText(entries) {
      if (hospitalState !== "ready") return "";
      const hospitals = entries.length;
      const clinicians = clinicianTotal(entries);
      return hospitals + " " + (hospitals === 1 ? "hospital" : "hospitals") + ", " +
        clinicians + " " + (clinicians === 1 ? "clinician" : "clinicians");
    }

    function uniqueRegions(records) {
      const out = [];
      for (let i = 0; i < records.length; i += 1) {
        const region = records[i].region;
        if (typeof region === "string" && region && out.indexOf(region) === -1) out.push(region);
      }
      return out;
    }

    function uniqueDepts(records) {
      const out = [];
      for (let i = 0; i < records.length; i += 1) {
        const hospital = records[i];
        const depts = Array.isArray(hospital.depts) ? hospital.depts : [];
        for (let j = 0; j < depts.length; j += 1) {
          if (typeof depts[j] === "string" && depts[j] && out.indexOf(depts[j]) === -1) out.push(depts[j]);
        }
        const docs = hospital.doctors;
        if (!docs || typeof docs !== "object") continue;
        const keys = Object.keys(docs);
        for (let j = 0; j < keys.length; j += 1) {
          if (typeof keys[j] === "string" && keys[j] && out.indexOf(keys[j]) === -1) out.push(keys[j]);
        }
      }
      return out;
    }

    function filterChip(attr, value, label, pressed) {
      const klass = attr === "flag" ? "map-flag-toggle" : "map-chip";
      return '<button type="button" class="' + klass + '" data-map-' + attr + '="' + esc(value) + '" aria-pressed="' +
        (pressed ? "true" : "false") + '">' + esc(label) + "</button>";
    }

    function filtersHtml() {
      if (hospitalState !== "ready" || !hospitalRecords) return "";
      const regions = uniqueRegions(hospitalRecords);
      const depts = uniqueDepts(hospitalRecords);
      let regionChips = filterChip("region", "all", "All", state.mapRegion === "all");
      for (let i = 0; i < regions.length; i += 1) {
        regionChips += filterChip("region", regions[i], regions[i], state.mapRegion === regions[i]);
      }
      let deptChips = filterChip("dept", "all", "All", state.mapDept === "all");
      for (let i = 0; i < depts.length; i += 1) {
        deptChips += filterChip("dept", depts[i], depts[i], state.mapDept === depts[i]);
      }
      const flags = filterChip("flag", "jext", "Jext", state.mapJext) + filterChip("flag", "firazyr", "Firazyr", state.mapFirazyr);
      return '<div class="map-filter" role="group" aria-label="Region"><p class="map-filter-label">Region</p><div class="map-chips">' +
        regionChips + "</div></div>" +
        '<div class="map-filter" role="group" aria-label="Department"><p class="map-filter-label">Department</p><div class="map-chips">' +
        deptChips + "</div></div>" +
        '<div class="map-chips map-flags" role="group" aria-label="Jext and Firazyr">' + flags + "</div>";
    }

    function markWords(hospital) {
      const words = [];
      if (hospital.jext === true) words.push("Jext");
      if (hospital.firazyr === true) words.push("Firazyr");
      return words;
    }

    function clearUserMarker() {
      if (leafletUserMarker) {
        if (leafletMap) leafletMap.removeLayer(leafletUserMarker);
        leafletUserMarker = null;
      }
    }

    function clearLocateMode() {
      state.mapLocateActive = false;
      state.mapUserLat = null;
      state.mapUserLng = null;
      state.mapLocateError = "";
      clearUserMarker();
      if (leafletLocateControl && leafletLocateControl.getContainer) {
        const btn = leafletLocateControl.getContainer();
        if (btn) btn.classList.remove("is-active");
      }
    }

    function destroyLeafletMap() {
      clearUserMarker();
      leafletLocateControl = null;
      if (!leafletMap) return;
      leafletMap.remove();
      leafletMap = null;
      leafletMarkersLayer = null;
      leafletDidFit = false;
    }

    function scheduleLeafletInvalidate() {
      if (!leafletMap) return;
      requestAnimationFrame(() => {
        if (!leafletMap) return;
        leafletMap.invalidateSize(false);
      });
    }

    function syncUserMarker() {
      if (!leafletMap) return;
      if (!state.mapLocateActive || !Number.isFinite(state.mapUserLat) || !Number.isFinite(state.mapUserLng)) {
        clearUserMarker();
        return;
      }
      const latLng = L.latLng(state.mapUserLat, state.mapUserLng);
      if (leafletUserMarker) {
        leafletUserMarker.setLatLng(latLng);
        return;
      }
      const icon = L.divIcon({
        className: "map-user-icon",
        html: '<span class="map-user-dot" aria-hidden="true"></span>',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
      leafletUserMarker = L.marker(latLng, {
        icon: icon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 600
      }).addTo(leafletMap);
    }

    function requestLocate() {
      state.mapLocateError = "";
      if (!navigator.geolocation) {
        state.mapLocateError = "Location unavailable on this device.";
        paintMap();
        return;
      }
      state.mapLocateError = "Locating…";
      paintMap();
      navigator.geolocation.getCurrentPosition((pos) => {
        state.mapUserLat = pos.coords.latitude;
        state.mapUserLng = pos.coords.longitude;
        state.mapLocateActive = true;
        state.mapRegion = "all";
        state.mapLocateError = "";
        if (leafletLocateControl && leafletLocateControl.getContainer) {
          const btn = leafletLocateControl.getContainer();
          if (btn) btn.classList.add("is-active");
        }
        paintMap({ fit: true });
      }, (err) => {
        clearUserMarker();
        state.mapLocateActive = false;
        state.mapUserLat = null;
        state.mapUserLng = null;
        state.mapLocateError = err && err.code === 1
          ? "Location permission denied."
          : "Could not get current location.";
        if (leafletLocateControl && leafletLocateControl.getContainer) {
          const btn = leafletLocateControl.getContainer();
          if (btn) btn.classList.remove("is-active");
        }
        paintMap();
      }, {
        enableHighAccuracy: true,
        timeout: 12000,
        maximumAge: 60000
      });
    }

    function ensureLocateControl() {
      if (!leafletMap || leafletLocateControl) return;
      const LocateControl = L.Control.extend({
        options: { position: "bottomright" },
        onAdd: function () {
          const btn = L.DomUtil.create("button", "map-locate-btn");
          btn.type = "button";
          btn.title = "Current location";
          btn.setAttribute("aria-label", "Show hospitals near me");
          btn.innerHTML = MAP_LOCATE_SVG;
          if (state.mapLocateActive) btn.classList.add("is-active");
          L.DomEvent.disableClickPropagation(btn);
          L.DomEvent.disableScrollPropagation(btn);
          L.DomEvent.on(btn, "click", (event) => {
            L.DomEvent.stop(event);
            requestLocate();
          });
          return btn;
        }
      });
      leafletLocateControl = new LocateControl();
      leafletLocateControl.addTo(leafletMap);
    }

    function ensureLeafletMap() {
      const host = document.getElementById("map-leaflet");
      if (!host || typeof L === "undefined") return null;
      if (leafletMap && leafletMap.getContainer() === host) {
        ensureLocateControl();
        return leafletMap;
      }
      destroyLeafletMap();
      leafletMap = L.map(host, {
        zoomControl: false,
        attributionControl: true,
        scrollWheelZoom: false
      });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19
      }).addTo(leafletMap);
      leafletMarkersLayer = L.layerGroup().addTo(leafletMap);
      leafletDidFit = false;
      ensureLocateControl();
      return leafletMap;
    }

    function boundsFromEntries(entries) {
      let minLat = Infinity;
      let maxLat = -Infinity;
      let minLng = Infinity;
      let maxLng = -Infinity;
      let any = false;
      const list = entries || [];
      for (let i = 0; i < list.length; i += 1) {
        const lat = Number(list[i].hospital.lat);
        const lng = Number(list[i].hospital.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        any = true;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
      }
      if (state.mapLocateActive && Number.isFinite(state.mapUserLat) && Number.isFinite(state.mapUserLng)) {
        any = true;
        if (state.mapUserLat < minLat) minLat = state.mapUserLat;
        if (state.mapUserLat > maxLat) maxLat = state.mapUserLat;
        if (state.mapUserLng < minLng) minLng = state.mapUserLng;
        if (state.mapUserLng > maxLng) maxLng = state.mapUserLng;
      }
      if (!any) return null;
      return { minLat: minLat, maxLat: maxLat, minLng: minLng, maxLng: maxLng };
    }

    function fitLeafletToHospitals(entries) {
      if (!leafletMap) return;
      // All (without locate): Korea / all-hospital bounds. Named region or locate: filtered entry lat/lngs.
      const bounds = (!state.mapLocateActive && state.mapRegion === "all")
        ? ensureBounds()
        : boundsFromEntries(entries);
      if (!bounds) return;
      const sw = L.latLng(bounds.minLat, bounds.minLng);
      const ne = L.latLng(bounds.maxLat, bounds.maxLng);
      const latLngBounds = L.latLngBounds(sw, ne);
      if (!latLngBounds.isValid()) return;
      leafletMap.fitBounds(latLngBounds.pad(0.08), { animate: false });
      leafletDidFit = true;
    }

    function syncLeafletMarkers(entries, opts) {
      const map = ensureLeafletMap();
      if (!map || !leafletMarkersLayer) return;
      leafletMarkersLayer.clearLayers();
      if (hospitalState !== "ready") {
        syncUserMarker();
        scheduleLeafletInvalidate();
        return;
      }
      for (let i = 0; i < entries.length; i += 1) {
        const hospital = entries[i].hospital;
        const lat = Number(hospital.lat);
        const lng = Number(hospital.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        const selected = entries[i].index === state.mapSelected;
        const icon = L.divIcon({
          className: "map-pin-icon",
          html: '<button type="button" class="map-pin' + (selected ? " is-selected" : "") +
            '" data-map-id="' + entries[i].index + '" aria-pressed="' +
            (selected ? "true" : "false") + '" aria-label="' + esc(hospital.name) + '">' +
            MAP_PIN_SVG + "</button>",
          iconSize: [22, 32],
          iconAnchor: [11, 32]
        });
        const marker = L.marker([lat, lng], {
          icon: icon,
          keyboard: false
        });
        marker.addTo(leafletMarkersLayer);
        const el = marker.getElement();
        if (el) {
          if (L.DomEvent) {
            L.DomEvent.on(el, "mousedown", L.DomEvent.stopPropagation);
            L.DomEvent.on(el, "touchstart", L.DomEvent.stopPropagation);
          }
          const btn = el.querySelector("[data-map-id]");
          if (btn) {
            btn.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              const picked = Number(btn.dataset.mapId);
              if (Number.isInteger(picked) && picked >= 0) {
                state.mapSelected = picked;
                paintMap({ reveal: true });
              }
            });
          }
        }
      }
      syncUserMarker();
      if ((opts && opts.fit) || !leafletDidFit) fitLeafletToHospitals(entries);
      scheduleLeafletInvalidate();
    }

    function listHtml(entries) {
      let html = '<div class="map-rows">';
      for (let i = 0; i < entries.length; i += 1) {
        const hospital = entries[i].hospital;
        const words = markWords(hospital);
        const marks = words.length
          ? '<span class="map-marks">' + words.map((w) => '<span class="map-mark">' + esc(w) + "</span>").join("") + "</span>"
          : '<span class="map-marks" aria-hidden="true"></span>';
        html += '<button type="button" class="map-row" data-map-id="' + entries[i].index + '">' +
          '<span class="map-row-main"><span class="map-row-name">' + esc(hospital.name) + "</span>" +
          '<span class="map-region">' + esc(hospital.region || "") + "</span></span>" +
          marks + "</button>";
      }
      return html + "</div>";
    }

    function detailDepts(hospital) {
      const ordered = [];
      const depts = Array.isArray(hospital.depts) ? hospital.depts : [];
      for (let i = 0; i < depts.length; i += 1) {
        if (typeof depts[i] === "string" && depts[i] && ordered.indexOf(depts[i]) === -1) ordered.push(depts[i]);
      }
      const docs = hospital.doctors && typeof hospital.doctors === "object" ? hospital.doctors : {};
      const keys = Object.keys(docs);
      for (let i = 0; i < keys.length; i += 1) {
        if (ordered.indexOf(keys[i]) === -1) ordered.push(keys[i]);
      }
      let html = "";
      for (let i = 0; i < ordered.length; i += 1) {
        const dept = ordered[i];
        const names = Array.isArray(docs[dept]) ? docs[dept] : [];
        let people = "";
        for (let j = 0; j < names.length; j += 1) people += '<span class="map-clinician">' + esc(names[j]) + "</span>";
        html += '<div class="map-dept"><h4 class="map-dept-name">' + esc(dept) + "</h4>" + people + "</div>";
      }
      return html;
    }

    function detailHtml(hospital) {
      const words = markWords(hospital);
      const marks = words.length ? '<p class="map-marks">' + words.join(" ") + "</p>" : "";
      const address = typeof hospital.address === "string" && hospital.address
        ? '<p class="map-address">' + esc(hospital.address) + "</p>"
        : "";
      const tel = typeof hospital.tel === "string" && hospital.tel
        ? '<p class="map-tel">' + esc(hospital.tel) + "</p>"
        : "";
      return '<article class="card map-detail">' +
        '<button type="button" class="map-list-btn" data-map-list>List</button>' +
        '<h3 class="map-detail-name">' + esc(hospital.name) + "</h3>" +
        address + detailDepts(hospital) + tel + marks + "</article>";
    }

    function panelHtml(entries, selected) {
      if (hospitalState === "error") return '<p class="map-status">Hospital data did not load.</p>';
      if (hospitalState !== "ready") return "";
      if (selected) return detailHtml(selected.hospital);
      if (!entries.length) return '<p class="map-status">No hospitals match.</p>';
      return listHtml(entries);
    }

    function revealMapPanel() {
      const content = document.getElementById("content");
      const panel = document.getElementById("map-panel");
      if (!content || !panel) return;
      const contentRect = content.getBoundingClientRect();
      const panelRect = panel.getBoundingClientRect();
      const scale = contentRect.height / (content.clientHeight || 1) || 1;
      if (panelRect.top < contentRect.top) {
        content.scrollTop -= ((contentRect.top - panelRect.top) / scale) + 8;
      } else if (panelRect.bottom > contentRect.bottom) {
        content.scrollTop += ((panelRect.top - contentRect.top) / scale) - 8;
      }
    }

    function paintMap(opts) {
      const filters = document.getElementById("map-filters");
      const count = document.getElementById("map-count");
      const locateStatus = document.getElementById("map-locate-status");
      const mapHost = document.getElementById("map-leaflet");
      const panel = document.getElementById("map-panel");
      if (!filters || !count || !mapHost || !panel) return;
      const entries = hospitalState === "ready" ? filteredHospitals() : [];
      let selected = null;
      if (hospitalState === "ready" && state.mapSelected != null) {
        for (let i = 0; i < entries.length; i += 1) {
          if (entries[i].index === state.mapSelected) {
            selected = entries[i];
            break;
          }
        }
        if (!selected) state.mapSelected = null;
      }
      const filterKey = hospitalState + "|" + state.mapRegion + "|" + state.mapDept + "|" + state.mapJext + "|" + state.mapFirazyr + "|" + (state.mapLocateActive ? "1" : "0");
      const active = document.activeElement;
      let keep = null;
      if (active && active.closest && filters.contains(active)) {
        if (active.dataset.mapRegion) keep = { attr: "data-map-region", value: active.dataset.mapRegion };
        else if (active.dataset.mapDept) keep = { attr: "data-map-dept", value: active.dataset.mapDept };
        else if (active.dataset.mapFlag) keep = { attr: "data-map-flag", value: active.dataset.mapFlag };
      }
      if (filterKey !== paintedFilterKey || !filters.childElementCount) {
        filters.innerHTML = filtersHtml();
        paintedFilterKey = filterKey;
        if (keep && !(opts && opts.reveal)) {
          const escaped = window.CSS && CSS.escape ? CSS.escape(keep.value) : keep.value;
          const again = filters.querySelector("[" + keep.attr + '="' + escaped + '"]');
          if (again) again.focus({ preventScroll: true });
        }
      }
      count.textContent = countText(entries);
      if (locateStatus) locateStatus.textContent = state.mapLocateError || "";
      syncLeafletMarkers(entries, opts);
      panel.innerHTML = panelHtml(entries, selected);
      if (opts && opts.reveal && selected) {
        const listBtn = panel.querySelector("[data-map-list]");
        if (listBtn) listBtn.focus({ preventScroll: true });
        revealMapPanel();
      }
    }

    function renderMap() {
      return '<h2 class="screen-title">알레르기 진료 병원</h2>' +
        '<div class="map-search"><input id="map-search" type="search" value="' + esc(state.mapQuery) + '" placeholder="Search hospitals" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search hospitals"></div>' +
        '<div id="map-filters"></div>' +
        '<p class="map-count" id="map-count"></p>' +
        '<p class="map-locate-status" id="map-locate-status" aria-live="polite"></p>' +
        '<div class="map-block"><div class="map-canvas">' +
        '<div id="map-leaflet" class="map-leaflet"></div></div></div>' +
        '<div id="map-panel"></div>' +
        '<p class="map-source">Source: https://www.allergy.or.kr/general/hospitalSearch</p>';
    }

    function isAllergenNoteId(id) {
      if (typeof id !== "string") return false;
      if (id.indexOf("stated:") === 0) return true;
      const pools = ["foods", "pollen", "components"];
      for (let i = 0; i < pools.length; i += 1) {
        const rows = LITERATURE[pools[i]] || [];
        for (let j = 0; j < rows.length; j += 1) {
          if (rows[j] && rows[j].id === id) return true;
        }
      }
      return false;
    }

    function noteCrdNamesSorted() {
      const names = Object.keys(COMPONENT_OWNER);
      names.sort((a, b) => b.length - a.length);
      return names;
    }

    function linkCrdNamesInNoteText(text) {
      const raw = String(text || "");
      if (!raw) return "";
      const names = noteCrdNamesSorted();
      let hitName = null;
      let hitAt = -1;
      for (let i = 0; i < names.length; i += 1) {
        const name = names[i];
        const at = raw.indexOf(name);
        if (at < 0) continue;
        if (hitAt < 0 || at < hitAt || (at === hitAt && name.length > hitName.length)) {
          hitName = name;
          hitAt = at;
        }
      }
      if (!hitName) return esc(raw);
      const id = componentIdForName(hitName);
      if (!id) return esc(raw);
      return esc(raw.slice(0, hitAt)) +
        '<button type="button" class="note-crd-link" data-note-crd="' + esc(id) +
        '" data-note-crd-name="' + esc(hitName) + '" aria-label="Open component graph for ' +
        esc(hitName) + '">' + esc(hitName) + "</button>" +
        esc(raw.slice(hitAt + hitName.length));
    }

    function formatAllergenNoteHtml(raw) {
      const lines = String(raw || "").replace(/\r\n/g, "\n").split("\n");
      const titles = {
        "요약": 1,
        "등록 성분": 1,
        "등록 성분 (CRD)": 1,
        "문헌상 연관 식품": 1,
        "문헌상 연관 꽃가루·라텍스": 1,
        "문헌상 연관": 1,
        "같은 단백질 계열로 연결된 항목 (저장단백 제외)": 1,
        "성분 계열 연결 (CRD · 저장단백 제외)": 1,
        "같은 계열을 공유하는 다른 식품": 1,
        "점선 연관 (문헌상 연관 · 분자 기전 미지정)": 1,
        "미리보기에 표시된 연결": 1,
        "교차반응": 1,
        "상세": 1,
        "출처": 1
      };
      let html = "";
      let listOpen = false;
      function closeList() {
        if (listOpen) {
          html += "</ul>";
          listOpen = false;
        }
      }
      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i].trim();
        if (!line) {
          closeList();
          continue;
        }
        if (titles[line]) {
          closeList();
          html += '<h3 class="note-section">' + esc(line) + "</h3>";
          continue;
        }
        if (line.indexOf("▸ ") === 0) {
          closeList();
          html += '<h4 class="note-group">' + esc(line.slice(2).trim()) + "</h4>";
          continue;
        }
        if (line.charAt(0) === "•") {
          if (!listOpen) {
            html += '<ul class="note-list">';
            listOpen = true;
          }
          html += "<li>" + linkCrdNamesInNoteText(line.replace(/^•\s*/, "")) + "</li>";
          continue;
        }
        closeList();
        html += '<p class="note-para">' + linkCrdNamesInNoteText(line) + "</p>";
      }
      closeList();
      return html;
    }

    function allergenNoteMedia(item) {
      if (!item || typeof item.name !== "string") return null;
      const direct = ALLERGEN_NOTE_MEDIA[item.name];
      if (direct) return direct;
      const owners = COMPONENT_OWNER[item.name];
      if (!owners || !owners.length) return null;
      for (let i = 0; i < owners.length; i++) {
        const parent = ALLERGEN_NOTE_MEDIA[owners[i]];
        if (parent) {
          return {
            file: parent.file,
            alt: item.name + " · " + (parent.alt || owners[i]),
            credit: parent.credit,
            page: parent.page,
            viaParent: owners[i]
          };
        }
      }
      return null;
    }

    function renderNote() {
      const item = findNote(state.noteId);
      const backLabel = state.noteReturn === "allergen" ? "Allergens" : "Drugs";
      const text = item && typeof item.text === "string" ? item.text.trim() : "";
      const media = isAllergenNoteId(state.noteId) ? allergenNoteMedia(item) : null;
      const hero = media
        ? '<figure class="note-hero">' +
          '<img src="' + esc(media.file) + '" alt="' + esc(media.alt || item.name) + '" loading="lazy">' +
          '<figcaption class="note-hero-credit">' + esc(media.credit) + "</figcaption>" +
          "</figure>"
        : "";
      let body;
      if (text) {
        const pending = item.cited ? "" : '<p class="pending">Source pending.</p>';
        if (isAllergenNoteId(state.noteId)) {
          body = pending + '<div class="note-copy note-copy-allergen">' + formatAllergenNoteHtml(item.text) + "</div>";
        } else {
          body = pending + '<div class="note-copy">' + esc(item.text) + "</div>";
        }
      } else {
        body = '<p class="pending">Source pending.</p>';
      }
      return '<div class="note-screen">' + backBtn(backLabel) + hero +
        '<h2 class="screen-title">' + esc(item.name) + "</h2>" + body + "</div>";
    }


    function resetAdditiveState() {
      state.additiveQuery = "";
      state.additiveResults = [];
      state.additiveHasMore = false;
      state.additiveLoading = false;
      state.additiveLoadError = null;
      state.additiveSelected = null;
      state.additiveDetail = null;
      state.additiveDetailStatus = "idle";
    }

    function ensureAdditiveIndex() {
      if (typeof ADDITIVES === "undefined" || !ADDITIVES.loadDrugs) {
        return Promise.reject(new Error("Additives module missing"));
      }
      state.additiveLoading = true;
      state.additiveLoadError = null;
      return ADDITIVES.loadDrugs().then(() => {
        state.additiveLoading = false;
        return true;
      }).catch((err) => {
        state.additiveLoading = false;
        state.additiveLoadError = err && err.message ? err.message : "Failed to load drug index";
        throw err;
      });
    }

    function runAdditiveSearch(query) {
      const q = String(query || "").trim();
      state.additiveQuery = q;
      state.additiveSelected = null;
      state.additiveDetail = null;
      state.additiveDetailStatus = "idle";
      if (!q) {
        state.additiveResults = [];
        state.additiveHasMore = false;
        render();
        return;
      }
      ensureAdditiveIndex().then(() => {
        state.additiveResults = ADDITIVES.search(q);
        state.additiveHasMore = ADDITIVES.hasMore();
        render('#additive-search');
      }).catch(() => render());
    }

    function loadMoreAdditives() {
      if (typeof ADDITIVES === "undefined" || !ADDITIVES.hasMore()) return;
      const more = ADDITIVES.loadMore();
      state.additiveResults = state.additiveResults.concat(more);
      state.additiveHasMore = ADDITIVES.hasMore();
      render();
    }

    function openAdditiveDetail(code) {
      const hit = (state.additiveResults || []).find((row) => row && row.code === code) ||
        (state.additiveSelected && state.additiveSelected.code === code ? state.additiveSelected : null);
      if (!hit) return;
      state.additiveSelected = hit;
      state.additiveDetail = null;
      state.additiveDetailStatus = "loading";
      render();
      ADDITIVES.fetchDetail(hit.code).then((detail) => {
        if (!state.additiveSelected || state.additiveSelected.code !== hit.code) return;
        state.additiveDetail = detail;
        state.additiveDetailStatus = "ready";
        render();
      }).catch((err) => {
        if (!state.additiveSelected || state.additiveSelected.code !== hit.code) return;
        state.additiveDetail = null;
        state.additiveDetailStatus = "error";
        state.additiveLoadError = err && err.message ? err.message : "MFDS detail unavailable";
        render();
      });
    }

    function renderAdditiveResults() {
      const rows = Array.isArray(state.additiveResults) ? state.additiveResults : [];
      if (state.additiveLoading && !rows.length) {
        return '<p class="search-prompt">Loading drug index…</p>';
      }
      if (state.additiveLoadError && !rows.length && !state.additiveSelected) {
        return '<p class="search-prompt">' + esc(state.additiveLoadError) + "</p>";
      }
      if (!state.additiveQuery) {
        return '<p class="search-prompt">약물 이름을 검색하세요. MFDS 공개 목록만 검색합니다.</p>';
      }
      if (!rows.length) {
        return '<p class="search-prompt">\'' + esc(state.additiveQuery) + "'에 대한 검색 결과가 없습니다.</p>";
      }
      let html = '<div class="additive-results" role="list">';
      for (let i = 0; i < rows.length; i += 1) {
        const row = rows[i];
        html += '<button type="button" class="additive-result" role="listitem" data-additive-code="' +
          esc(row.code) + '"><span class="additive-result-name">' + esc(row.name) +
          '</span><span class="additive-result-company">' + esc(row.company) + "</span></button>";
      }
      html += "</div>";
      if (state.additiveHasMore) {
        html += '<button type="button" class="additive-more" data-additive-more>더 보기</button>';
      }
      return html;
    }

    function renderAdditiveDetail() {
      const item = state.additiveSelected;
      if (!item) return "";
      let body = "";
      if (state.additiveDetailStatus === "loading") {
        body = '<p class="search-prompt">정보를 가져오는 중…</p>';
      } else if (state.additiveDetailStatus === "error") {
        const mfdsUrl = (typeof ADDITIVES !== "undefined" && ADDITIVES.officialMfdsUrl)
          ? ADDITIVES.officialMfdsUrl(item.code)
          : "";
        body = '<p class="search-prompt">Source pending / MFDS detail unavailable' +
          (state.additiveLoadError ? ": " + esc(state.additiveLoadError) : "") + "</p>";
        if (mfdsUrl) {
          body += '<p class="additive-official"><a href="' + esc(mfdsUrl) +
            '" target="_blank" rel="noopener noreferrer">MFDS 공식 품목 상세 열기</a></p>';
        }
      } else if (state.additiveDetail) {
        const d = state.additiveDetail;
        body = '<section class="card additive-detail">' +
          '<h3 class="group-title">' + esc(d.name) + "</h3>" +
          '<p class="additive-company">' + esc(d.company || item.company) + "</p>" +
          '<div class="additive-block"><h4>주성분</h4><p>' + esc(d.ingredients) + "</p></div>" +
          '<div class="additive-block"><h4>첨가제</h4><p>' + esc(d.additives) + "</p></div>" +
          "</section>";
      }
      return '<button type="button" class="back" data-additive-back-list>' +
        '<svg viewBox="0 0 12 20" width="10" height="17" aria-hidden="true"><path d="M10 1.5 2 10l8 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        "<span>검색 결과</span></button>" + body;
    }

    function renderAdditives() {
      if (state.additiveSelected) {
        return backBtn("Drugs") + renderAdditiveDetail() +
          '<p class="additive-source">' + esc(ADDITIVES && ADDITIVES.sourceNotice ? ADDITIVES.sourceNotice : "") + "</p>";
      }
      const search = '<div class="drug-search additive-search">' +
        '<input id="additive-search" type="search" placeholder="약물 이름 검색" value="' +
        esc(state.additiveQuery) + '" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="약물 이름 검색">' +
        '<button type="button" class="additive-search-btn" data-additive-search>검색</button></div>';
      return backBtn("Drugs") +
        '<h2 class="screen-title additive-title">첨가제 검색</h2>' +
        '<p class="subtitle">MFDS-listed drugs · stated ingredients / additives only</p>' +
        search + renderAdditiveResults() +
        '<p class="additive-source">' + esc(ADDITIVES && ADDITIVES.sourceNotice ? ADDITIVES.sourceNotice : "") + "</p>";
    }

    const views = {
      home: renderHome,
      drugsHub: renderDrugsHub,
      drug: renderDrug,
      additives: renderAdditives,
      allergen: renderAllergen,
      scores: renderScores,
      map: renderMap,
      note: renderNote
    };

    function syncChrome() {
      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.setAttribute("aria-checked", String(button.dataset.direction === state.direction));
      });
      const tabbar = document.getElementById("tabbar");
      tabbar.hidden = false;
      let current = "home";
      if (state.screen === "map") current = "map";
      else if (state.screen === "drugsHub" || state.screen === "drug" || state.screen === "additives") current = "drugs";
      else if (state.screen === "allergen") current = "allergens";
      else if (state.screen === "scores") current = "scores";
      else if (state.screen === "note") {
        if (state.noteReturn === "drug") current = "drugs";
        else if (state.noteReturn === "allergen") current = "allergens";
        else if (state.noteReturn === "scores") current = "scores";
        else if (state.noteReturn === "map") current = "map";
        else current = "home";
      } else {
        current = "home";
      }
      tabbar.querySelectorAll(".tab").forEach((tab) => {
        if (tab.dataset.tab === current) tab.setAttribute("aria-current", "page");
        else tab.removeAttribute("aria-current");
      });
    }

    function sidePoint(el, side) {
      const x = el.offsetLeft;
      const y = el.offsetTop;
      const w = el.offsetWidth;
      const h = el.offsetHeight;
      if (side === "top") return { x: x + w / 2, y: y };
      if (side === "bottom") return { x: x + w / 2, y: y + h };
      if (side === "left") return { x: x, y: y + h / 2 };
      return { x: x + w, y: y + h / 2 };
    }

    function drawLinks() {}

    function render(focusSelector) {
      const content = document.getElementById("content");
      const searchEl = document.getElementById("drug-search");
      const searchFocused = !!(searchEl && document.activeElement === searchEl);
      const caretStart = searchFocused ? searchEl.selectionStart : null;
      const caretEnd = searchFocused ? searchEl.selectionEnd : null;
      const allergenSearchEl = document.getElementById("allergen-search");
      const allergenSearchFocused = !!(allergenSearchEl && document.activeElement === allergenSearchEl);
      const allergenCaretStart = allergenSearchFocused ? allergenSearchEl.selectionStart : null;
      const allergenCaretEnd = allergenSearchFocused ? allergenSearchEl.selectionEnd : null;
      const additiveSearchEl = document.getElementById("additive-search");
      const additiveSearchFocused = !!(additiveSearchEl && document.activeElement === additiveSearchEl);
      const additiveCaretStart = additiveSearchFocused ? additiveSearchEl.selectionStart : null;
      const additiveCaretEnd = additiveSearchFocused ? additiveSearchEl.selectionEnd : null;
      const mapEl = document.getElementById("map-search");
      const mapFocused = !!(mapEl && document.activeElement === mapEl);
      const mapCaretStart = mapFocused ? mapEl.selectionStart : null;
      const mapCaretEnd = mapFocused ? mapEl.selectionEnd : null;
      clearDrugGraphSession();
      destroyLeafletMap();
      syncChrome();
      const drugKey = (state.screen === "drug" || (state.screen === "drugsHub" && state.drugsSegment !== "additives"))
        ? (state.drugId || "")
        : "";
      const key = state.screen + "|" + state.direction + "|" + state.drugsSegment + "|" + drugKey;
      content.dataset.screen = state.screen;
      content.dataset.direction = state.direction;
      content.innerHTML = views[state.screen]();
      if (key !== paintedKey) content.scrollTop = 0;
      paintedKey = key;
      if (state.screen === "map") paintMap();
      if (state.screen === "drug" || (state.screen === "drugsHub" && state.drugsSegment !== "additives")) {
        const entry = selectedDrug();
        if (entry) mountDrugGraph(entry);
      }
      /* allergen-ui maa-30: mount whichever allergen graphs are in the DOM */
      if (state.screen === "allergen") {
        const focused = selectedAllergen();
        if (focused && document.getElementById("allergen-focus-graph")) {
          mountAllergenFocusGraph(focused);
        } else {
          if (document.getElementById("foods-schematic-graph")) mountFoodsSchematicGraph();
          if (document.getElementById("pollen-food-graph")) mountPollenFoodGraph();
          if (document.getElementById("component-graph")) mountComponentGraph();
        }
      }
      requestAnimationFrame(() => {
        drawLinks();
        if (state.screen === "map") scheduleLeafletInvalidate();
        if (searchFocused && !focusSelector) {
          const input = content.querySelector("#drug-search");
          if (input) {
            input.focus();
            const start = caretStart == null ? input.value.length : caretStart;
            const end = caretEnd == null ? start : caretEnd;
            try { input.setSelectionRange(start, end); } catch (err) { /* type=search may reject a caret */ }
          }
          return;
        }
        if (allergenSearchFocused && !focusSelector) {
          const input = content.querySelector("#allergen-search");
          if (input) {
            input.focus();
            const start = allergenCaretStart == null ? input.value.length : allergenCaretStart;
            const end = allergenCaretEnd == null ? start : allergenCaretEnd;
            try { input.setSelectionRange(start, end); } catch (err) { /* type=search may reject a caret */ }
          }
          return;
        }
        if ((additiveSearchFocused || focusSelector === "#additive-search") && !mapFocused) {
          const input = content.querySelector("#additive-search");
          if (input) {
            input.focus();
            const start = additiveCaretStart == null ? input.value.length : additiveCaretStart;
            const end = additiveCaretEnd == null ? start : additiveCaretEnd;
            try { input.setSelectionRange(start, end); } catch (err) { /* type=search may reject a caret */ }
          }
          return;
        }
        if (mapFocused && !focusSelector) {
          const input = content.querySelector("#map-search");
          if (input) {
            input.focus();
            const start = mapCaretStart == null ? input.value.length : mapCaretStart;
            const end = mapCaretEnd == null ? start : mapCaretEnd;
            try { input.setSelectionRange(start, end); } catch (err) { /* type=search may reject a caret */ }
          }
          return;
        }
        if (!focusSelector) return;
        const el = content.querySelector(focusSelector) || document.querySelector(focusSelector);
        if (el) el.focus();
      });
    }

    function resetDrugBrowseState() {
      /* Home / Drugs entry should open browse list, not the last queried drug. */
      state.drugId = null;
      state.drugQuery = "";
      state.drugClassFocus = null;
      state.drugGraphLayout = "default";
      state.drugSegment = "safer";
    }

    function openDetail(screen) {
      if (state.screen === "home" || state.screen === "map") state.returnTo = state.screen;
      if (screen === "drug") {
        state.screen = "drugsHub";
        state.drugsSegment = "cross";
        resetDrugBrowseState();
        render();
        return;
      }
      if (screen === "additives") {
        state.screen = "drugsHub";
        state.drugsSegment = "additives";
        resetAdditiveState();
        ensureAdditiveIndex().then(() => render()).catch(() => render());
        render();
        return;
      }
      state.screen = screen;
      if (screen === "scores") {
        state.scoreArea = null;
        state.scoreToolId = null;
        state.scoreAnswers = {};
        loadScoringTools();
      }
      render();
    }

    document.getElementById("content").addEventListener("click", (event) => {
      if (state.screen === "map") {
        const listControl = event.target.closest("[data-map-list]");
        if (listControl) {
          state.mapSelected = null;
          paintMap();
          return;
        }
        const regionControl = event.target.closest("[data-map-region]");
        if (regionControl) {
          clearLocateMode();
          state.mapRegion = regionControl.dataset.mapRegion;
          paintMap({ fit: true });
          return;
        }
        const deptControl = event.target.closest("[data-map-dept]");
        if (deptControl) {
          state.mapDept = deptControl.dataset.mapDept;
          paintMap();
          return;
        }
        const flagControl = event.target.closest("[data-map-flag]");
        if (flagControl) {
          if (flagControl.dataset.mapFlag === "jext") state.mapJext = !state.mapJext;
          if (flagControl.dataset.mapFlag === "firazyr") state.mapFirazyr = !state.mapFirazyr;
          paintMap();
          return;
        }
        const mapId = event.target.closest("[data-map-id]");
        if (mapId) {
          const picked = Number(mapId.dataset.mapId);
          if (Number.isInteger(picked) && picked >= 0) {
            state.mapSelected = picked;
            paintMap({ reveal: true });
          }
          return;
        }
      }
      const pick = event.target.closest("[data-pick-drug]");
      if (pick) {
        selectDrug(pick.dataset.pickDrug);
        return;
      }
      const pickAllergen = event.target.closest("[data-pick-allergen]");
      if (pickAllergen) {
        selectAllergen(pickAllergen.dataset.pickAllergen);
        return;
      }
      const noteCrd = event.target.closest("[data-note-crd]");
      if (noteCrd) {
        const crdId = noteCrd.dataset.noteCrd;
        const crdName = noteCrd.dataset.noteCrdName;
        if (crdName) state.graphFocus = { type: "component", name: crdName };
        state.screen = "allergen";
        selectAllergen(crdId);
        return;
      }
      const note = event.target.closest("[data-note-id]");
      if (note) {
        state.noteId = note.dataset.noteId;
        state.noteReturn = state.screen;
        state.screen = "note";
        render();
        return;
      }
      const go = event.target.closest("[data-go]");
      if (go) {
        if (go.dataset.go === "back") {
          if (state.screen === "note") {
            state.screen = state.noteReturn;
          } else if (state.screen === "scores" && state.scoreToolId) {
            state.scoreToolId = null;
          } else if (state.screen === "scores" && state.scoreArea) {
            state.scoreArea = null;
          } else {
            state.screen = state.returnTo || "home";
          }
        } else {
          openDetail(go.dataset.go);
          return;
        }
        render();
        return;
      }
      const drugBrowse = event.target.closest("[data-drug-browse]");
      if (drugBrowse) {
        const next = drugBrowse.dataset.drugBrowse;
        state.drugBrowseOpen = state.drugBrowseOpen === next ? null : next;
        render('[data-drug-browse="' + next + '"]');
        return;
      }
      const familyChip = event.target.closest("[data-component-family]");
      if (familyChip) {
        const next = familyChip.dataset.componentFamily || "all";
        if (state.componentFamilyFilter === next) return;
        state.componentFamilyFilter = next;
        /* Remount component graph with new family filter. */
        const runtime = graphRuntimeByRootId["component-graph"];
        if (runtime && runtime.anim) {
          cancelAnimationFrame(runtime.anim);
          runtime.anim = null;
        }
        delete graphRuntimeByRootId["component-graph"];
        render();
        return;
      }
      if (event.target.closest("[data-additive-search]")) {
        const input = document.getElementById("additive-search");
        runAdditiveSearch(input ? input.value : state.additiveQuery);
        return;
      }
      if (event.target.closest("[data-additive-more]")) {
        loadMoreAdditives();
        return;
      }
      if (event.target.closest("[data-additive-back-list]")) {
        state.additiveSelected = null;
        state.additiveDetail = null;
        state.additiveDetailStatus = "idle";
        render('#additive-search');
        return;
      }
      const additiveHit = event.target.closest("[data-additive-code]");
      if (additiveHit) {
        openAdditiveDetail(additiveHit.dataset.additiveCode);
        return;
      }
      const foodGroup = event.target.closest("[data-food-group]");
      if (foodGroup) {
        const next = foodGroup.dataset.foodGroup;
        state.foodGroupOpen = state.foodGroupOpen === next ? null : next;
        if (!(state.graphFocus && state.graphFocus.type === "food")) state.graphFocus = null;
        render('[data-food-group="' + next + '"]');
        return;
      }
      const graphFocusFood = event.target.closest("[data-graph-focus-food]");
      if (graphFocusFood && !event.target.closest("[data-note-id]")) {
        const name = graphFocusFood.dataset.graphFocusFood;
        state.graphFocus = { type: "food", name: name };
        render('[data-graph-focus-food="' + name + '"]');
        return;
      }
      const componentOwner = event.target.closest("[data-component-owner]");
      if (componentOwner) {
        const next = componentOwner.dataset.componentOwner;
        const closing = state.componentOwnerOpen === next;
        state.componentOwnerOpen = closing ? null : next;
        state.graphFocus = closing ? null : { type: "owner", name: next };
        render('[data-component-owner="' + next + '"]');
        return;
      }
      const graphFocusComp = event.target.closest("[data-graph-focus-component]");
      if (graphFocusComp && !event.target.closest("[data-note-id]")) {
        const name = graphFocusComp.dataset.graphFocusComponent;
        state.graphFocus = { type: "component", name: name };
        render('[data-graph-focus-component="' + name + '"]');
        return;
      }
      const foodGraphSeg = event.target.closest("[data-food-graph-segment]");
      if (foodGraphSeg) {
        const nextSeg = normalizeFoodGraphSegment(foodGraphSeg.dataset.foodGraphSegment);
        state.foodGraphSegment = nextSeg;
        state.graphFocus = foodFocusForSegment(nextSeg, state.graphFocus);
        if (nextSeg === "fish") state.foodGroupOpen = "생선 (notes)";
        else if (nextSeg === "meat") state.foodGroupOpen = "육류 (α-Gal notes)";
        else if (state.foodGroupOpen === "생선 (notes)" || state.foodGroupOpen === "육류 (α-Gal notes)") {
          state.foodGroupOpen = null;
        }
        render('[data-food-graph-segment="' + state.foodGraphSegment + '"]');
        return;
      }
      const scoreArea = event.target.closest("[data-score-area]");
      if (scoreArea) {
        state.scoreArea = scoreArea.dataset.scoreArea;
        state.scoreToolId = null;
        render();
        return;
      }
      if (event.target.closest("[data-drugs-hub-back]")) {
        resetDrugBrowseState();
        state.drugId = null;
        state.drugQuery = "";
        render();
        return;
      }
      const drugsSeg = event.target.closest("[data-drugs-segment]");
      if (drugsSeg) {
        const next = drugsSeg.dataset.drugsSegment === "additives" ? "additives" : "cross";
        if (state.drugsSegment === next) return;
        state.drugsSegment = next;
        if (next === "additives") {
          resetAdditiveState();
          ensureAdditiveIndex().then(() => render()).catch(() => render());
        } else {
          resetDrugBrowseState();
        }
        render();
        return;
      }
      const paperTopic = event.target.closest("[data-paper-topic-filter]");
      if (paperTopic) {
        const next = paperTopic.dataset.paperTopicFilter || "all";
        if (state.paperTopicFilter === next) return;
        state.paperTopicFilter = next;
        state.paperAiOpenPmid = null;
        render();
        return;
      }
      const paperAiToggle = event.target.closest("[data-paper-ai-toggle]");
      if (paperAiToggle) {
        const pmid = paperAiToggle.dataset.paperAiToggle;
        state.paperAiOpenPmid = state.paperAiOpenPmid === pmid ? null : pmid;
        render();
        return;
      }
      const scoreReset = event.target.closest("[data-score-reset]");
      if (scoreReset) {
        const tid = scoreReset.dataset.scoreReset;
        if (tid) {
          if (!state.scoreAnswers) state.scoreAnswers = {};
          state.scoreAnswers[tid] = {};
          render();
        }
        return;
      }
      const scoreAnswer = event.target.closest("[data-score-answer]");
      if (scoreAnswer) {
        setScoreAnswer(
          scoreAnswer.dataset.scoreAnswer,
          scoreAnswer.dataset.scoreItemId,
          scoreAnswer.dataset.scoreValue
        );
        render();
        return;
      }
      const scoreTool = event.target.closest("[data-score-tool]");
      if (scoreTool) {
        state.scoreToolId = scoreTool.dataset.scoreTool;
        render();
        return;
      }
      const expandBtn = event.target.closest("[data-graph-expand]");
      if (expandBtn) {
        const graphRoot = expandBtn.closest(".drug-graph");
        if (graphRoot && graphRoot.id) activateGraphRuntime(graphRoot.id);
        openDrugGraphExpand();
        return;
      }
      const drugClassBack = event.target.closest("[data-drug-class-zoom-back]");
      if (drugClassBack) {
        clearDrugClassFocus();
        render('[data-drug-graph-layout="class"]');
        return;
      }
      const drugGraphLayout = event.target.closest("[data-drug-graph-layout]");
      if (drugGraphLayout) {
        const next = drugGraphLayout.dataset.drugGraphLayout === "class" ? "class" : "default";
        state.drugGraphLayout = next;
        if (next !== "class") state.drugClassFocus = null;
        drugGraphMountedForId = null;
        render('[data-drug-graph-layout="' + next + '"]');
        return;
      }
      const drugSeg = event.target.closest("[data-drug-segment]");
      if (drugSeg) {
        patchDrugSegment(drugSeg.dataset.drugSegment);
        return;
      }
      const homeSeg = event.target.closest("[data-home-segment]");
      if (homeSeg) {
        state.homeSegment = homeSeg.dataset.homeSegment;
        render('[data-home-segment="' + state.homeSegment + '"]');
        return;
      }
      const allergenSeg = event.target.closest("[data-allergen-segment]");
      if (allergenSeg) {
        state.allergenSegment = allergenSeg.dataset.allergenSegment;
        clearAllergenFocus();
        state.graphFocus = null;
        state.componentOwnerOpen = null;
        state.foodGroupOpen = null;
        render('[data-allergen-segment="' + state.allergenSegment + '"]');
        return;
      }
      const score = event.target.closest("[data-score]");
      if (score) {
        state.scoreSegment = score.dataset.score;
        render('[data-score="' + state.scoreSegment + '"]');
      }
    });

    document.getElementById("content").addEventListener("input", (event) => {
      if (event.target.id === "map-search") {
        state.mapQuery = event.target.value;
        paintMap();
        return;
      }
      if (event.target.id === "allergen-search") {
        state.allergenQuery = event.target.value;
        paintAllergenSuggestions();
        return;
      }
      if (event.target.id === "additive-search") {
        state.additiveQuery = event.target.value;
        /* Live search so Korean IME users need not rely on 검색 / Enter alone. */
        runAdditiveSearch(event.target.value);
        return;
      }
      if (event.target.dataset && event.target.dataset.scoreNumber) {
        const tid = event.target.dataset.scoreNumber;
        const iid = event.target.dataset.scoreItemId;
        const raw = event.target.value;
        setScoreAnswer(tid, iid, raw === "" ? "" : raw);
        /* Update result without stealing number-field focus. */
        const result = document.querySelector(".score-result");
        if (result && typeof SCORE_CALCULATORS !== "undefined") {
          const out = SCORE_CALCULATORS.compute(tid, scoreAnswersFor(tid));
          let html = "";
          if (out.status === "incomplete") {
            html = '<p class="score-result-line">Answer all items to see the score (' +
              out.answered + " of " + out.total + " answered).</p>";
          } else if (out.status === "ready") {
            html = '<p class="score-result-total">Score: <strong>' + esc(String(out.score)) +
              "</strong></p>";
            if (out.band) html += '<p class="score-result-band">' + esc(out.band) + "</p>";
            if (out.note) html += '<p class="score-result-note">' + esc(out.note) + "</p>";
          }
          html += '<button type="button" class="score-reset" data-score-reset="' + esc(tid) + '">Reset</button>';
          result.innerHTML = html;
        }
        return;
      }
      if (event.target.id !== "drug-search") return;
      state.drugQuery = event.target.value;
      paintSuggestions();
    });

    document.getElementById("content").addEventListener("keydown", (event) => {
      if (event.target.id === "allergen-search" && event.key === "Enter") {
        if (event.isComposing || event.keyCode === 229) return;
        const allergenHit = exactAllergen(event.target.value);
        if (!allergenHit) return;
        event.preventDefault();
        selectAllergen(allergenHit.id);
        return;
      }
      if (event.target.id === "additive-search" && event.key === "Enter") {
        if (event.isComposing || event.keyCode === 229) return;
        event.preventDefault();
        runAdditiveSearch(event.target.value);
        return;
      }
      if (event.target.id !== "drug-search" || event.key !== "Enter") return;
      if (event.isComposing || event.keyCode === 229) return;
      const hit = exactDrug(event.target.value);
      if (!hit) return;
      event.preventDefault();
      selectDrug(hit.id);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (document.getElementById("graph-node-menu")) {
        event.preventDefault();
        dismissGraphNodeMenu();
        return;
      }
      if (document.getElementById("drug-graph-expand")) {
        event.preventDefault();
        closeDrugGraphExpand();
      }
    });

    document.getElementById("tabbar").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab]");
      if (!tab) return;
      const name = tab.dataset.tab;
      if (name === "home" || name === "map") {
        state.screen = name;
        state.returnTo = name;
        if (name === "home") loadPaperTimeline();
        render();
        return;
      }
      state.returnTo = state.screen === "map" ? "map" : "home";
      if (name === "drugs") {
        state.screen = "drugsHub";
        state.drugsSegment = "cross";
        resetDrugBrowseState();
        resetAdditiveState();
      } else if (name === "allergens") {
        state.screen = "allergen";
      } else {
        state.screen = "scores";
        state.scoreArea = null;
        state.scoreToolId = null;
        state.scoreAnswers = {};
        loadScoringTools();
      }
      render();
    });

    document.querySelector(".switcher").addEventListener("click", (event) => {
      const button = event.target.closest("[data-direction]");
      if (!button) return;
      state.direction = button.dataset.direction;
      render('[data-direction="' + state.direction + '"]');
    });

    function fitPhone() {
      const slot = document.querySelector(".phone-slot");
      const phone = document.querySelector(".phone");
      const switcher = document.querySelector(".switcher");
      const stage = document.querySelector(".stage");
      const stageStyle = getComputedStyle(stage);
      const pad = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom) + 12;
      const available = window.innerHeight - switcher.offsetHeight - pad;
      const scale = Math.min(1, available / 868);
      phone.style.transform = "scale(" + scale + ")";
      slot.style.width = (414 * scale) + "px";
      slot.style.height = (868 * scale) + "px";
    }

    window.addEventListener("resize", () => {
      fitPhone();
      drawLinks();
      if (state.screen === "map") scheduleLeafletInvalidate();
    });

    loadHospitals();
    loadScoringTools();
    loadPaperTimeline();
    fitPhone();
    render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLinks);
  </script>
</body>
</html>
